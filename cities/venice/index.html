/* Venice: the city's kit (loaded before the tiles).
   Map orientation: +x runs south (lower right), +y runs west (lower left), so the view looks north-east across the city
   from over the Giudecca: San Marco's basilica faces us (west), the Doge's Palace shows its piazzetta and Molo fronts,
   the Bacino di San Marco is the lagoon along the lower-right edge.
   Every street of the grid is a canal 26 u wide (bank to bank), its water VN.WL below the paving. Places end at their
   banks: a fondamenta (open paving with mooring poles) or houses rising straight from the water.
   Season: Carnival week in February. Low winter sun (kept as the usual upper-left light), a little mist on the
   lagoon, coats, scarves and woolly hats, and everywhere masks and costumes. */
const VN = {
  WL: -2.0,               // water level (u, below the paving at z 0)
  SH: 4.4,                // storey height
  paveC: '#D4CFC4', paveD: '#C3BDB0', paveJ: '#BCB5A8', paveL: '#E2DED5',
  istria: '#F3F0E8', istriaD: '#DCD7CB',
  water: '#8DB2A2', waterD: '#759D8E', waterL: '#B7D1C4', lagoon: '#A6C2BA', lagoonL: '#C3D8D1',
  WMASK: 'rgba(166,194,186,0)',   // a clear fill over open water: where lights reflect at night (SCENE.night.water)
  brick: '#B9674B', brickD: '#985039', roof: '#C66B4D', roofD: '#A4553B',
  shutter: '#5C7D5E', shutterB: '#7A5A3C', flood: '#A3BDB6', floodD: '#8DAAA3', floodL: '#C4D6D0',
  PLASTER: ['#E3B36C', '#DD917F', '#CB7552', '#EBC9A7', '#DCA27A', '#C95E4C', '#EDDDB9', '#E6A98E', '#D7B386', '#C98B5E'],
  COATS: ['#2F3A55', '#7A2E35', '#3E5A44', '#3B3F47', '#B48A5E', '#B53A35', '#D2A23A', '#3F7F80', '#5A4A6A', '#8C8F94', '#A35A3C', '#2B2E33'],
  SCARF: ['#C9463E', '#E6C24F', '#5F8FC9', '#E9E2CC', '#8E79C0', '#D98AA4', '#4F8A6A', '#E07A3F'],
  GOWN: ['#B5303A', '#2F4F8F', '#C9A13A', '#6B2F6E', '#1F6B5E', '#E9E2CC', '#D98AA4', '#2E2A26', '#C95E2C'],
  SHOPS: ['MASCHERE', 'BACARO', 'OSTERIA', 'TABACCHI', 'FARMACIA', 'PASTICCERIA', 'VETRI', 'GELATERIA', 'ALIMENTARI',
    'CAFFÈ', 'TRATTORIA', 'PANIFICIO', 'LIBRERIA', 'CICCHETTI', 'VINI', 'MERLETTI', 'CARTOLERIA', 'PIZZERIA',
    'ENOTECA', 'FORNO', 'BIGOLI', 'SPRITZ', 'GONDOLE', 'PESCHERIA', 'FRUTTA', 'FIORI', 'GIOIELLI', 'COSTUMI'],
};

/* ---------- small geometry ---------- */
/* keep the part of a convex polygon (any dims, first two coords used) on the left of a->b (side -1: the right) */
VN.clip = function (poly, a, b, side) {
  const out = [], s = side || 1, f = (p) => s * ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]));
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length], fp = f(p), fq = f(q);
    if (fp >= 0) out.push(p);
    if ((fp >= 0) !== (fq >= 0)) { const t = fp / (fp - fq); out.push(p.map((v, j) => v + (q[j] - v) * t)); }
  }
  return out;
};
/* clip a world polygon to the box x0..x1, y0..y1 */
VN.clipBox = function (P, x0, y0, x1, y1) {
  let o = P;
  o = VN.clip(o, [x0, 1], [x0, 0], 1); if (o.length < 3) return o;
  o = VN.clip(o, [x1, 0], [x1, 1], 1); if (o.length < 3) return o;
  o = VN.clip(o, [0, y0], [1, y0], 1); if (o.length < 3) return o;
  o = VN.clip(o, [1, y1], [0, y1], 1);
  return o;
};
VN.area = function (P) { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
/* a ground ellipse (world) of radii rx, ry round (x, y) at height z */
VN.ell = function (x, y, z, rx, ry, n) { const o = []; n = n || 18; for (let i = 0; i < n; i++) { const a = TAU * i / n; o.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry, z]); } return o; };
/* stripes (hatching) across a wide-px quad Q (4 points: a0 b0 b1 a1 along two edges), n lines */
VN.hatch = function (g, Q, n, col, w) { const s = []; for (let k = 1; k < n; k++) { const t = k / n; s.push(lerp(Q[0][0], Q[3][0], t), lerp(Q[0][1], Q[3][1], t), lerp(Q[1][0], Q[2][0], t), lerp(Q[1][1], Q[2][1], t)); } g.segs2(s, col, w || 0.3); };

/* ---------- ground ---------- */
/* trachyte masegni: grey slabs laid in courses along `ax`, faint joints, a few paler stones, dry scuffs */
VN.pave = function (g, x0, y0, x1, y1, o) {
  o = o || {};
  const P = K.rect(x0, y0, x1, y1, o.z || 0), z = o.z || 0, st = o.step || 2.4, ax = o.ax || 'x';
  g.fill(P, o.col || VN.paveC);
  const s = [];
  if (ax === 'x') {
    for (let y = Math.ceil(y0 / st) * st; y < y1; y += st) { const a = g.p(x0, y, z), b = g.p(x1, y, z); s.push(a[0], a[1], b[0], b[1]); }
    for (let y = Math.ceil(y0 / st) * st - st, r = 0; y < y1; y += st, r++) for (let x = x0 + ((r * 1.7) % 3.4); x < x1; x += 3.4) { const yy0 = Math.max(y0, y), yy1 = Math.min(y1, y + st); if (yy1 <= yy0) continue; const a = g.p(x, yy0, z), b = g.p(x, yy1, z); s.push(a[0], a[1], b[0], b[1]); }
  } else {
    for (let x = Math.ceil(x0 / st) * st; x < x1; x += st) { const a = g.p(x, y0, z), b = g.p(x, y1, z); s.push(a[0], a[1], b[0], b[1]); }
    for (let x = Math.ceil(x0 / st) * st - st, r = 0; x < x1; x += st, r++) for (let y = y0 + ((r * 1.7) % 3.4); y < y1; y += 3.4) { const xx0 = Math.max(x0, x), xx1 = Math.min(x1, x + st); if (xx1 <= xx0) continue; const a = g.p(xx0, y, z), b = g.p(xx1, y, z); s.push(a[0], a[1], b[0], b[1]); }
  }
  g.segs2(s, o.joint || VN.paveJ, 0.26);
  if (o.scuff !== false) g.scuff(P, { dir: -0.9, len: 1.6, c: VN.paveL, dens: 0.22, w: 0.55, spread: 1.2 });
};
/* the Istrian stone edge of a bank (a white kerb along the water) */
VN.edge = function (g, ax, c, a0, a1, side) {
  const w = 0.7, q = ax === 'x' ? K.rect(a0, Math.min(c, c + side * w), a1, Math.max(c, c + side * w)) : K.rect(Math.min(c, c + side * w), a0, Math.max(c, c + side * w), a1);
  g.fill(q, VN.istria);
};

/* ---------- windows and doors ---------- */
/* a window with an Istrian stone surround. o.arch: 'round' | 'ogee' | 'gothic'; o.sh: shutter colour (open);
   o.closed: shutters closed; o.glass: pale glass; o.sill: false */
VN.archPts = function (face, p, a0, a1, z0, z1, kind, e) {
  e = e || 0; const m = (a0 + a1) / 2, hw = (a1 - a0) / 2 + e, pts = [K.pt(face, p, a0 - e, z0 - e), K.pt(face, p, a1 + e, z0 - e)];
  if (!kind) return [pts[0], pts[1], K.pt(face, p, a1 + e, z1 + e), K.pt(face, p, a0 - e, z1 + e)];
  const n = 12, zt = z1 + e;
  if (kind === 'round') { const zs = zt - hw; for (let i = 0; i <= n; i++) { const t = Math.PI * i / n; pts.push(K.pt(face, p, m + Math.cos(t) * hw, zs + Math.sin(t) * hw)); } }
  else if (kind === 'gothic') { const zs = zt - hw * 1.5; for (let i = 0; i <= n; i++) { const t = 1 - 2 * i / n; pts.push(K.pt(face, p, m + t * hw, zs + (zt - zs) * Math.pow(1 - Math.abs(t), 0.6))); } }
  else {   // ogee: a reverse curve rising to a point (the Venetian gothic window)
    const zs = zt - hw * 1.9;
    for (let i = 0; i <= n; i++) { const t = 1 - 2 * i / n, a = Math.abs(t); const v = a > 0.5 ? Math.sqrt(Math.max(0, 1 - Math.pow((a - 0.5) / 0.5, 2))) * 0.55 : 0.55 + 0.45 * Math.pow(1 - a / 0.5, 1.6); pts.push(K.pt(face, p, m + t * hw, zs + (zt - zs) * v)); }
  }
  return pts;
};
VN.win = function (g, face, p, a0, a1, z0, z1, o) {
  o = o || {}; const w = a1 - a0, m = (a0 + a1) / 2;
  if (o.frame !== false) g.fill(VN.archPts(face, p, a0, a1, z0, z1, o.arch, 0.3), o.frameCol || VN.istria);
  const hole = VN.archPts(face, p, a0, a1, z0, z1, o.arch, 0);
  if (o.closed) {
    g.fill(hole, o.sh || VN.shutter);
    const Q = g.P(K.on(face, p, a0, a1, z0, z1 - (o.arch ? w * 0.4 : 0)));
    VN.hatch(g, Q.slice(0, 2).concat([Q[2], Q[3]]).map((q) => q), 6, shade(o.sh || VN.shutter, 0.28), 0.3);
    const ml = g.P([K.pt(face, p, m, z0), K.pt(face, p, m, z1 - (o.arch ? w * 0.3 : 0))]); g.segs2([ml[0][0], ml[0][1], ml[1][0], ml[1][1]], shade(o.sh || VN.shutter, 0.4), 0.35);
  } else {
    g.fill(hole, o.glass ? C.glass : (o.pane || '#4F5963')); if (o.lit !== false) g.mark({ win: o.lit == null ? true : o.lit });   // at night most panes are lit
    const P = g.P(hole); let cx = 0, cy = 0; for (const q of P) { cx += q[0]; cy += q[1]; } cx /= P.length; cy /= P.length;
    if (o.glass) g.segs2([cx - 0.5, cy + 1.2, cx + 0.8, cy - 1.2], C.white, 0.5);
    else g.segs2([cx - 0.7, cy + 1.3, cx + 0.4, cy - 0.5], '#7E8C96', 0.45);
    if (w > 1.6 && !o.glass) { const ml = g.P([K.pt(face, p, m, z0), K.pt(face, p, m, z1 - (o.arch ? w * 0.45 : 0))]); g.segs2([ml[0][0], ml[0][1], ml[1][0], ml[1][1]], VN.istriaD, 0.3); }
  }
  g.outline(hole, { w: 0.42, boil: false, ext: 0.15, c: '#3A3530' });
  if (o.sh && !o.closed) {
    const sw = Math.min(w * 0.5, 0.9), c = o.sh, cd = shade(c, 0.25);
    for (const [b0, b1] of [[a0 - 0.3 - sw, a0 - 0.3], [a1 + 0.3, a1 + 0.3 + sw]]) {
      const q = K.on(face, p, b0, b1, z0 - 0.05, z1 - (o.arch ? w * 0.4 : 0) + 0.05);
      g.fill(q, c); const Q = g.P(q); VN.hatch(g, Q, 5, cd, 0.28);
    }
  }
  if (o.sill !== false) g.fill(K.on(face, p, a0 - 0.4, a1 + 0.4, z0 - 0.4, z0 - 0.1), VN.istria);
  if (o.flowers) { const q = g.P([K.pt(face, p, a0 - 0.2, z0 - 0.1), K.pt(face, p, a1 + 0.2, z0 - 0.1)]); const cs = o.flowers; for (let i = 0; i < 4; i++) { const t = (i + 0.5) / 4; g.disc2([lerp(q[0][0], q[1][0], t), lerp(q[0][1], q[1][1], t) - 0.9], 0.75, cs[i % cs.length]); } g.fill2([[q[0][0], q[0][1] - 0.4], [q[1][0], q[1][1] - 0.4], [q[1][0], q[1][1] + 0.3], [q[0][0], q[0][1] + 0.3]], '#6E8A3E', true); }
};
VN.door = function (g, face, p, a0, a1, z1, o) {
  o = o || {}; const z0 = o.z0 || 0;
  g.fill(VN.archPts(face, p, a0, a1, z0, z1, o.arch, 0.35), VN.istria);
  const d = VN.archPts(face, p, a0, a1, z0, z1, o.arch, 0);
  g.fill(d, o.col || '#5A3E2E'); g.outline(d, { w: 0.45, boil: false, c: '#2E2620' });
  const k = g.p.apply(g, K.pt(face, p, a1 - (a1 - a0) * 0.25, z0 + (z1 - z0) * 0.45)); g.disc2(k, 0.3, C.gold || '#C9A44A');
};
/* floodlit stone at night: a pale fill's colour warmed and kept bright (dark openings and ink: undefined, graded as
   usual). k: how strongly lit (default 1) */
VN.litStone = function (k) {
  k = k == null ? 1 : k;
  return (c) => {
    if (typeof c !== 'string' || c[0] !== '#') return undefined;
    const p = hex2rgb(c), y = (0.299 * p[0] + 0.587 * p[1] + 0.114 * p[2]) / 255;
    if (y < 0.42) return undefined;
    return mix(shade(c, 0.62 - 0.2 * k), '#F0A050', 0.22 + 0.14 * k);
  };
};
/* a Venetian wall lantern on its bracket (at night only: nothing is drawn by day): a halo at height z on a face, a pool
   of light on the ground at `base` (the paving, or the water it is reflected in) */
VN.wallLamp = function (g, face, p, a, z, base, o) {
  const q = K.pt(face, p + 0.6, a, z); o = o || {};
  if (o.refl === false) VN.glowDry(g, 'lamp', q[0], q[1], q[2], Object.assign({ r: 1.3 }, o));
  else g.glow('lamp', q[0], q[1], q[2], Object.assign({ r: 1.3, base: base || 0 }, o));
};
/* a light whose reflection would fall on something standing in front of the water (a bridge, a building on the near
   bank): the engine lays a light's column on the first water below its foot, whatever stands over it, so this one is
   given no foot at all (no pool, no column; its halo and its share of the city's glow stay) */
VN.glowDry = function (g, kind, x, y, z, o) { const p = g.p(x, y, z); g.glow2(kind, p, [p[0], -1e6], Object.assign({}, o || {}, { pool: false })); };
/* a "nizioleto": the white painted street name on a wall, black letters (real words) */
VN.niz = function (g, face, p, a0, z0, word) {
  const h = 0.62, w = K.textW(word, h) + 0.8;
  g.fill(K.on(face, p + (face === 'L' ? 0.03 : 0.03), a0, a0 + w, z0, z0 + h + 0.7), '#F6F4EE');
  g.outline(K.on(face, p + 0.03, a0, a0 + w, z0, z0 + h + 0.7), { w: 0.3, boil: false, c: '#2E2A26', ext: 0 });
  K.text(g, face, p + 0.05, a0 + 0.4, z0 + 0.35, h, word, '#2E2A26', { w: 0.24 });

/* ---------- roofs, chimneys, altane ---------- */
/* a Venetian chimney: a slim stack crowned by a funnel ("a campana"), or a tall square one with a little roof */
VN.chimney = function (g, x, y, z, kind) {
  const stack = { t: '#C98463', l: '#D08E6C', r: '#A9674C' };
  if (kind === 'square') {
    K.box(g, x - 0.55, y - 0.55, x + 0.55, y + 0.55, z - 0.6, z + 3.4, stack, { w: 0.5, nohid: true });
    K.hip(g, x - 0.9, y - 0.9, x + 0.9, y + 0.9, z + 3.4, 0.8, VN.roof, { c: shade(VN.roof, 0.45) });
    return;
  }
  K.box(g, x - 0.45, y - 0.45, x + 0.45, y + 0.45, z - 0.6, z + 2.4, stack, { w: 0.5, nohid: true });
  const b = g.p(x, y, z + 2.4), t = g.p(x, y, z + 4.0), rb = 1.3, rt = 3.4;
  const f = [[b[0] - rb, b[1]], [b[0] + rb, b[1]], [t[0] + rt, t[1]], [t[0] - rt, t[1]]];
  g.fill2(f, '#D58C6A'); g.fill2([[b[0] + 0.2, b[1]], [b[0] + rb, b[1]], [t[0] + rt, t[1]], [t[0] + 0.6, t[1]]], '#B5714F');
  const lip = arcPts(t[0], t[1], rt, 0, TAU, 12).map((q) => [q[0], t[1] + (q[1] - t[1]) * 0.42]);
  g.fill2(lip, '#8E5A42');
  g.outline2(f, { w: 0.45, boil: false, c: '#5E3424' });

/* an altana: a wooden roof terrace on posts over the roof, a railing, sometimes washing on a line */
VN.altana = function (g, x, y, z, o) {
  o = o || {}; const W = o.W || 2.4, D = o.D || 2.0, h = o.h || 1.6, wood = '#9C7450';
  const posts = []; for (const [px, py] of [[x - W, y - D], [x + W, y - D], [x + W, y + D], [x - W, y + D]]) { const a = g.p(px, py, z - 0.8), b = g.p(px, py, z + h); posts.push(a[0], a[1], b[0], b[1]); }
  g.segs2(posts, '#6E4E30', 0.55);
  const deck = K.rect(x - W - 0.3, y - D - 0.3, x + W + 0.3, y + D + 0.3, z + h); g.fill(deck, '#B8875A');
  const sl = []; for (let i = 0; i < 7; i++) { const u = x - W + i * (2 * W / 6), a = g.p(u, y - D - 0.3, z + h), b = g.p(u, y + D + 0.3, z + h); sl.push(a[0], a[1], b[0], b[1]); } g.segs2(sl, '#8E6640', 0.28);
  g.outline(deck, { w: 0.5, boil: false, c: '#5E4228' });
  if (o.who) o.who(g, z + h);
  const rp = [], H2 = 1.3;
  for (let i = 0; i <= 8; i++) { const a = g.p(lerp(x - W - 0.3, x + W + 0.3, i / 8), y + D + 0.3, z + h), b = g.p(lerp(x - W - 0.3, x + W + 0.3, i / 8), y + D + 0.3, z + h + H2); rp.push(a[0], a[1], b[0], b[1]); }
  for (let i = 0; i <= 6; i++) { const a = g.p(x + W + 0.3, lerp(y - D - 0.3, y + D + 0.3, i / 6), z + h), b = g.p(x + W + 0.3, lerp(y - D - 0.3, y + D + 0.3, i / 6), z + h + H2); rp.push(a[0], a[1], b[0], b[1]); }
  g.segs2(rp, wood, 0.35);
  g.line([[x - W - 0.3, y + D + 0.3, z + h + H2], [x + W + 0.3, y + D + 0.3, z + h + H2], [x + W + 0.3, y - D - 0.3, z + h + H2]], { w: 0.45, boil: false, c: '#5E4228' });
  if (o.wash) VN.washLine(g, [x - W, y - D + 0.4, z + h + 2.6], [x + W, y - D + 0.4, z + h + 2.6], o.wash, 0.5);
};
/* a washing line between two world points with things hanging on it (cols: their colours) */
VN.washLine = function (g, a, b, cols, sag) {
  sag = sag == null ? 0.9 : sag; const pts = [];

/* a gondola: the long black asymmetric hull rising at both ends, the steel ferro at the bow, a red seat with riders,

  }

  const fu = -L * 0.72;

    const kk = 0.9, P = F.pt(fu, 0.12, 1.05), FP = g.p.apply(g, P), rel = (q) => [(q[0] - FP[0]) / kk, (q[1] - FP[1]) / kk];
    const sw = Math.sin((o.ph || 0) * TAU), lock = F.pt(fu + 1.2, Wd * 1.05, 1.5), blade = F.pt(fu - 1.4 - sw * 0.9, Wd * 2.3, 0.0);
    const lk = g.p.apply(g, lock), bl = g.p.apply(g, blade), dx = lk[0] - bl[0], dy = lk[1] - bl[1], top = [lk[0] + dx * 0.55, lk[1] + dy * 0.55];
    const oar = () => { g.line2([bl, top], { w: 0.65, c: '#8A6440', boil: false, ext: 0 }); g.fill2([[bl[0] - 1.1, bl[1] - 0.5], [bl[0] + 1.1, bl[1] + 0.5], [bl[0] + 0.8, bl[1] + 1.3], [bl[0] - 1.3, bl[1] + 0.6]], '#A07A50'); g.disc2(lk, 0.55, '#5A3E2E'); };
    const oarFar = F.nearV < 0;
    if (o.moored) { const r = VN.aboard(g, F, fu, 0.12, 1.05, Object.assign({}, o.who, { k: kk, top: '#F3F1EA', bot: '#2F2C2E' }), { pose: 'stand', back: true }); VN.gondolierKit(g, r, kk, o.who); return; }

    const r = VN.person(g, P[0], P[1], P[2], Object.assign({ hairStyle: 'short' }, o.who || {}, { dir: d, k: kk, top: '#F3F1EA', bot: '#2F2C2E', bare: false, scarf: null, beanie: null, fedora: null, colombina: null, lean: 0.12 + sw * 0.08, hands: [rel([top[0] - dx * 0.05, top[1] - dy * 0.05]), rel([top[0] - dx * 0.25, top[1] - dy * 0.25])] }));

/* the gondolier's striped jersey and straw boater with its ribbon */
VN.gondolierKit = function (g, r, k, who) {

/* one actor per piece of a moving boat. path(t) -> { x, y, ang, alpha, f } in tile-local u (or null); n pieces;
   draw opts o (kind, ...). Each piece is anchored at its end nearest the viewer. */
VN.boatActors = function (T, kind, path, o) {
  o = o || {}; const L = VN.BOAT[kind].L, N = o.n || (L > 6 ? 6 : 2), per = o.period || 60;
  const keyOf = o.key || (() => '');

    T.actor({ sample: o.sample || 0.2, period: per, grow: false, cast: o.cast, bias: o.bias || 0,
      at(t) {
        const s = path(t); if (!s) return null;
        const ca = Math.cos(s.ang), sa = Math.sin(s.ang), ue = ca + sa > 0 ? Math.min(u1, L) : Math.max(u0, -L);
        const n = LOOK.night;                                                 // a night pose of its own (its lights), the day's untouched
        return { x: s.x + ue * ca, y: s.y + ue * sa, z: VN.WL, key: Math.round(s.ang * 100) + '.' + keyOf(s) + (n ? 'n' : ''), ue, ang: s.ang, s2: s, n, alpha: s.alpha != null && s.alpha < 1 ? s.alpha : null };

      } });

};

/* ---- src/38_canals.js ---- */
/* The canals: the street grid of this city. Places stand on the 100 u grid (half 37); every gap between them is a
   canal 26 u wide from bank to bank, its water VN.WL below the paving; round the whole city lies the lagoon.
     the Grand Canal   along x at y = +50 (Cannaregio / Rialto / San Marco on its far bank, the squero, the market and
                       the Salute on its near bank), opening into the Bacino at the lower right;
     rio di Palazzo    along x at y = -50 (its last stretch between the Doge's Palace and the prisons, under the Bridge
                       of Sighs and the Ponte della Paglia);
     two rii           along y at x = -50 and x = +50;
     the lagoon        beyond every outer bank (the Bacino di San Marco along the lower right edge).
   A canal is described by its axis ('x': it runs along x at y = c; 'y': along y at x = c). Across a canal, v is the
   offset from its centre line (bank at v = +-13); along it, u.
   Bridges cross where two places' lanes meet; boats run lanes on a timetable (VN.LANES, checked offline by
   tools/search_boats.mjs so no two hulls ever meet, crossings and stops included). */
VN.CW = 13;   // half width of a canal, bank to bank
VN.map = function (ax, c, b) { return ax === 'x' ? (u, v, z) => [b + u, c + v, z] : (u, v, z) => [c + v, b + u, z]; };

/* ---------- a humpbacked bridge ----------
   Brick body with Istrian stone on the arch ring, the string course and the parapet caps; steps all the way up and
   down onto the banks (the ramps reach RY into each place, so the places keep a calle free there).
   Built as standing objects back to front so boats pass under it and people cross over it: the far ramp, the vault
   (the arch's inside seen through the opening), the span ({ under: 0 }), the near ramp, then the near parapet in three
   pieces ({ on: true }) so a walker on the steps is behind it. The face we see is at u = +W ('R' for a canal along x,
   'L' for one along y). o: { W, RY, HS, HC, AR, body, rail: 'brick' | 'iron' }.
   Returns { z(v), M, W, RY } for walkers. */
VN.hump = function (T, ax, c, b, o, role) {

  const O = (part, fpp, fn, opt) => { const own = (part === 'near' || part === 'pc') ? 'near' : 'far'; if (role === 'both' || role === own) T.obj(fpp, fn, opt); };
  const W = o.W || 2.4, RY = o.RY || 22, HS = o.HS || 4.4, HC = o.HC || 6.1, AR = o.AR || 7.3, Y = VN.CW, WL = VN.WL;
  const M = VN.map(ax, c, b), PW = 0.55, PH = 1.3, RISE = 0.4;
  const body = o.body || VN.brick, lit = ax === 'y', bodyF = lit ? shade(body, -0.02) : shade(body, 0.1), stone = VN.istria, stoneD = VN.istriaD;
  const deck = (v) => { const a = Math.abs(v); if (a >= RY) return 0; if (a >= Y) return HS * (RY - a) / (RY - Y); return HC - (HC - HS) * (a / Y) * (a / Y); };
  const step = (v) => Math.round(deck(v) / RISE) * RISE;
  const arch = (v) => WL + AR * Math.sqrt(Math.max(0, 1 - (v / Y) * (v / Y)));
  const treads = []; { let va = -RY - 0.6, z = 0; for (let v = -RY; v <= RY + 0.001; v += 0.05) { const s = Math.abs(v) >= RY ? 0 : Math.max(RISE, step(v)); if (Math.abs(s - z) > 1e-6) { treads.push([va, v, z]); va = v; z = s; } } treads.push([va, RY + 0.6, 0]); }
  const vr = (a, bb, n) => { const r = []; for (let i = 0; i <= n; i++) r.push(lerp(a, bb, i / n)); return r; };
  const fp = (u0, v0, u1, v1) => { const A = M(u0, v0, 0), B = M(u1, v1, 0); return [Math.min(A[0], B[0]) - T.cx, Math.min(A[1], B[1]) - T.cy, Math.max(A[0], B[0]) - T.cx, Math.max(A[1], B[1]) - T.cy]; };
  const L = (pts) => pts.map((p) => { const q = M(p[0], p[1], p[2]); return [q[0] - T.cx, q[1] - T.cy, q[2]]; });

    g.fill(L(vs.map((v) => [-W, v, deck(v) + PH]).concat(vs.slice().reverse().map((v) => [ui, v, deck(v) + PH]))), stone);
    g.line(L(vs.map((v) => [ui, v, deck(v) + PH])), { w: 0.55, c: '#5E4A3C', boil: false });
  };

      if (prev != null && z < prev && a >= va - 1e-6) { g.fill(L([[-W + PW, A, z], [W - PW, A, z], [W - PW, A, prev], [-W + PW, A, prev]]), stoneD); g.line(L([[-W + PW, A, prev], [W - PW, A, prev]]), { w: 0.35, boil: false, c: '#8E877A' }); }
      g.fill(L([[-W + PW, A, z], [W - PW, A, z], [W - PW, B, z], [-W + PW, B, z]]), z > 0 ? '#E7E2D6' : VN.paveC);
      if (z > 0) g.fine(L([[-W + PW, B, z], [W - PW, B, z]]), { w: 0.28, c: '#B9B2A4' });

    const vs = vr(va, vb, 12);

    const br = []; for (let z = 0.7; z < HS; z += 0.7) for (let v = va + (z * 1.7) % 1.4; v < vb - 0.8; v += 1.4) { if (deck(v + 0.8) < z + 0.3) continue; const a = g.p.apply(g, L([[W, v, z]])[0]), e = g.p.apply(g, L([[W, v + 0.8, z]])[0]); br.push(a[0], a[1], e[0], e[1]); }

    if (o.rail === 'iron') { const rl = []; for (let i = 0; i < vs.length; i++) { const a = g.p.apply(g, L([[W + 0.06, vs[i], deck(vs[i]) + 0.35]])[0]), e = g.p.apply(g, L([[W + 0.06, vs[i], deck(vs[i]) + PH - 0.15]])[0]); rl.push(a[0], a[1], e[0], e[1]); } g.segs2(rl, '#3A3F3C', 0.3); }

    g.fill(L(vs.map((v) => [ui, v, deck(v) + PH]).concat(vs.slice().reverse().map((v) => [W + 0.1, v, deck(v) + PH + 0.05]))), stone);
    for (const [e, on] of [[va, endA], [vb, endB]]) if (on) { const q = L([[ui, e, 0], [W + 0.05, e, 0], [W + 0.05, e, PH], [ui, e, PH]]); g.fill(q, stone); g.outline(q, { w: 0.5 }); const lp = L([[W - PW / 2, e, PH + 1.0]])[0]; VN.glowDry(g, 'lamp', lp[0], lp[1], lp[2], { r: 1.4 }); }   // at night a lantern on each end post (no reflection: the bridge stands over the water beside it)
    g.line(L(vs.map((v) => [W + 0.1, v, deck(v) + PH + 0.05])), { w: 0.85, boil: false });
    g.line(L(vs.map((v) => [ui, v, deck(v) + PH])), { w: 0.5 });
    g.line(L(vs.map((v) => [W + 0.05, v, deck(v) - 0.05])), { w: 0.55, c: '#6E5040' });

  O('far', fp(-W, -RY - 0.6, W, -Y), (g) => { g.boilP = 0.25; farWall(g, -RY, -Y); steps(g, -RY - 0.6, -Y); sideWall(g, -RY, -Y); }, { name: nm + ' far' });

    g.fill(L(all.map((v) => [W + 0.05, v, deck(v) - 0.4]).concat(all.slice().reverse().map((v) => [W + 0.05, v, deck(v)]))), stoneD);

    const ks = L([[W + 0.06, -0.6, arch(0) - 0.1], [W + 0.06, 0.6, arch(0) - 0.1], [W + 0.06, 0.8, arch(0) + 0.9], [W + 0.06, -0.8, arch(0) + 0.9]]); g.fill(ks, '#FFFFFF'); g.outline(ks, { w: 0.4, boil: false });

   What moves: the whole traffic of the city on a timetable (VN.LANES, phases from tools/search_boats.mjs): vaporetti
   calling at their stops on the Grand Canal and in the Bacino, gondolas with their gondoliers rowing standing up,
   delivery barges loaded with crates, the rubbish boat with its crane, water taxis, the ambulance boat with its light
   flashing, Carnival rowers in costume. Boats keep right and never meet; at a junction they cross in turn.
   The near strip of every canal (~5 u under the near bank's paving) is hidden: lanes keep clear of it. */

   - The campo: grey masegni with white bands, a carved vera da pozzo in the middle (old women talk beside it with their

/* (-100, 100) A squero: one of the last boatyards where gondolas are built and mended.
   - The squero's houses look like mountain chalets (the craftsmen came from the Dolomites): white plaster below,
     dark timber above, a long wooden balcony full of geraniums, broad eaves.
   - The slipway: a stone ramp sloping down into the rio, gondolas on trestles keel-up being scraped and tarred black,
     one on its side being varnished; planks, oars, a forcola on a bench. Every half minute the men launch a mended
     gondola: it slides down the slipway into the rio, floats, and is hauled back up.
   - Around it, a quiet corner: washing over a calle, a woman at her window, a man fishing from the fondamenta, a
     little sandolo moored with its oars shipped. */

  const P = VN.PLASTER, WL = VN.WL, SX0 = 12, SY0 = 7, SY1 = 31;

    // the slipway cut into the bank: its far side wall, the sloping floor of worn stones and timbers

    const tb = []; for (let x = SX0 + 1.5; x < 37; x += 2.2) { const a = g.p(x, SY0, slope(x)), b = g.p(x, SY1, slope(x)); tb.push(a[0], a[1], b[0], b[1]); } g.segs2(tb, '#8E7A60', 0.45);

/* ---- src/tiles/acquaalta.js ---- */
/* ACQUA ALTA in Piazza San Marco: everything that moves with the tide, added to the sanmarco tile (SM.tile).
   The tide cycle (SM.PT = 60 s) is phased so that the San Marco shot opens just before the siren:
     0      the siren wails from the clock tower; people start for the passerelle
     1.6    water wells up out of the drain grates; the lagoon climbs the Molo's wall
     8.6    the whole square is one sheet of water, the campanile and the arcades reflected in it
     21     the tide turns: the sheet breaks into pools, the pools shrink back into the drains
     29     dry; the boards empty; people come back out of the arcades and walk the square again
   The water is one actor drawn before everything standing on the square (anchored at its far corner): pools are
   discs round the drains (their wet rims painted first, so where pools join no edge shows), then the full sheet with
   its reflections. Its key is the level in 20 steps. */
SM.acqua = function (T) {
  const PT = SM.PT, WLV = VN.WL;
  const sh = SCENE.shots.find((s) => s.name === 'sanmarco');
  const OFF = sh ? ((((-0.5 - sh.a / 30) % PT) + PT) % PT) : 0;
  const tauOf = (t) => ((((t + OFF) % PT) + PT) % PT);
  const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const level = (tau) => tau < 1.3 ? 0 : tau < 6.6 ? ease((tau - 1.3) / 5.3) : tau < 21 ? 1 : tau < 29 ? 1 - ease((tau - 21) / 8) : 0;
  SM.level = (t) => level(tauOf(t)); SM.tau = tauOf;
  const Q = 12, HMAX = 0.8, X0 = -28.95, Y0 = -19.95, X1 = 37, Y1 = 37;
  // the drains: delay (the low ones near the basilica go first) and how far their pool reaches
  const DR = SM.DRAINS.map(([x, y], i) => ({ x, y, d: clamp(0.04 + (x + y + 40) / 160 * 0.32 + h1(i * 7.3) * 0.08, 0, 0.5), R: 11 + h1(i * 3.1) * 6 }));
  const radius = (dr, lq) => { const k = clamp((lq - dr.d) / (0.8 - dr.d), 0, 1); return dr.R * Math.pow(k, 0.75); };
  const depthAt = (x, y, lq) => {
    if (lq <= 0 || x < X0 || y < Y0) return 0;
    if (lq >= 0.8) return lq * HMAX;
    for (const dr of DR) { const r = radius(dr, lq); if (r > 0 && (x - dr.x) * (x - dr.x) + (y - dr.y) * (y - dr.y) < r * r * 0.85) return lq * HMAX * 0.7; }
    return 0;
  };
  SM.depth = (x, y, t) => depthAt(x, y, Math.round(SM.level(t) * Q) / Q);

  /* ---- the water ---- */
  T.actor({ grow: false, sample: 0.5, period: PT, bias: -2,
    at(t) { const lq = Math.round(level(tauOf(t)) * Q) / Q; if (lq <= 0) return null; const n = LOOK.night && lq >= 0.8; return { x: X0, y: Y0, z: 0, key: lq + (n ? 'n' : ''), lq, n }; },
    draw(g, st) {
      const lq = st.lq, h = lq * HMAX, ox = -X0, oy = -Y0;          // draw in tile coords, shifted so the anchor is the origin
      const W = (x, y, z) => [x + ox, y + oy, z];
      const clipW = (P) => VN.clipBox(P, X0, Y0, X1, Y1).map((p) => W(p[0], p[1], p[2]));
      if (lq < 0.8) {
        const rings = [], pools = [];
        const blob = (dr, r, z, i) => { const o = []; for (let k = 0; k < 26; k++) { const a = TAU * k / 26, m = 1 + 0.16 * Math.sin(3 * a + i * 1.7) + 0.09 * Math.sin(5 * a + i * 2.9) + 0.05 * Math.sin(8 * a + i); o.push([dr.x + Math.cos(a) * r * m, dr.y + Math.sin(a) * r * m, z]); } return o; };
        DR.forEach((dr, i) => { const r = radius(dr, lq); if (r <= 0.05) return; rings.push(clipW(blob(dr, r + 0.7, 0.02, i))); pools.push(clipW(blob(dr, r, h * 0.6, i))); });
        for (const q of rings) if (q.length > 2) g.fill(q, '#C4BEB2');

        for (const dr of DR) { const r = radius(dr, lq); if (r < 1.5) continue; const c = g.p.apply(g, W(dr.x, dr.y, h * 0.6)); for (const k of [0.35, 0.7]) g.line2(arcPts(c[0], c[1], r * k * SX * 0.5, 0, TAU, 14).map((q) => [q[0], c[1] + (q[1] - c[1]) * 0.55]), { w: 0.3, c: '#D4E3DD', boil: false, close: true }); }
      } else {

        g.fill(sheet, VN.flood);
        const S = g.P(sheet), sg = VN.area(S) > 0 ? 1 : -1;
        const clipS = (P) => { let o = P; for (let i = 0; i < 4 && o.length > 2; i++) o = VN.clip(o, S[i], S[(i + 1) % 4], sg); return o; };
        const refl = (pts, col) => { const P = clipS(g.P(pts.map((p) => W(p[0], p[1], 2 * h - p[2])))); if (P.length > 2) g.fill2(P, mix(col, VN.flood, 0.66), true); };
        // reflections: the Procuratie's arcade front, the basilica's facade, the palace, the campanile
        refl([[-29, -14, 0], [-29, 37, 0], [-29, 37, 12.6], [-29, -14, 12.6]], '#EFEAE0');
        refl([[-29, -14, 5.4], [-29, 37, 5.4], [-29, 37, 8.6], [-29, -14, 8.6]], '#8E96A0');
        refl([[-27, -20, 0], [-4, -20, 0], [-4, -20, 11.4], [-27, -20, 11.4]], '#F2E8DA');
        refl([[-24, -20, 1.5], [-7, -20, 1.5], [-7, -20, 5], [-24, -20, 5]], '#C9A13A');
        refl([[-2.5, -18, 0], [26, -18, 0], [26, -18, 4.4], [-2.5, -18, 4.4]], '#B9A898');
        refl([[-2.5, -18, 9], [26, -18, 9], [26, -18, 15.5], [-2.5, -18, 15.5]], '#E9B9A6');
        const r0 = g.cmds.length;
        refl([[-1, -8.5, 1.2], [4.5, -8.5, 1.2], [4.5, -14, 1.2], [4.5, -14, 28], [4.5, -8.5, 28], [-1, -8.5, 28]], '#C47454');
        refl([[-1, -8.5, 28], [4.5, -8.5, 28], [4.5, -14, 28], [4.5, -14, 37.4], [4.5, -8.5, 37.4], [-1, -8.5, 37.4]], '#F3EFE6');
        refl([[-1, -8.5, 37.4], [4.5, -8.5, 37.4], [4.5, -14, 37.4], [1.75, -11.25, 48.4]], '#6F9A86');
        refl([[30.3, -10.8, 1.3], [31.7, -10.8, 1.3], [31.7, -10.8, 14], [30.3, -10.8, 14]], '#B9A9A0');
        refl([[30.3, -0.8, 1.3], [31.7, -0.8, 1.3], [31.7, -0.8, 14], [30.3, -0.8, 14]], '#B9A9A0');
        if (st.n) {   // at night the flooded square doubles the lights: the floodlit fronts glow in it, every lamp lays a broken column on it
          const sea = nightColour(VN.flood), L1 = VN.litStone(1);
          g.mark({ nc: (c) => { const l = L1(c); return l ? mix(l, sea, 0.45) : undefined; } }, r0);
          for (const [x, y, z, col] of SM.LIGHTS) {
            if (x < X0 + 0.5 || y < Y0 + 0.5) continue;
            for (let k = 0; k < 6; k++) {
              const zz = 2 * h - z - 0.4 - k * 1.15, w = (1.5 - k * 0.17) * (0.8 + 0.4 * h1(x * 3 + y * 7 + k)), dx = (h1(x + y * 5 + k * 3) - 0.5) * 0.5;
              const a = g.p.apply(g, W(x + dx - w * 0.5, y + dx + w * 0.5, zz)), b = g.p.apply(g, W(x + dx + w * 0.5, y + dx - w * 0.5, zz));
              const P = clipS([[a[0], a[1]], [b[0], b[1]], [b[0], b[1] + 0.9], [a[0], a[1] + 0.9]]); if (P.length > 2) { g.fill2(P, 'rgba(' + col + ',' + (0.75 - k * 0.1).toFixed(2) + ')', true); g.mark({ nc: true }); }
            }
          }
        }
        const rp = []; for (let i = 0; i < 160; i++) { const x = lerp(X0 + 1, X1 - 1, h1(i * 1.37)), y = lerp(Y0 + 1, Y1 - 1, h1(i * 2.91)), c = g.p.apply(g, W(x, y, h)), l = 2 + h1(i * 5.3) * 6; rp.push(c[0] - l, c[1], c[0] + l, c[1]); }
        g.segs2(rp, VN.flood, 1.3);

    } });

  /* ---- the lagoon climbing the banks: the Molo's wall and the Grand Canal's, in pieces ---- */
  const lagZ = (t) => { const l = level(tauOf(t)); return WLV + (HMAX - WLV) * clamp(l * 1.15, 0, 1); };
  const band = (f, a0, a1) => T.actor({ grow: false, sample: 0.5, period: PT,
    at(t) { const z = Math.round((lagZ(t) - WLV) * 6) / 6 + WLV; if (z <= WLV + 0.05) return null; return f === 'R' ? { x: 36.9, y: a0, z: 0, key: z.toFixed(2), zz: z } : { x: a0, y: 36.9, z: 0, key: z.toFixed(2), zz: z }; },
    draw(g, st) {

      g.line(top, { w: 0.4, c: '#EEF5F1', boil: false, ext: 0 });
    } });
  for (let a = -37; a < 37; a += 12.4) { band('R', a, Math.min(37, a + 12.4)); band('L', a, Math.min(37, a + 12.4)); }

  /* ---- the passerelle: planks on trestles, in pieces so people sort with them ---- */
  const ZB = 1.5;
  const board = (x0, y0, x1, y1) => T.obj([x0, y0, x1, y1], function (g) {

    else for (let x = x0 + 0.6; x < x1; x += 2.6) for (const y of [y0 + 0.3, y1 - 0.3]) { const a = g.p(x, y, 0), b = g.p(x, y, ZB); legs.push(a[0], a[1], b[0], b[1]); }
    g.segs2(legs, '#6E5A44', 0.55);
    K.box(g, x0, y0, x1, y1, ZB - 0.3, ZB, { t: '#C49A68', l: '#A88052', r: '#94703F' }, { w: 0.5, nohid: true });
    const pl = []; if (alongY) for (let y = y0 + 1.2; y < y1; y += 1.2) { const a = g.p(x0, y, ZB), b = g.p(x1, y, ZB); pl.push(a[0], a[1], b[0], b[1]); } else for (let x = x0 + 1.2; x < x1; x += 1.2) { const a = g.p(x, y0, ZB), b = g.p(x, y1, ZB); pl.push(a[0], a[1], b[0], b[1]); }
    g.segs2(pl, '#9C7450', 0.25);
  }, { name: 'passerella' });
  const AX = -15.2, BY = -16, HB = 1.0;
  for (let y = -19.4; y < 35.6; y += 9.2) board(AX - HB, y, AX + HB, Math.min(35.6, y + 9.2));
  for (let x = AX + HB; x < 34.6; x += 9.6) board(x, BY - HB, Math.min(34.6, x + 9.6), BY + HB);

  const rLen = (r) => { let L = 0; for (let i = 0; i < r.length - 1; i++) L += Math.hypot(r[i + 1][0] - r[i][0], r[i + 1][1] - r[i][1]); return L; };
  const rAt = (r, s) => { for (let i = 0; i < r.length - 1; i++) { const a = r[i], b = r[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (s <= l || i === r.length - 2) { const u = clamp(s / l, 0, 1), dx = b[0] - a[0], dy = b[1] - a[1]; return { x: a[0] + dx * u, y: a[1] + dy * u, dir: Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3) }; } s -= l; } };
  const LA = rLen(routeA), LB = rLen(routeB);
  const zOn = (r, L, s) => { const e = Math.min(s, L - s); return e < 1.4 ? ZB * clamp(e / 1.4, 0, 1) : ZB; };
  // slots: route A every 3 s from 0.8 to 21, route B the same but 1.5 s later so they alternate where B joins A

  for (let k = -20; k * 1.6 + 0.8 <= 21; k++) { SL.push({ r: routeA, L: LA, t0: 0.8 + k * 1.6, who: null, join: k < 0 }); SL.push({ r: routeB, L: LB, t0: 0.8 + 0.8 + k * 1.6 + (LA - LB) / V, who: null, join: k < 0 }); }

    [[4, 2], [22, -6], [24, 14], [6, 18]], [[2, 28], [10, 4], [24, 2], [20, 18]], [[-20, 20], [-10, 12], [-24, -6]], [[8, -12], [28, -12], [28, 8], [8, 10]],
    [[-12, 26], [2, 14], [-10, -4]], [[-26, 14], [-2, 20], [-2, 34], [-20, 34]], [[14, -4], [32, 2], [26, 20]], [[-6, -14], [10, -12], [12, 0], [-4, -4]],
    [[-28, -10], [-18, -2], [-26, 24]], [[0, 34], [18, 20], [4, 10]], [[20, -12], [32, -8], [32, 12]],

    if (x > AX + 2) { const sB = clamp(34.5 - x, 1.5, 48); c.push({ sl: 'B', s: sB, px: 34.5 - sB, py: BY + (y > BY ? 1.6 : -1.6), r: routeB }); }
    c.forEach((q) => { q.d = Math.hypot(q.px - x, q.py - y); }); c.sort((a, b) => a.d - b.d); return c[0];
  };
  const people = loops.map((lp, i) => {

    if (!best) return null;

        else if (tau < P.arr) { const u = (tau - P.react) / (P.arr - P.react), x = lerp(P.p0.x, P.e.px, u), y = lerp(P.p0.y, P.e.py, u); s = walkSt(x, y, dirTo(P.e.px - P.p0.x, P.e.py - P.p0.y), tau * VW); }

        else { const q = loopAt(P.lp, tau), q2 = loopAt(P.lp, tau + 0.05); s = walkSt(q.x, q.y, dirTo(q2.x - q.x, q2.y - q.y), tau * VW); }
        const wd = s.z > 0.2 ? 0 : wadeQ(s.x, s.y, t);

  }
  // the rest of the slots: people coming onto the boards at their start (out of the Ala Napoleonica, off the Molo)
  SL.filter((sl) => sl.who == null && !sl.join).forEach((sl, j) => {
    const w = j % 4 === 1 ? VN.carnival(500 + j, ['bauta', 'gown', 'medico', 'cape'][j % 4]) : VN.who(500 + j);
    T.actor({ sample: 0.25, period: PT,
      at(t) {

/* ---------- for the page's guide (a DOM overlay): read the view, move the camera, hear the mode change ----------
   Cameras are in wide px (the 1920 x 1080 frame at zoom 1); SF.prj turns a world point into wide px. */
window.SF = SF;                                              // a top-level const is not a window property
const EV = {};
function emit(k, a) { for (const f of EV[k] || []) { try { f(a); } catch (e) { console.error(e); } } }
SF.on = (k, f) => { (EV[k] = EV[k] || []).push(f); };
SF.prj = (x, y, z) => prj(x, y, z || 0);
SF.wide = WIDE; SF.shots = SHOTS; SF.visit = VISIT; SF.bounds = BOUNDS;
SF.shot = (name) => shotByName(name);
SF.zMin = () => BOUNDS.z[0];
/* the camera on screen now, and how wide px map to CSS px */
SF.view = function () {
  const cv = APP.cv, cam = APP.mode === 'explore' ? APP.cam : (APP.filmCam || WIDE);
  const k = cv.width / cv.clientWidth, pz = cam.z * Math.min(cv.width / 1920, cv.height / 1080) / k;
  return { mode: APP.mode, z: cam.z, cx: cam.cx, cy: cam.cy, pz, w: cv.clientWidth, h: cv.clientHeight, paused: !!APP.paused, gliding: !!APP.glide };
};
SF.toScreen = function (wx, wy, v) { v = v || SF.view(); return [(wx - v.cx) * v.pz + v.w / 2, (wy - v.cy) * v.pz + v.h / 2]; };
/* the map's extent in wide px (every tile, satellites included) */
SF.boxes = () => SF.live.map((t) => t.bb.slice());              // every tile's and satellite's wide-px box
SF.extent = function () { let a = [1e9, 1e9, -1e9, -1e9]; for (const t of SF.live) { a[0] = Math.min(a[0], t.bb[0]); a[1] = Math.min(a[1], t.bb[1]); a[2] = Math.max(a[2], t.bb[2]); a[3] = Math.max(a[3], t.bb[3]); } return a; };
/* glide the explore camera to a camera {z, cx, cy}, a shot's name, or WIDE; it pulls back on long trips */
SF.glideTo = function (to, ms) {
  if (typeof to === 'string') to = shotByName(to) || WIDE;
  if (APP.mode !== 'explore') toExplore(false);
  const b = { z: to.z, cx: to.cx, cy: to.cy }; clampCam(b);
  const a = { z: APP.cam.z, cx: APP.cam.cx, cy: APP.cam.cy }, d = Math.hypot(b.cx - a.cx, b.cy - a.cy);
  const fit = 1920 * 0.7 / Math.max(1, d), lo = Math.min(a.z, b.z), dip = Math.max(0, Math.log(lo / Math.max(fit, WIDE.z)));
  APP.glide = { a, b, dip, t0: performance.now(), ms: ms || clamp(700 + d * 0.5 + dip * 260, 700, 1600) };
  APP.lastInput = performance.now();
};
function stepGlide() {
  const g = APP.glide, t = clamp((performance.now() - g.t0) / g.ms, 0, 1), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lz = Math.log(g.a.z) + (Math.log(g.b.z) - Math.log(g.a.z)) * e - g.dip * Math.sin(Math.PI * e);
  APP.cam = { z: Math.exp(lz), cx: g.a.cx + (g.b.cx - g.a.cx) * e, cy: g.a.cy + (g.b.cy - g.a.cy) * e };
  APP.dirtyZoom = performance.now(); APP.lastInput = performance.now();
  if (t >= 1) { APP.cam = Object.assign({}, g.b); APP.glide = null; APP.phase = (APP.phase + 1) % 6; emit('arrive', Object.assign({}, g.b)); }
}
SF.paper = () => (LOOK.night ? NIGHT.paper : [240, 238, 228]);     // the colour of the bare paper (the guide finds room for its notes)
SF.pause = () => { if (!APP.paused) togglePause(); };
SF.resume = () => { if (APP.paused) togglePause(); };
SF.togglePause = () => togglePause();
SF.replay = () => replay_();

</script>
