/* ---- src/36_barcelona.js ---- */
/* Barcelona's own kit. Eixample buildings are prisms on polygons (chamfered corners), so the facade helpers work on
   any face of a polygon, not only the engine's 'L' / 'R' planes: BC.faces(poly) gives each edge with its outward
   normal, whether we see it, its tone, and P(a, z, d) -> world point (a along the edge, d out from the wall).
   Then: sand-stone houses with green louvred shutters, wrought-iron balconies, senyeres, ground-floor shops with
   Catalan names, roof terraces; street furniture (plane trees, palms, Eixample lamps, Falqués's bench-lamps, the
   coloured recycling containers, Bicing docks, parked motorbikes, kiosks); the people of Barcelona (and its
   castellers); vehicles (black-and-yellow taxis, red buses, the open-top tourist bus, scooters, Bicing, vans) and
   boats. Everything in tile-local u unless the name ends in 2 (wide px). */
const BC = {};
const BP = {
  stone: '#ECDAB3', stoneR: '#D9C39A', stoneT: '#F4E8CE', sill: '#F6EEDB', groove: '#D4BE94',
  ochre: '#E4BE84', rose: '#EBC3A8', cream: '#F2E7CF', peach: '#EFCFA6', grey: '#DCD6CA',
  shut: '#5E8A63', shutD: '#456C4B', shutL: '#7FA77F', iron: '#2E3230', pane: '#4F5B63',
  pave: '#E4DED2', paveD: '#D2C9B7', paveL: '#EFEAE0', asph: '#CEC8BC', asphD: '#BAB3A5', kerb: '#A99F8C',
  sea: '#93C6CB', seaD: '#6FA6AF', seaL: '#BEDDDC', sand: '#F1E0B8', sandD: '#E2CB98', sandW: '#D9C08C',
  plane: '#97B65E', planeY: '#D5C35A', planeInk: '#566E31', roof: '#D59A72', roofD: '#B97D58',
  red: '#C9392E', yellow: '#F0C341', trenc: ['#4F8FBF', '#7DBF9A', '#E6C24F', '#E07A5A', '#F3F1EA', '#3F6FA8', '#9AC4D8', '#C9584B'],
  gold: '#D8AE48', green: '#3E6E52', greenD: '#2C5240',
};
BC.SHOPS = ['FARMÀCIA', 'FORN DE PA', 'FLECA', 'QUEVIURES', 'LLIBRERIA', 'PASTISSERIA', 'FRUITERIA', 'BODEGA', 'GRANJA',
  'VERMUTERIA', 'ESTANC', 'FERRETERIA', 'MERCERIA', 'PERRUQUERIA', 'VINS I CAVES', 'XURRERIA', 'PEIXATERIA', 'FLORISTERIA',
  'CAFÈ', 'BAR', 'TAPES', 'GELATS', 'ÒPTICA', 'CARNISSERIA', 'ESPARDENYES', 'BOTIGA'];
BC.shopWord = (seed) => BC.SHOPS[Math.floor(h1(Math.abs(Math.round(seed)) * 7 + 13) * BC.SHOPS.length) % BC.SHOPS.length];

/* ---------------- geometry of faces ---------------- */
/* a rectangle with 45° cuts at chosen corners. cut: { pp, pn, np, nn } leg lengths for the corners (x1,y1), (x1,y0),
   (x0,y1), (x0,y0). The polygon runs round the outline (any orientation: normals are found from the centroid). */
BC.cham = function (x0, y0, x1, y1, cut) {
  cut = cut || {}; const p = [];
  const nn = cut.nn || 0, pn = cut.pn || 0, pp = cut.pp || 0, np = cut.np || 0;
  if (nn) p.push([x0, y0 + nn], [x0 + nn, y0]); else p.push([x0, y0]);
  if (pn) p.push([x1 - pn, y0], [x1, y0 + pn]); else p.push([x1, y0]);
  if (pp) p.push([x1, y1 - pp], [x1 - pp, y1]); else p.push([x1, y1]);
  if (np) p.push([x0 + np, y1], [x0, y1 - np]); else p.push([x0, y1]);
  return p;
};
BC.bbox = (poly) => { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const [x, y] of poly) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); } return [a, b, c, d]; };
/* every edge of a polygon as a face: A, B, unit u along it, outward normal n, length L, vis, tone t (0 lit .. 1 shaded) */
BC.faces = function (poly) {
  let cx = 0, cy = 0; for (const p of poly) { cx += p[0] / poly.length; cy += p[1] / poly.length; }
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const A = poly[i], B = poly[(i + 1) % poly.length], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy);
    if (L < 1e-6) continue;
    const u = [dx / L, dy / L]; let n = [u[1], -u[0]];
    const mx = (A[0] + B[0]) / 2 - cx, my = (A[1] + B[1]) / 2 - cy; if (n[0] * mx + n[1] * my < 0) n = [-n[0], -n[1]];
    const F = { A, B, u, n, L, i, vis: n[0] + n[1] > 0.05, t: clamp(0.5 + 0.5 * (n[0] - n[1]), 0, 1) };
    F.P = (a, z, d) => [A[0] + u[0] * a + n[0] * (d || 0), A[1] + u[1] * a + n[1] * (d || 0), z];
    F.q = (a0, a1, z0, z1, d) => [F.P(a0, z0, d), F.P(a1, z0, d), F.P(a1, z1, d), F.P(a0, z1, d)];
    F.rtl = (u[0] - u[1]) < 0;          // the edge runs right-to-left on screen
    out.push(F);
  }
  return out;
};
BC.tone = (col, t) => { const c = K.tones(col); return mix(c.l, c.r, t); };
/* a prism on a convex polygon: the visible side faces, the top, the ink. Returns the faces. o: { w, c, nt, top, nb } */
BC.prism = function (g, poly, z0, z1, col, o) {
  o = o || {}; const c = K.tones(col), F = BC.faces(poly), lo = { w: o.w == null ? 0.9 : o.w, c: o.c, boil: o.boil }, li = { w: lo.w * 0.75, c: o.c, boil: o.boil };
  if (o.hid !== false) for (const f of F) if (!f.vis) g.line([[f.A[0], f.A[1], z0], [f.B[0], f.B[1], z0]], { w: 0.5, c: o.c, co: true });
  for (const f of F) if (f.vis) g.fill(f.q(0, f.L, z0, z1), mix(c.l, c.r, f.t));
  if (!o.nt) g.fill(poly.map((p) => [p[0], p[1], z1]), o.top || c.t);
  if (o.line === false) return F;
  const n = F.length;
  for (let i = 0; i < n; i++) {
    const f = F[i], prev = F[(i + n - 1) % n];
    if (f.vis && !o.nb) g.line([[f.A[0], f.A[1], z0], [f.B[0], f.B[1], z0]], lo);
    if (f.vis || prev.vis) g.line([[f.A[0], f.A[1], z0], [f.A[0], f.A[1], z1]], f.vis !== prev.vis ? lo : li);
    if (!o.nt) g.line([[f.A[0], f.A[1], z1], [f.B[0], f.B[1], z1]], f.vis ? li : lo);
    else if (f.vis) g.line([[f.A[0], f.A[1], z1], [f.B[0], f.B[1], z1]], lo);

};
/* text along a face, centred at a (reads left to right on screen whichever way the edge runs) */
BC.text = function (g, F, a, z0, h, str, col, o) {
  const P = F.rtl ? (s, z) => F.P(-s, z, 0.08) : (s, z) => F.P(s, z, 0.08);
  K.textP(g, P, F.rtl ? -a : a, z0, h, str, col, Object.assign({ center: true }, o || {}));
};
BC.sign = function (g, F, a0, a1, z0, z1, col, word, o) {
  o = o || {}; const q = F.q(a0, a1, z0, z1, 0.06), i0 = g.cmds.length; g.fill(q, col); if (o.line !== false) g.outline(q, { w: 0.4, c: shade(col, 0.5), boil: false, ext: 0 });

  // at night (o.lit) the fascia is lit: the board keeps its colour, its letters shine, a soft light round it
  if (o.lit) { g.mark({ nc: true }, i0); BC.litLines(g, i0); const c = g.p.apply(g, F.P((a0 + a1) / 2, (z0 + z1) / 2, 0.3)); g.glow2('lantern', c, c, { r: clamp(Math.abs(a1 - a0) * 0.32, 0.8, 1.6), col: '#FFD9A0' }); }

/* ---------------- facades ---------------- */
/* a tall balcony door with louvred shutters (persianes): open (folded back beside the opening) or closed */
BC.win = function (g, F, a0, a1, z0, z1, o) {
  o = o || {}; const sc = o.shut || BP.shut, w = a1 - a0;
  g.fill(F.q(a0 - 0.18, a1 + 0.18, z0 - 0.1, z1 + 0.28, 0.02), o.sc || BP.sill);
  const closed = o.closed, P = g.P(F.q(a0, a1, z0, z1, 0.04));
  if (closed) {
    g.fill2(P, sc, true);
    // at night a third of the closed persianes glow dimly: a lamp on in the room behind, light between the slats
    if (o.lit !== 0 && h2(Math.round(P[0][0] * 3), Math.round(P[0][1] * 3) + 77) < 0.35) g.mark({ nc: '#B98757', win: 1 });
    const lv = [], n = Math.max(3, Math.round((z1 - z0) / 0.32));
    for (let i = 1; i < n; i++) { const t = i / n; lv.push(lerp(P[0][0], P[3][0], t), lerp(P[0][1], P[3][1], t), lerp(P[1][0], P[2][0], t), lerp(P[1][1], P[2][1], t)); }
    const m0 = g.p.apply(g, F.P((a0 + a1) / 2, z0, 0.05)), m1 = g.p.apply(g, F.P((a0 + a1) / 2, z1, 0.05)); lv.push(m0[0], m0[1], m1[0], m1[1]);
    g.segs2(lv, shade(sc, 0.3), 0.22);
  } else {
    g.fill2(P, o.pane || BP.pane, true); g.mark({ win: o.lit == null ? true : o.lit });     // at night most balcony doors are lit
    const m0 = g.p.apply(g, F.P((a0 + a1) / 2, z0, 0.05)), m1 = g.p.apply(g, F.P((a0 + a1) / 2, z1, 0.05)), r0 = g.p.apply(g, F.P(a0, z1 - (z1 - z0) * 0.25, 0.05)), r1 = g.p.apply(g, F.P(a1, z1 - (z1 - z0) * 0.25, 0.05));
    g.segs2([m0[0], m0[1], m1[0], m1[1], r0[0], r0[1], r1[0], r1[1]], '#E7DFCC', 0.28);
    // the two shutter leaves folded back against the wall
    for (const [b0, b1] of [[a0 - w * 0.5, a0 - 0.05], [a1 + 0.05, a1 + w * 0.5]]) g.fill2(g.P(F.q(b0, b1, z0, z1, 0.06)), sc, true);
  }
  g.outline2(P, { w: 0.3, c: '#4A443B', boil: false, ext: 0 });
};
/* a wrought-iron balcony: a stone slab out from the face and a rail; curvy: the modernista whiplash rail */
BC.bal = function (g, F, a0, a1, z, o) {
  o = o || {}; const out = o.out || 0.85, rh = 1.05;
  const slab = [F.P(a0, z, 0), F.P(a1, z, 0), F.P(a1, z, out), F.P(a0, z, out)];
  g.fill(slab, BP.stoneT); g.fill(F.q(a0, a1, z - 0.3, z, out), BP.sill); g.line([F.P(a0, z - 0.3, out), F.P(a1, z - 0.3, out)], { w: 0.3, c: '#9A8A68', boil: false, ext: 0 });
  const segs = [], n = Math.max(2, Math.round((a1 - a0) / 0.38));
  for (let i = 0; i <= n; i++) { const a = lerp(a0 + 0.05, a1 - 0.05, i / n), b = g.p.apply(g, F.P(a, z, out - 0.05)), c = g.p.apply(g, F.P(a, z + rh, out - 0.05)); segs.push(b[0], b[1], c[0], c[1]); }
  g.segs2(segs, BP.iron, 0.22);
  const top = []; for (let i = 0; i <= 8; i++) { const a = lerp(a0, a1, i / 8), bump = o.curvy ? Math.sin(Math.PI * i / 8) * 0.35 : 0; top.push(g.p.apply(g, F.P(a, z + rh + bump, out - 0.05))); }

  if (o.curvy) { const sc = []; for (let i = 0; i < Math.max(1, Math.round((a1 - a0) / 1.1)); i++) { const a = lerp(a0 + 0.5, a1 - 0.5, (i + 0.5) / Math.max(1, Math.round((a1 - a0) / 1.1))), c = g.p.apply(g, F.P(a, z + 0.55, out - 0.04)); sc.push(c); } for (const c of sc) g.ring2(c, 0.9, { c: BP.iron, w: 0.26 }); }
  if (o.flag) BC.drape(g, F, (a0 + a1) / 2, z + rh, out, o.flag);
  if (o.pots) { const R = RNG(Math.round(a0 * 13 + z * 7)); for (let i = 0; i < 2; i++) { const c = g.p.apply(g, F.P(lerp(a0 + 0.4, a1 - 0.4, i), z, out * 0.5)); g.fill2([[c[0] - 0.6, c[1]], [c[0] + 0.6, c[1]], [c[0] + 0.5, c[1] - 1.0], [c[0] - 0.5, c[1] - 1.0]], '#B9674A', true); g.disc2([c[0], c[1] - 1.8], 1.1, R.pick(['#7FA65A', '#6E9A50', '#D85A7A', '#E07A5A'])); } }

/* a flag draped over a balcony rail: kind 'senyera' (nine stripes, yellow and red), 'merce' (a white banner) */
BC.drape = function (g, F, a, z, out, kind) {
  const w = 1.35, h = 2.3, a0 = a - w, a1 = a + w, P = (aa, zz) => F.P(aa, zz, out + 0.02);
  if (kind === 'senyera' || kind === true) {
    for (let i = 0; i < 9; i++) { const z0 = z - h + h * i / 9, z1 = z - h + h * (i + 1) / 9; g.fill([P(a0, z0), P(a1, z0), P(a1, z1), P(a0, z1)], i % 2 ? BP.red : BP.yellow); }
  } else {   // the flag of Barcelona: Sant Jordi's cross (red on white) and the senyera, quartered
    const q = (b0, b1, z0, z1) => [P(b0, z0), P(b1, z0), P(b1, z1), P(b0, z1)], zm = z - h / 2;
    for (const [b0, b1, z0, z1, cross] of [[a0, a, zm, z, true], [a, a1, z - h, zm, true], [a, a1, zm, z, false], [a0, a, z - h, zm, false]]) {

/* a ground-floor shopfront in a bay: painted frame, glass, a fascia with a Catalan name; kind 'closed' pulls the

BC.shop = function (g, F, a0, a1, h, kind, seed, col) {
  const R = RNG(seed * 31 + 7); col = col || R.pick(['#3E6E52', '#2F4A63', '#7A2E2A', '#5A4632', '#2E3230', '#8A6A3A', '#3F5F8F']);

    for (let i = 0; i <= 6; i++) { const t = Math.PI * i / 6; pts.push(F.P(m + Math.cos(t) * w, h - 1.2 - w + Math.sin(t) * w, 0.04)); }

  g.fill(F.q(a0, a1, 0, h - 0.4, 0.03), col);
  if (kind === 'closed') {
    const q = g.P(F.q(a0 + 0.25, a1 - 0.25, 0, h - 1.5, 0.05)); g.fill2(q, '#A9ADA8', true);
    const lv = []; for (let i = 1; i < 9; i++) { const t = i / 9; lv.push(lerp(q[0][0], q[3][0], t), lerp(q[0][1], q[3][1], t), lerp(q[1][0], q[2][0], t), lerp(q[1][1], q[2][1], t)); } g.segs2(lv, '#8C908B', 0.22);
    const c = [lerp(q[0][0], q[2][0], 0.5), lerp(q[0][1], q[2][1], 0.55)], sp = Math.hypot(q[1][0] - q[0][0], q[1][1] - q[0][1]) * 0.35;
    for (let i = 0; i < 3; i++) g.disc2([c[0] + (R() - 0.5) * sp, c[1] + (R() - 0.5) * 3], 1.4 + R() * 1.4, R.pick(['#E07A5A', '#4F8FBF', '#E6C24F', '#9A7CC0', '#7DBF9A', '#2A2622']));
    g.segs2([c[0] - sp * 0.4, c[1], c[0] + sp * 0.4, c[1] - 1.2], '#2A2622', 0.5);
  } else {
    const gl = F.q(a0 + 0.3, a1 - 0.3, 0.3, h - 1.65, 0.05), ig = g.cmds.length; g.fill(gl, kind === 'bar' ? '#E8D3A6' : '#CFE0E4');

    const G = g.P(gl), dots = [], id = g.cmds.length;
    for (let i = 0; i < 4; i++) { const t = (i + 0.5) / 4, b = [lerp(G[0][0], G[1][0], t), lerp(G[0][1], G[1][1], t)]; dots.push(b); }
    for (const b of dots) g.fill2([[b[0] - 0.7, b[1] - 0.2], [b[0] + 0.7, b[1] - 0.2], [b[0] + 0.7, b[1] - 1.6], [b[0] - 0.7, b[1] - 1.6]], R.pick(['#D98AA4', '#E6C24F', '#7FB7D9', '#C9584B', '#8FBF73', '#F3F1EA', '#E08A3C']), true);
    if (lit) g.mark({ nc: true }, id);
    const m = [(G[0][0] + G[2][0]) / 2, (G[0][1] + G[2][1]) / 2]; g.segs2([m[0] - 0.6, m[1] + 1.4, m[0] + 0.8, m[1] - 1.4], '#FBFAF4', 0.5);

/* The Eixample traffic plan: one-way streets that alternate direction, right-hand traffic, as a timetable.
   Streets along y stand at x = -150, -50, 50; streets along x at y = -150, -50, 50, 150 (they end at the seafront
   promenade, x = 137). Each street has three lanes across its 14 u roadway, measured to the right of the heading:
   the cycle lane on the left (r = -5.6: Bicing riders, scooters), the general lane (r = -1.6: cars, taxis, vans) and
   the bus-and-taxi lane on the right (r = +3.5). Every vehicle loops its lane with the common period P, so the whole

/* ---- src/tiles/streets.js ---- */
/* The Eixample grid. Every block is an octagon (its corners cut at 45°, the xamfrà): the places stand on the inner
   octagon (half 37, chamfer leg 10) and the streets tile draws the 5 m pavements round them (the kerb octagon, half
   43) and the 14 u roadways, so every crossing opens into an octagonal plaza. The grid runs on past the map's far
   edges (the next blocks' pavement corners show at the cut). Grey "flower" panot on the pavements; Gaudí's blue
   hexagonal panot along Passeig de Gràcia (y = 50, west of x = 50). Zebras cross each arm where the chamfer begins.
   One-way streets with a bus lane on the right and a cycle lane on the left (src/37_traffic.js).
   The seafront: streets along x end at the promenade (x 137–147, palms planted by the places beside it); beyond it

   people on the pavements. Standing furniture belongs to the places (BC.block), not to this tile. */

/* (0,-100) The Sagrada Família on its own Eixample block. The plan is a Latin cross: the nave runs along x from the
   apse (-x, north-west) to the Glory façade (+x, south-east, facing the viewer's right, still being built); the
   transept runs along y with the Passion façade at +y (south-west, facing us on the left) and the Nativity façade at
   -y (behind). Heights after the OSM data card (refs/sagrada-fam-lia.md) at 0.378 u per m, the plan at 0.65 u per m:
   the Jesus tower over the crossing (64 u, a white four-armed cross on top, 70), the four evangelists round it (51),
   Mary's tower over the apse with its star (52), four spindle bell towers on each transept façade (37-42) with
   coloured mosaic finials; the nave walls 17 u with a steep roof and pinnacles. Passion: pale stone, the inclined
   bone columns of the portico, the pediment. Glory: a concrete frame, the stumps of its towers in scaffolding.
   Who: the tourist queue at the Passion door, a guide, a school group in caps, people photographing from the
   pavement, workers in hi-vis vests at the site. What moves: two tower cranes slew, trolley and hoist stone blocks from
   the yard onto the Glory towers (a 36 s cycle each, phase-shifted), the hooks swinging their loads up. */
SF.tile('sagrada', 0, -100, { rim: 12 }, function (T) {
  const NL = { warm: '#FFE2B8', white: '#FFF6EA' };     // at night: the façades' warm floodlight, the new towers' whiter light
  const PAS = { t: '#E6DECF', l: '#DCD3C2', r: '#C6BCA8' }, NAT = { t: '#D6C6A6', l: '#C9B794', r: '#B09E7C' }, NEW = { t: '#F1EEE7', l: '#EDE9E0', r: '#D7D2C7' };
  /* a spindle bell tower: a round shaft tapering like a parabola, slits spiralling up, a mosaic mitre on top */
  const spindle = (g, x, y, z0, h, r0, col, seed) => {
    const R = RNG(seed), base = g.p(x, y, z0), N = 18, L = [], Rr = [];
    for (let i = 0; i <= N; i++) { const t = i / N, z = z0 + h * t, r = r0 * Math.sqrt(1 - t * 0.93), p = g.p(x, y, z); L.push([p[0] - r * SX, p[1]]); Rr.push([p[0] + r * SX, p[1]]); }
    g.fill2(L.concat(Rr.slice().reverse()), col.l);
    g.fill2(Rr.map((p, i) => [lerp(L[i][0], p[0], 0.5), p[1]]).concat(Rr.slice().reverse()), col.r);
    const sl = []; for (let i = 1; i < N - 3; i++) { const t = i / N, p = g.p(x, y, z0 + h * t), r = r0 * Math.sqrt(1 - t * 0.93) * SX, ph = (i * 0.9 + seed) % 2 - 1; sl.push(p[0] + ph * r * 0.7 - 0.35, p[1] - 1.2, p[0] + ph * r * 0.7 + 0.35, p[1] + 0.2); }
    g.segs2(sl, '#4A4540', 0.9);
    g.line2(L, { w: 0.7 }); g.line2(Rr, { w: 0.7 });
    // the finial: a mitre of coloured mosaic with white balls
    const top = g.p(x, y, z0 + h), m = R.pick(['#D8AE48', '#C9392E', '#E9E2D2', '#6FA36B']);
    const im = g.cmds.length;
    g.fill2([[top[0] - 1.8, top[1] + 0.5], [top[0] + 1.8, top[1] + 0.5], [top[0] + 1.1, top[1] - 5.5], [top[0], top[1] - 7.5], [top[0] - 1.1, top[1] - 5.5]], m, true);
    g.fill2([[top[0], top[1] + 0.5], [top[0] + 1.8, top[1] + 0.5], [top[0] + 1.1, top[1] - 5.5], [top[0], top[1] - 7.5]], shade(m, 0.14), true);
    for (const [dx, dy] of [[-1.5, -1], [1.5, -1], [-0.9, -4.5], [0.9, -4.5], [0, -8.2]]) g.disc2([top[0] + dx, top[1] + dy], 0.55, '#F6F3EA');
    g.mark({ nc: true }, im); g.glow2('lantern', [top[0], top[1] - 3.5], top, { r: 1.0, col: '#FFE6BE' });   // at night the mosaic finial is lit
    g.line2([[top[0] - 1.8, top[1] + 0.5], [top[0], top[1] - 7.5], [top[0] + 1.8, top[1] + 0.5]], { w: 0.45, c: shade(m, 0.5), boil: false });
  };
  /* a tall stepped tower (Jesus, Mary, the evangelists): square in plan, tapering in rings, ribbed */
  const steeple = (g, x, y, z0, h, r0, col, cap) => {

  /* ---- the boundary wall and the two lodges at the gate ---- */
  T.obj([-37, 34.5, -21, 36.5], (g) => { BC.prism(g, [[-27, 34.5], [-21, 34.5], [-21, 36.5], [-27, 36.5]], 0, 3.6, RUB, { w: 0.7 }); const f = g.p(-24, 36.55, 2.0); g.disc2(f, 1.3, '#F4EFE3'); K.text(g, 'L', 36.6, -24, 1.4, 0.8, 'PARK', '#3F6FA8', { center: true }); g.glow('lamp', -22, 37.1, 3.4, { r: 1.0 }); }, { name: 'wall' });

  }, { name: 'gaudi house' });
  // trees: pines and palms round the edges, carobs on the slope
  for (const [x, y, k] of [[12, -32, 'pine'], [16, -22, 'pine'], [31, -16, 'palm'], [31, -3, 'pine'], [14, -8, 'olive'], [30, 14, 'palm'], [12, 18, 'pine'], [20, 28, 'olive'], [-33, 8, 'pine'], [-34, 18, 'palm'], [8, -36, 'pine']]) {

  BC.block(T, { corners: { pp: 'motos', pn: 'bins', np: 'bicing' }, noTrees: ['y-', 'x-'] });

  BC.walker(T, BC.who(3330), [[-28, -24], [-2, -24], [-2, -8], [-28, -8]], 1.1, { phase: 0.1, z: TER });

  // a guitarist at the head of the stair, under the colonnade, with listeners
  T.cast([-11.5, 4.5], (g) => { const r = BC.person(g, -11.5, 4.5, 2.5, BC.who(3340, { dir: 1, pose: 'stand', hands: [[1.8, -10.5], [-1.2, -12.5]] })); const hp = r.hip; g.fill2(K.curve([[hp[0] - 4, hp[1] + 1], [hp[0] - 1, hp[1] - 1.2], [hp[0] + 1.6, hp[1] + 0.4], [hp[0] + 0.6, hp[1] + 3], [hp[0] - 2, hp[1] + 3.2]], 3, true), '#B5763E', true); g.segs2([hp[0] - 1.2, hp[1] + 0.5, hp[0] + 5, hp[1] - 4], '#5A3E2E', 0.6); }, {});

  T.cast([-15.4, 17], (g) => { BC.person(g, -15.4, 17, stairZ(-15.4, 17), BC.who(3354, { dir: 3, pose: 'wave', ph: 0.2 })); }, {});

  // people on the portico's path
  BC.walker(T, BC.who(3380), [[23, -28], [23, 6]], 1.0, { phase: 0.2, z: 6.2 });
  // a flock of monk parakeets wheeling over the park
  for (let i = 0; i < 6; i++) T.actor({ sample: 5, period: 14, layer: 'top', grow: false,

    draw(g, st) { const c = g.p(0, 0, 0), w = [3.0, 1.6, -0.6, 1.6][st.f]; g.fill2([[c[0] - 1.6, c[1]], [c[0] + 1.8, c[1] - 0.2], [c[0] + 0.6, c[1] + 0.8]], '#6FB04A', true); g.fill2([[c[0] - 0.4, c[1] - 0.2], [c[0] + 0.4, c[1] - 0.2], [c[0] - 1.6, c[1] - w]], '#86C45A', true); g.fill2([[c[0] - 0.4, c[1]], [c[0] + 0.6, c[1]], [c[0] + 1.8, c[1] - w * 0.8]], '#5E9A40', true); g.disc2([c[0] + 1.9, c[1] - 0.3], 0.5, '#9AD06A'); } });

/* ---- src/tiles/rambla.js ---- */
/* (0,100) La Rambla, running along x through the middle of the tile (towards the port at +x), and Plaça Reial.
   Built: the wide central promenade (y -6..6) of pale paving with Miró's mosaic set into it, plane trees along its
   far edge, two flower kiosks; a one-way lane and a pavement on each side. On the far side, facing the Rambla: La
   Boqueria (the iron arch of stained glass with MERCAT DE SANT JOSEP over the stalls of fruit and hanging hams), a
   house, the Liceu (columns, arched windows, its name on the attic), houses at the corners. On the near side: Plaça
   Reial's palms, Gaudí's lamp-posts and the fountain of the Three Graces, café tables, then low arcaded houses along
   the near edge (they keep low so the Rambla stays in view).
   Who: shoppers with bags at the Boqueria, a juice seller, a human statue in gold with onlookers, flower sellers,
   people at the café tables in the square, a guitarist, pigeons. What moves: the gegants — the King and the Queen,
   four metres tall — dance down the promenade and back, spinning, with their band (a gralla and a drum) and a crowd
   walking along; strollers both ways; a taxi and a delivery scooter in the side lanes. */
SF.tile('rambla', 0, 100, { rim: 52 }, function (T) {
  const PROM = 6, LANE = 10, PAV = 13;
  T.ground(function (g) {
    BC.ground(g, '#E3DCCB');
    g.fill(K.rect(-37, -LANE, 37, -PROM), BP.asph); g.fill(K.rect(-37, PROM, 37, LANE), BP.asph);
    g.fill(K.rect(-37, -PROM, 37, PROM), '#E9E0CC');
    // the promenade's paving: long wavy bands (the Rambla's undulating tiles)
    const wv = []; for (let y = -PROM + 0.8; y < PROM; y += 1.1) { let prev = null; for (let x = -37; x <= 37; x += 1.2) { const p = g.p(x, y + Math.sin(x * 0.5 + y) * 0.35, 0); if (prev) wv.push(prev[0], prev[1], p[0], p[1]); prev = p; } }
    g.segs2(wv, '#D8CDB5', 0.3);
    for (const s of [-1, 1]) g.line([[-37, s * PROM, 0], [37, s * PROM, 0]], { w: 0.5, c: BP.kerb, boil: false, ext: 0 });
    for (const s of [-1, 1]) g.line([[-37, s * LANE, 0], [37, s * LANE, 0]], { w: 0.5, c: BP.kerb, boil: false, ext: 0 });
    // Miró's mosaic at the Pla de l'Os: a big circle of red, yellow and blue shapes
    const mc = [16, 0], ring = []; for (let i = 0; i < 24; i++) { const a = TAU * i / 24; ring.push([mc[0] + Math.cos(a) * 3.4, mc[1] + Math.sin(a) * 3.4, 0.01]); }
    g.fill(ring, '#EFE6D2'); g.outline(ring, { w: 0.45, c: '#2A2622', boil: false });
    g.fill(K.curve([[14, -1.6, 0.02], [16.5, -2.6, 0.02], [18, -0.6, 0.02], [16, 0.6, 0.02]], 3, true), '#C9392E');
    g.fill(K.curve([[14.2, 0.8, 0.02], [15.6, 0.4, 0.02], [16.4, 2.2, 0.02], [14.6, 2.4, 0.02]], 3, true), '#3F6FA8');
    g.fill(K.curve([[17.4, 0.9, 0.02], [18.8, 0.6, 0.02], [18.6, 2.0, 0.02]], 3, true), '#E6C24F');
    g.line([[13.2, -1, 0.02], [19, 1.6, 0.02]], { w: 0.5, c: '#2A2622', boil: false });
    // Plaça Reial: warm paving
    g.fill(K.rect(-34, PAV, 34, 30), '#E7DABE'); g.scuff(K.rect(-34, PAV, 34, 30), { dir: -0.6, len: 2.8, c: '#F2E8D2', dens: 0.5, w: 0.45, spread: 0.6 });
    // the far pavement
    g.scuff(K.rect(-37, -PAV, 37, -LANE), { dir: Math.atan2(AY, AX), len: 3, c: '#EFEAE0', dens: 0.6, w: 0.45, spread: 0.5 });
  }, { rim: true });

  const HOUSE = (poly, z, seed, o) => T.obj(BC.bbox(poly), (g) => BC.house(g, Object.assign({ poly, z, seed, gf: 4.4, fl: 3.2 }, o || {})), { name: 'house' });
  /* ---- the far side, facing the Rambla ---- */
  HOUSE([[-37, -27], [-30, -34], [-30, -13], [-37, -13]], 17, 41, { col: '#E9D0A8', flags: 0.3 });
  T.obj([-30, -37, -8, -13], function (g) {
    g.boilP = 0.2;
    // La Boqueria: the market hall behind, its iron roof; the entrance arch on the Rambla
    K.box(g, -30, -37, -8, -15, 0, 9, { t: '#D9D3C6', l: '#E6DDCB', r: '#CFC4AE' }, { w: 0.85 });
    K.gable(g, -30, -35, -8, -17, 9, 3.6, 'x', { a: '#9AA7A8', b: '#7F8C8E', e: '#E6DDCB' }, { c: '#4E5A5C' });
    const y1 = -15, a0 = -24, a1 = -14, m = (a0 + a1) / 2, w = (a1 - a0) / 2;
    // the arch: an iron frame, stained glass panels in its tympanum, the name on top
    const arch = [K.pt('L', y1 + 0.05, a0, 0), K.pt('L', y1 + 0.05, a1, 0)]; for (let i = 0; i <= 12; i++) { const t = Math.PI * i / 12; arch.push(K.pt('L', y1 + 0.05, m + Math.cos(t) * w, 7.5 + Math.sin(t) * 4.5)); }
    g.fill(arch, '#3A3F44'); g.mark({ nc: '#6A4A2E' });                // at night the hall behind the arch is lit
    // inside: the stalls under the market roof, pyramids of fruit, hams hanging, a stallholder
    const R = RNG(9101);
    for (let k = 0; k < 3; k++) { const z = 0.6 + k * 1.2; for (let x = a0 + 0.8; x < a1 - 0.6; x += 0.7) { const p = g.p(x, y1 + 0.08, z + 1.2); g.disc2(p, 0.85, R.pick(['#E07A3C', '#C9392E', '#E6C24F', '#8FBF73', '#D85A7A', '#F2B04A', '#7A3F6E'])); } }

  if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); cam = { z: c[0], cx: c[1], cy: c[2] }; }

  SF.draw(ctx, v, live ? f / FPS : filmT(f), { n: f, allLive: live, phase: boilPhase(shotAt(f)), fade: live ? 0 : fadeAt(f), fresh: true });

  /* for the checks: draw any frame, in any order */
  SF.seek = function (n, camOverride) {
    const c2 = camOverride || SHOTS[shotAt(n)], v2 = mkView(c2, cv.width, cv.height, true);
    ensureBakes(v2, true);
    SF.draw(ctx, v2, live ? n / FPS : filmT(n), { n, allLive: live, phase: boilPhase(shotAt(n)), fade: live ? 0 : fadeAt(n), fresh: true });
    reap(true);                                             // no animation loop here: free evicted canvases now
  };
}

function tick() {

  if (R.lost) APP.recover();
  if (APP.mode === 'film') reap(); else reap(false, 4, 16e6);   // film: one evicted canvas per frame; exploring: a time budget
  const cv = APP.cv, ctx = APP.ctx;
  const t = now();
  if (APP.mode === 'film') {
    let n = t * FPS;
    if (APP.intro && n >= APP.intro) { toExplore('intro'); return; }    // the build is drawn: hand the city over
    if (n >= LAST) {
      n = LAST;
      if (!window.__done) { window.__done = true; window.__endWall = (performance.now() - APP.t0) / 1000; }
      if (!APP.rec && t * FPS > LAST + 12) { toExplore(true); return; }      // a short hold on the ghost, then the city comes back
    }
    const si = shotAt(n), cam = SHOTS[si];

    if (si !== APP.shot) {
      APP.shot = si; const c0 = performance.now(); finishJobs(); ensureBakes(v, true); evict(); APP.cutMs = performance.now() - c0;
      if (APP.prepped !== si) { const g = atlasPrepGen(ATLS[si % 2], SHOTS[si], SHOTS[si].a, shotEnd(si), cv.width, cv.height); let r; do { r = g.next(); } while (!r.done); }
      SF.atlasOn = si % 2; APP.prepped = si;
      if (si >= 1) for (const tl of SF.live) if (tl.cons) { tl.cons.lines.width = 0; tl.cons.paint.width = 0; tl.cons.final.width = 0; tl.cons = null; }   // the build is over
    }
    // get the next shot ready while this one plays (not when only the build plays: explore follows, on the wide view)
    const w0 = performance.now();
    if (si + 1 < SHOTS.length && !APP.intro) {
      const nv = mkView(SHOTS[si + 1], cv.width, cv.height, true); ensureBakes(nv, false);
      if (APP.prepQ !== si + 1) { APP.prepQ = si + 1; const nx = si + 1; R.jobs.push({ key: 'atlas' + nx, gen: atlasPrepGen(ATLS[nx % 2], SHOTS[nx], SHOTS[nx].a, shotEnd(nx), cv.width, cv.height), fn: () => { APP.prepped = nx; } }); }

    }
    const w1 = performance.now();
    SF.draw(ctx, v, Math.min(t, filmT(n)), { n: Math.min(n, HOLD), phase: boilPhase(si), fade: fadeAt(n), lightT: lightT() });
    if (APP.swap) drawSwap(ctx, cam);
    const w2 = performance.now(); APP.drawMs = w2 - w1;

      if (!window.__work) window.__work = [];
      window.__work.push([Math.round(n), +(w1 - w0).toFixed(1), +(w2 - w1).toFixed(1), +(APP.cutMs || 0).toFixed(1), +(APP.queueMs || 0).toFixed(1), (R.lastSteps || []).join('+')]); APP.cutMs = 0; APP.queueMs = 0;
    }

  }

  const settled = performance.now() - APP.dirtyZoom > 90;

  // exact bitmaps per frame until all are sharp again (rasterising every visible pose at once stalled the zoom)
  v.lazy = settled ? 'budget' : 'moving'; R.bmpUntil = performance.now() + 4; R.bmpPending = false;
  // background bakes get the time this frame has left, not a fixed 26 ms
  if (settled) { exploreBakes(v); runJobs(R.jobs.length ? clamp(12 - (APP.drawMs || 5), 3, 9) : 0, 2.5e6); }

  const d0 = performance.now();
  SF.draw(ctx, v, t, { allLive: true, phase: APP.phase | 0, fade, lightT: lightT() });

}
/* ---------- day and night ----------
   SF.setLook({ night }) changes the look of the city. Every cached picture is drawn again in the new look (the wide view
   at once, the rest as it comes into view, the same path as after a GPU reset); meanwhile the last frame of the old look
   stays on screen, follows the camera, and fades away over a second. At nightfall the lamps come on in a wave. */
const lightT = () => (LOOK.since > 0 ? (performance.now() - LOOK.since) / 1000 : null);
SF.setLook = function (o) {
  const night = o.night == null ? LOOK.night : !!o.night;
  if (night === LOOK.night) return;
  const cv = APP.cv;
  if (APP.frozen == null && APP.started) {
    const snap = mkCanvas(cv.width, cv.height); snap.getContext('2d').drawImage(cv, 0, 0);
    const cam = APP.mode === 'explore' ? APP.cam : (APP.filmCam || WIDE);
    if (APP.swap) APP.swap.cv.width = 0;
    APP.swap = { cv: snap, cam: { z: cam.z, cx: cam.cx, cy: cam.cy }, t0: performance.now() };
  }
  LOOK.night = night; LOOK.since = night && APP.frozen == null ? performance.now() : -1e9;
  if (APP.frozen != null) gpuReset();                         // a seeked page draws every frame from nothing anyway
  else APP.recover();
  emit('look', { night });
};
/* the old look's last frame over the new one, moved with the camera, fading out */
function drawSwap(ctx, cam) {
  const S = APP.swap, k = (performance.now() - S.t0) / 1000, a = 1 - smooth((k - 0.12) / 0.95);
  if (a <= 0) { S.cv.width = 0; APP.swap = null; return; }
  const cv = APP.cv, s = Math.min(cv.width / 1920, cv.height / 1080), pz = cam.z * s, pz0 = S.cam.z * s, f = pz / pz0;
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(f, 0, 0, f, cv.width / 2 * (1 - f) + (S.cam.cx - cam.cx) * pz, cv.height / 2 * (1 - f) + (S.cam.cy - cam.cy) * pz);
  ctx.drawImage(S.cv, 0, 0); ctx.restore();
}
function exploreBakes(v) {
  // drop bakes queued for views we have left (another zoom, a tile no longer on screen): they only cost time and GPU
  R.jobs = R.jobs.filter((j) => j.fn || !j.t || (Math.abs(+j.key.split('|')[1] - v.pz) < 1e-4 && bbHit(j.t.bb, v.rect)));
  for (const t of SF.live) {
    if (!bbHit(t.bb, v.rect) || findBake(t, v)) continue;
    const area = (t.bb[2] - t.bb[0]) * (t.bb[3] - t.bb[1]) * v.pz * v.pz;
    if (area <= 4e6) bakeLater(t, { pz: v.pz, hw: v.hw, amp: v.amp, z: v.z, rect: t.bb }, {});
    else bakeLater(t, v, { margin: 0.25 });
  }
}

/* ---------- explore mode ---------- */
function toExplore(fromEnd) {
  if (APP.mode === 'explore' || APP.rec) return;
  const n = now() * FPS;
  const intro = fromEnd === 'intro'; APP.intro = 0;
  APP.mode = 'explore'; SF.atlasOn = -1; R.jobs = R.jobs.filter((j) => !j.fn);
  APP.cam = fromEnd ? Object.assign({}, WIDE) : Object.assign({}, SHOTS[shotAt(Math.min(n, LAST))]);
  APP.phase = boilPhase(shotAt(Math.min(n, LAST)));
  // after the build the city is already on screen, so no fade; after the tour it comes back from the ghost
  APP.fadeUp = intro ? 0 : fromEnd ? performance.now() : (fadeAt(n) > 0 ? performance.now() : 0);
  for (const tl of SF.live) if (tl.cons) { tl.cons.lines.width = 0; tl.cons.paint.width = 0; tl.cons.final.width = 0; tl.cons = null; }   // the build is over
  APP.cv.style.cursor = 'grab'; APP.lastInput = performance.now();
  emit('explore', { intro, fromEnd: !!fromEnd });
}
function clampCam(c) {
  c.z = clamp(c.z, BOUNDS.z[0], BOUNDS.z[1]);
  c.cx = clamp(c.cx, BOUNDS.cx[0], BOUNDS.cx[1]); c.cy = clamp(c.cy, BOUNDS.cy[0], BOUNDS.cy[1]);
}
function cutTo(cam) { APP.cam = { z: cam.z, cx: cam.cx, cy: cam.cy }; clampCam(APP.cam); APP.dirtyZoom = 0; APP.phase = (APP.phase + 1) % 6; }
const VISIT = SCENE.visit || SHOTS.filter((q) => q.z > 1.5).map((q) => q.name).slice(0, 9);
function shotByName(nm) { return SHOTS.find((s) => s.name === nm); }
function visitWorld(wx, wy) {
  // which place is under this wide-px point?
  const g = unprj(wx, wy);
  let best = null, bd = 1e9;
  for (const t of SF.live) {
    if (t.name === 'streets' || t.o.shared) continue;                // shared ground (a sea, a canal) is not a place to visit
    const inside = Math.abs(g[0] - t.cx) <= t.half + 4 && Math.abs(g[1] - t.cy) <= t.half + 4;
    const d = Math.hypot(wx - (t.bb[0] + t.bb[2]) / 2, wy - (t.bb[1] + t.bb[3]) / 2);
    if ((inside || (wx > t.bb[0] && wx < t.bb[2] && wy > t.bb[1] && wy < t.bb[3])) && d < bd) { bd = d; best = t; }
  }
  if (!best) return;
  const s = shotByName(best.name);
  const dive = SCENE.dive && SCENE.dive[best.name];
  if (s && dive) { const at = Math.abs(APP.cam.z - s.z) < 0.01 && Math.abs(APP.cam.cx - s.cx) < 2; cutTo(at ? shotByName(dive) : s); return; }
  if (s) cutTo(s); else cutTo({ z: 4, cx: (best.bb[0] + best.bb[2]) / 2, cy: (best.bb[1] + best.bb[3]) / 2 });
}
function bindInput() {
  const cv = APP.cv;
  const ptrs = new Map(); let drag = null, pinch = null;
  const scale = () => { const s = Math.min(cv.width / 1920, cv.height / 1080); return { s, k: cv.width / cv.clientWidth }; };
  const toWide = (ex, ey) => { const { s, k } = scale(), pz = APP.cam.z * s; return [(ex * k - cv.width / 2) / pz + APP.cam.cx, (ey * k - cv.height / 2) / pz + APP.cam.cy]; };
  const touch = () => { APP.lastInput = performance.now(); APP.glide = null; if (APP.mode === 'film') toExplore(false); };
  const zoomAt = (ex, ey, f) => {
    const a = toWide(ex, ey); APP.cam.z = clamp(APP.cam.z * f, BOUNDS.z[0], BOUNDS.z[1]); const b = toWide(ex, ey);
    APP.cam.cx += a[0] - b[0]; APP.cam.cy += a[1] - b[1]; clampCam(APP.cam); APP.dirtyZoom = performance.now();
  };

    const wasFilm = APP.mode === 'film'; touch(); cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, cx: APP.cam.cx, cy: APP.cam.cy, moved: wasFilm ? 99 : 0 }; cv.style.cursor = 'grabbing'; }
    if (ptrs.size === 2) { const p = Array.from(ptrs.values()); pinch = { d: Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) }; drag = null; }
  });
  cv.addEventListener('pointermove', (e) => {
    if (APP.mode !== 'explore') return;                     // moving the mouse alone does not interrupt the film
    APP.lastInput = performance.now();
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && ptrs.size === 2) {
      const p = Array.from(ptrs.values()), d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
      zoomAt((p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2, d / pinch.d); pinch.d = d; return;
    }
    if (drag) {
      const { s, k } = scale(), pz = APP.cam.z * s;
      drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
      if (drag.moved > 4) { APP.cam.cx = drag.cx - (e.clientX - drag.x) * k / pz; APP.cam.cy = drag.cy - (e.clientY - drag.y) * k / pz; clampCam(APP.cam); }
    }
  });
  const up = (e) => {
    if (drag && drag.moved <= 4 && ptrs.size === 1 && APP.mode === 'explore') {
      if (!uiHit(e.clientX, e.clientY)) { const w = toWide(e.clientX, e.clientY); visitWorld(w[0], w[1]); }
    }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) { drag = null; cv.style.cursor = APP.mode === 'explore' ? 'grab' : 'none'; }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', (e) => {
    e.preventDefault(); touch();
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
    zoomAt(e.clientX, e.clientY, f);
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'r' || k === 'R') { replay_(); return; }
    touch();
    if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === 'n' || k === 'N') SF.setLook({ night: !LOOK.night });
    else if (k === '0' || k === 'Escape') { if (SF.home) SF.glideTo(SF.home()); else cutTo(WIDE); }   // the page's guide may frame the city beside its panel
    else if (k >= '1' && k <= '9' && VISIT[+k - 1]) cutTo(shotByName(VISIT[+k - 1]));
  });
}
function togglePause() {
  if (APP.paused) { APP.t0 = performance.now() - APP.pauseAt * 1000; APP.paused = false; }
  else { APP.pauseAt = now(); APP.paused = true; }
}
function replay_() { ACT_DL.size; startFilm(); }

/* ---------- the two pen-drawn icons ---------- */
const UI = { dl: null, r: 26 };
function uiIcons() {
  if (UI.dl) return UI.dl;
  const mk = (fn) => { const g = new G('ui' + fn.name); g.boilP = 0; fn(g); return { cmds: g.cmds, comp: new Map() }; };
  const arc = (r, a0, a1, n) => { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([Math.cos(a) * r, Math.sin(a) * r]); } return p; };
  UI.dl = {
    replay: mk(function replay(g) { g.line2(arc(8, 0.75, 5.5, 24), { w: 1, taper: 0.3, ext: 0 }); const a = 5.5, e = [8 * Math.cos(a), 8 * Math.sin(a)], t = [-Math.sin(a), Math.cos(a)], n = [Math.cos(a), Math.sin(a)]; g.line2([[e[0] - t[0] * 3.4 + n[0] * 3.2, e[1] - t[1] * 3.4 + n[1] * 3.2], [e[0] + t[0] * 1.6, e[1] + t[1] * 1.6], [e[0] - t[0] * 3.4 - n[0] * 3.2, e[1] - t[1] * 3.4 - n[1] * 3.2]], { w: 1, ext: 0 }); }),
    pause: mk(function pause(g) { g.line2([[-3.4, -7], [-3.6, 7]], { w: 1.25 }); g.line2([[3.6, -7], [3.4, 7]], { w: 1.25 }); }),
    play: mk(function play(g) { g.outline2([[-4, -7.5], [7, 0], [-4, 7.5]], { w: 1 }); }),
  };
  return UI.dl;
}
function uiPos() { const cv = APP.cv, k = cv.width / cv.clientWidth; return { k, a: [34 * k, cv.height - 34 * k], b: [78 * k, cv.height - 34 * k] }; }
function uiHit(ex, ey) {
  if (SF.ui === false) return false;
  const p = uiPos(), x = ex * p.k, y = ey * p.k, r = 20 * p.k;
  if (Math.hypot(x - p.a[0], y - p.a[1]) < r) { replay_(); return true; }
  if (Math.hypot(x - p.b[0], y - p.b[1]) < r) { togglePause(); return true; }
  return false;
}
function drawUI(ctx, cv) {
  if (SF.ui === false) return;                               // the page's guide draws its own controls
  const idle = (performance.now() - APP.lastInput) / 1000, a = APP.paused ? 1 : clamp(1.6 - (idle - 2.5) / 0.8, 0, 1);
  if (a <= 0) return;
  const ic = uiIcons(), p = uiPos(), s = 1.7 * p.k;
  ctx.globalAlpha = 0.8 * a;
  for (const [dl, pos] of [[ic.replay, p.a], [APP.paused ? ic.play : ic.pause, p.b]]) {
    ctx.setTransform(s, 0, 0, s, pos[0], pos[1]);
    for (const g of compiled(dl, 0.75, true)) { const c = LOOK.night ? '#E9E2D2' : g.col; if (g.m === 0) { ctx.fillStyle = c; ctx.fill(g.p); } else { ctx.strokeStyle = c; ctx.lineWidth = g.lw; ctx.stroke(g.p); } }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
}

/* ---------- for the page's guide (a DOM overlay): read the view, move the camera, hear the mode change ----------
   Cameras are in wide px (the 1920 x 1080 frame at zoom 1); SF.prj turns a world point into wide px. */
window.SF = SF;                                              // a top-level const is not a window property
const EV = {};
function emit(k, a) { for (const f of EV[k] || []) { try { f(a); } catch (e) { console.error(e); } } }
SF.on = (k, f) => { (EV[k] = EV[k] || []).push(f); };
SF.prj = (x, y, z) => prj(x, y, z || 0);
SF.wide = WIDE; SF.shots = SHOTS; SF.visit = VISIT; SF.bounds = BOUNDS;
SF.shot = (name) => shotByName(name);
SF.zMin = () => BOUNDS.z[0];
/* the camera on screen now, and how wide px map to CSS px */
SF.view = function () {
  const cv = APP.cv, cam = APP.mode === 'explore' ? APP.cam : (APP.filmCam || WIDE);
  const k = cv.width / cv.clientWidth, pz = cam.z * Math.min(cv.width / 1920, cv.height / 1080) / k;
  return { mode: APP.mode, z: cam.z, cx: cam.cx, cy: cam.cy, pz, w: cv.clientWidth, h: cv.clientHeight, paused: !!APP.paused, gliding: !!APP.glide };
};
SF.toScreen = function (wx, wy, v) { v = v || SF.view(); return [(wx - v.cx) * v.pz + v.w / 2, (wy - v.cy) * v.pz + v.h / 2]; };
/* the map's extent in wide px (every tile, satellites included) */
SF.boxes = () => SF.live.map((t) => t.bb.slice());              // every tile's and satellite's wide-px box
SF.extent = function () { let a = [1e9, 1e9, -1e9, -1e9]; for (const t of SF.live) { a[0] = Math.min(a[0], t.bb[0]); a[1] = Math.min(a[1], t.bb[1]); a[2] = Math.max(a[2], t.bb[2]); a[3] = Math.max(a[3], t.bb[3]); } return a; };
/* glide the explore camera to a camera {z, cx, cy}, a shot's name, or WIDE; it pulls back on long trips */
SF.glideTo = function (to, ms) {
  if (typeof to === 'string') to = shotByName(to) || WIDE;
  if (APP.mode !== 'explore') toExplore(false);
  const b = { z: to.z, cx: to.cx, cy: to.cy }; clampCam(b);
  const a = { z: APP.cam.z, cx: APP.cam.cx, cy: APP.cam.cy }, d = Math.hypot(b.cx - a.cx, b.cy - a.cy);
  const fit = 1920 * 0.7 / Math.max(1, d), lo = Math.min(a.z, b.z), dip = Math.max(0, Math.log(lo / Math.max(fit, WIDE.z)));
  APP.glide = { a, b, dip, t0: performance.now(), ms: ms || clamp(700 + d * 0.5 + dip * 260, 700, 1600) };
  APP.lastInput = performance.now();
};
function stepGlide() {
  const g = APP.glide, t = clamp((performance.now() - g.t0) / g.ms, 0, 1), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lz = Math.log(g.a.z) + (Math.log(g.b.z) - Math.log(g.a.z)) * e - g.dip * Math.sin(Math.PI * e);
  APP.cam = { z: Math.exp(lz), cx: g.a.cx + (g.b.cx - g.a.cx) * e, cy: g.a.cy + (g.b.cy - g.a.cy) * e };
  APP.dirtyZoom = performance.now(); APP.lastInput = performance.now();
  if (t >= 1) { APP.cam = Object.assign({}, g.b); APP.glide = null; APP.phase = (APP.phase + 1) % 6; emit('arrive', Object.assign({}, g.b)); }
}
SF.paper = () => (LOOK.night ? NIGHT.paper : [240, 238, 228]);     // the colour of the bare paper (the guide finds room for its notes)
SF.pause = () => { if (!APP.paused) togglePause(); };
SF.resume = () => { if (APP.paused) togglePause(); };
SF.togglePause = () => togglePause();
SF.replay = () => replay_();

</script>
