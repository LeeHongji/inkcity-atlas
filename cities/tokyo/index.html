/* ---- src/36_tokyo.js ---- */
/* Tokyo's own kit: Japanese roofs (tiled hip-and-gable with upturned eaves), torii, paper lanterns, utility poles and
   their wires, vending machines, signs with lettering, noren, sakura, the people of Tokyo (salarymen, kimono, a Shintō
   wedding, school kids), vehicles (taxi, kei truck, Yamanote and shinkansen cars, yakatabune, rickshaw, turret truck)
   and sumō wrestlers. Everything in tile-local u unless the name ends in 2 (wide px). */
const TK = {};

/* ---------------- lettering ---------------- */
/* pseudo-kanji: a few strokes inside a small square, picked from a stroke vocabulary by seed (wide px) */
TK.glyph2 = function (g, c, s, col, seed, w) {
  const R = RNG(seed * 131 + 7), segs = [], h = s / 2;
  const n = 3 + R.int(0, 2);
  for (let i = 0; i < n; i++) {
    const t = R.int(0, 5), a = (R() - 0.5) * 0.8 * s, b = (R() - 0.5) * 0.8 * s;
    if (t <= 1) segs.push(c[0] - h * 0.85, c[1] + a * 0.9, c[0] + h * 0.85, c[1] + a * 0.9);               // a bar across
    else if (t <= 3) segs.push(c[0] + a * 0.9, c[1] - h * 0.9, c[0] + a * 0.9, c[1] + h * 0.9);            // a stroke down
    else if (t === 4) segs.push(c[0] + a * 0.5, c[1] - h * 0.3, c[0] + a * 0.5 - h * 0.6, c[1] + h * 0.8); // a sweep left
    else segs.push(c[0] + b * 0.3, c[1], c[0] + b * 0.3 + h * 0.7, c[1] + h * 0.75);                      // a sweep right
  }
  g.segs2(segs, col, w || Math.max(0.28, s * 0.13));
};
/* a sign board on a face, with a column (vertical) or row of glyphs */
TK.sign = function (g, face, p, a0, a1, z0, z1, col, o) {
  o = o || {}; const q = K.on(face, p + (face === 'L' ? 0.08 : 0.08), a0, a1, z0, z1);
  g.fill(q, col); g.mark({ nc: true }); g.outline(q, { w: o.w || 0.45, c: o.c || shade(col, 0.5), boil: false });   // lit from behind at night
  { const c = g.p.apply(g, K.pt(face, p + 0.1, (a0 + a1) / 2, (z0 + z1) / 2)); g.glow2('neon', c, c, { r: 0.3 * Math.max(Math.abs(a1 - a0) * 2.92, (z1 - z0) * 3.46), col }); }
  const vert = (z1 - z0) > Math.abs(a1 - a0), n = o.n || Math.max(1, Math.floor((vert ? (z1 - z0) : Math.abs(a1 - a0)) / (vert ? Math.abs(a1 - a0) : (z1 - z0)) * 0.9));
  const am = (a0 + a1) / 2, zm = (z0 + z1) / 2, cell = vert ? (z1 - z0) / n : (a1 - a0) / n;
  const s = Math.min(Math.abs(cell), vert ? Math.abs(a1 - a0) : (z1 - z0)) * 0.62 * 3.3;
  for (let i = 0; i < n; i++) {
    const c = vert ? g.p.apply(g, K.pt(face, p + 0.1, am, z1 - cell * (i + 0.5))) : g.p.apply(g, K.pt(face, p + 0.1, a0 + cell * (i + 0.5), zm));
    TK.glyph2(g, c, s, o.ink || (shade(col, 0.05) === col ? '#2A2622' : (hex2rgb(col).reduce((x, y) => x + y) > 420 ? '#3A3128' : '#F6F3EA')), (o.seed || 1) * 17 + i, Math.max(0.3, s * 0.12));
  }
};

/* ---------------- roofs ---------------- */
/* a Japanese tiled roof over the wall box [x0,y0,x1,y1] at eave height z, rising h. The eaves overhang (over), sag a
   little between corners that turn up (lift), and the tiles run down the slope in channels. gable (0..0.6): the
   hip-and-gable (irimoya) of temples and shrines, with a gable board on the visible end; 0 = plain hip roof. */
TK.roof = function (g, x0, y0, x1, y1, z, h, o) {
  o = o || {}; const ov = o.over == null ? 2 : o.over, lift = o.lift == null ? 0.9 : o.lift, col = o.col || '#7D848C', gf = o.gable || 0;
  const alongX = o.ridge ? o.ridge === 'x' : (x1 - x0) >= (y1 - y0);
  // (u along the ridge, v across it) -> world
  const W = alongX ? (u, v, zz) => [u, v, zz] : (u, v, zz) => [v, u, zz];
  const U0 = (alongX ? x0 : y0) - ov, U1 = (alongX ? x1 : y1) + ov, V0 = (alongX ? y0 : x0) - ov, V1 = (alongX ? y1 : x1) + ov;
  const vm = (V0 + V1) / 2, half = (V1 - V0) / 2, dI = Math.min(half, (U1 - U0) / 2 - 0.01), zt = z + h;
  const ua = U0 + dI, ub = U1 - dI, w = half * gf, zg = zt - h * gf;
  const eave = (ua_, va, ub_, vb, n) => { const pts = []; for (let i = 0; i <= n; i++) { const t = i / n; pts.push(W(lerp(ua_, ub_, t), lerp(va, vb, t), z + lift * Math.pow(Math.abs(2 * t - 1), 2.4))); } return pts; };
  const A = W(ua, vm, zt), B = W(ub, vm, zt);
  const gaP = W(ua, vm + w, zg), gaN = W(ua, vm - w, zg), gbP = W(ub, vm + w, zg), gbN = W(ub, vm - w, zg);
  const N = 10;
  const front = eave(U0, V1, U1, V1, N).concat([gbP, B, A, gaP]);          // the plane on the +v side
  const back = eave(U1, V0, U0, V0, N).concat([gaN, A, B, gbN]);           // -v side
  const endB = eave(U1, V1, U1, V0, 6).concat([gbN, gbP]);                 // +u end
  const endA = eave(U0, V0, U0, V1, 6).concat([gaP, gaN]);                 // -u end
  // tones: the +y-facing plane is lit, +x shaded, the back ones darker
  const tone = (nx, ny) => ny > 0.5 ? shade(col, -0.1) : nx > 0.5 ? shade(col, 0.1) : ny < -0.5 ? shade(col, 0.18) : shade(col, -0.02);
  const nrm = (dv, du) => alongX ? [du, dv] : [dv, du];
  const ink = o.c || shade(col, 0.55), lo = { w: o.w || 0.95, c: ink }, li = { w: (o.w || 0.95) * 0.7, c: ink };
  g.fill(back, tone.apply(null, nrm(-1, 0))); g.fill(endA, tone.apply(null, nrm(0, -1)));
  const nF = nrm(1, 0), nE = nrm(0, 1);
  // the two visible planes: whichever faces +y is lit
  g.fill(front, tone(nF[0], nF[1])); g.fill(endB, tone(nE[0], nE[1]));
  // tile channels down the visible slopes
  if (o.tiles !== false) {
    const segs = [], sp = o.sp || 0.95;
    for (let u = U0 + sp * 0.6; u < U1 - sp * 0.4; u += sp) {
      let s = 1; if (u < ua) s = (u - U0) / (ua - U0) * (gf ? 1 - gf : 1); else if (u > ub) s = (U1 - u) / (U1 - ub) * (gf ? 1 - gf : 1);
      if (gf && (u < ua || u > ub)) s = Math.min(s, 1 - gf);
      const t = (u - U0) / (U1 - U0), ze = z + lift * Math.pow(Math.abs(2 * t - 1), 2.4);
      const a = g.p.apply(g, W(u, V1, ze)), b = g.p.apply(g, W(u, V1 - s * 0.97 * (V1 - vm), lerp(ze, zt, s * 0.97)));
      segs.push(a[0], a[1], b[0], b[1]);
    }
    for (let v = V0 + sp * 0.6; v < V1 - sp * 0.4; v += sp) {
      const t = (v - V0) / (V1 - V0), ze = z + lift * Math.pow(Math.abs(2 * t - 1), 2.4);
      let s = Math.min(1, (v - V0) / half, (V1 - v) / half); if (gf) s = Math.min(s, 1 - gf + 0.02);
      const a = g.p.apply(g, W(U1, v, ze)), b = g.p.apply(g, W(U1 - s * 0.97 * (U1 - ub), v, lerp(ze, zg + (gf ? 0 : 0), s * 0.97 * (gf ? 1 : 1))));
      segs.push(a[0], a[1], b[0], b[1]);
    }
    g.segs2(segs, o.tc || shade(col, 0.3), 0.32);
  }
  // the gable board on the visible end
  if (gf > 0) {
    const tri = [gbN, gbP, B];
    g.fill(tri, o.end || '#F1EFE8');
    g.outline(tri, li);
    if (o.end !== '#F1EFE8') { const sl = []; for (let i = 1; i < 6; i++) { const t = i / 6, p0 = g.p.apply(g, W(ub, vm - w + 2 * w * t, zg)), p1 = g.p.apply(g, W(ub, vm - w + 2 * w * t, lerp(zg, zt, 1 - Math.abs(2 * t - 1)))); sl.push(p0[0], p0[1], p1[0], p1[1]); } g.segs2(sl, shade(o.end || '#6E5A44', 0.35), 0.3); }
  }
  // lines: front eaves, hips, ridge
  g.line(eave(U0, V1, U1, V1, N), lo); g.line(eave(U1, V1, U1, V0, 6), lo);
  g.line([W(U0, V1, z + lift), gaP], li); g.line([W(U1, V1, z + lift), gbP], lo); g.line([W(U1, V0, z + lift), gbN], li);
  g.line([W(U0, V0, z + lift), gaN], { w: 0.5, c: ink });
  if (gf) { g.line([gaP, A], li); g.line([gbP, B], li); }
  // the ridge: a thick dark band with turned-up ends
  const rc = o.rc || shade(col, 0.45), rA = g.p.apply(g, A), rB = g.p.apply(g, B);
  g.line2([rA, rB], { w: 1.7, c: rc, boil: false, ext: 0 });
  g.line2([rA, [rA[0] - 0.4, rA[1] - 1.6]], { w: 1.3, c: rc, boil: false, ext: 0 }); g.line2([rB, [rB[0] + 0.4, rB[1] - 1.6]], { w: 1.3, c: rc, boil: false, ext: 0 });
  return { A, B, zt };
};

/* a torii: two pillars, the tie beam (nuki) and the top beam (kasagi) with upturned ends. axis: the beams run along x or y */
TK.torii = function (g, x, y, o) {
  o = o || {}; const w = o.w || 6, h = o.h || 8, ax = o.axis || 'x', col = o.col || '#D4553A', top = o.top || '#2E2A26', r = o.r || 0.45;
  const P = (u, zz, v) => ax === 'x' ? [x + u, y + (v || 0), zz] : [x + (v || 0), y + u, zz];
  const pl = (u) => { const c = P(u, 0); K.cyl(g, c[0], c[1], r, 0, h, col, { w: 0.7, n: 8, nt: true }); };
  pl(-w / 2); pl(w / 2);
  const beam = (u0, u1, zb, zh, d, c, curve) => {   // a beam seen on its front face and top
    const n = 10, F = [], T = [];
    for (let i = 0; i <= n; i++) { const u = lerp(u0, u1, i / n), up = curve * Math.pow(Math.abs(2 * i / n - 1), 2.2); F.push(P(u, zb + up, d)); T.push(P(u, zb + zh + up, d)); }
    const back = T.map((p) => ax === 'x' ? [p[0], p[1] - 2 * d, p[2]] : [p[0] - 2 * d, p[1], p[2]]);
    g.fill(T.concat(back.slice().reverse()), shade(c, -0.15));
    g.fill(F.concat(T.slice().reverse()), c);
    g.outline(F.concat(T.slice().reverse()), { w: 0.7, boil: false });
  };
  beam(-w / 2 - 1.1, w / 2 + 1.1, h * 0.74, 0.55, 0.35, col, 0);
  const gk = P(0, h * 0.74 + 0.55, 0.3), gk2 = P(0, h, 0.3); const a = g.p.apply(g, gk), b = g.p.apply(g, gk2);
  g.fill2([[a[0] - 0.9, a[1]], [a[0] + 0.9, a[1]], [b[0] + 0.9, b[1]], [b[0] - 0.9, b[1]]], col);
  beam(-w / 2 - 2.2, w / 2 + 2.2, h, 0.6, 0.55, col, 0.8);
  beam(-w / 2 - 2.5, w / 2 + 2.5, h + 0.6, 0.55, 0.6, top, 1.0);
};

/* a paper lantern (chōchin) hanging at wide-px point c: ribs, black caps; big: a glyph on it */
TK.lantern2 = function (g, c, r, col, o) {
  o = o || {}; const rx = r * 0.78, pts = [];
  for (let i = 0; i < 16; i++) { const t = TAU * i / 16; pts.push([c[0] + Math.cos(t) * rx, c[1] + Math.sin(t) * r]); }
  g.fill2(pts, col, true); g.mark({ nc: true, light: true });                           // at night a light burns inside
  g.fill2(pts.filter((p) => p[0] > c[0] + rx * 0.2).concat([[c[0] + rx * 0.2, c[1] + r * 0.9], [c[0] + rx * 0.2, c[1] - r * 0.9]]).sort((a, b) => Math.atan2(a[1] - c[1], a[0] - c[0] - rx * 0.4) - Math.atan2(b[1] - c[1], b[0] - c[0] - rx * 0.4)), shade(col, 0.14), true); g.mark({ nc: true });
  if (r > 1.6) { const segs = []; for (let k = -2; k <= 2; k++) { const yy = c[1] + k * r * 0.33, xx = rx * Math.sqrt(Math.max(0, 1 - Math.pow(k * 0.33, 2))); segs.push(c[0] - xx, yy, c[0] + xx, yy); } g.segs2(segs, shade(col, 0.3), 0.25); }
  const cap = (yy) => g.fill2([[c[0] - rx * 0.62, yy - r * 0.13], [c[0] + rx * 0.62, yy - r * 0.13], [c[0] + rx * 0.62, yy + r * 0.13], [c[0] - rx * 0.62, yy + r * 0.13]], '#2A2622', true);
  cap(c[1] - r); cap(c[1] + r);
  if (o.glyph) TK.glyph2(g, [c[0], c[1] + r * 0.05], r * 0.95, o.gc || '#2A2622', o.glyph, Math.max(0.35, r * 0.13));
  if (r > 1.2) g.line2(pts, { w: 0.4, c: shade(col, 0.45), close: true, boil: false, wob: 0.3 });
  g.glow2('lantern', c, c, { r: r * 1.1, col });
};
/* a string of small lanterns between two wide-px points, sagging */
TK.lanternString2 = function (g, a, b, n, cols, sag) {
  const pts = []; for (let i = 0; i <= 12; i++) { const t = i / 12; pts.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t) + (sag || 2) * 4 * t * (1 - t)]); }
  g.fine2(pts, { w: 0.25, c: '#4A4540' });
  for (let i = 0; i < n; i++) { const t = (i + 0.5) / n, p = [lerp(a[0], b[0], t), lerp(a[1], b[1], t) + (sag || 2) * 4 * t * (1 - t) + 1.5]; TK.lantern2(g, p, 1.15, cols[i % cols.length]); }
};

/* noren: a split curtain hanging in a doorway on a face */
TK.noren = function (g, face, p, a0, a1, z0, z1, col, o) {
  o = o || {}; const n = o.n || 3, gap = (a1 - a0) * 0.04, d = 0.12;
  for (let i = 0; i < n; i++) {
    const b0 = a0 + (a1 - a0) * i / n + gap / 2, b1 = a0 + (a1 - a0) * (i + 1) / n - gap / 2;
    const q = K.on(face, p + d, b0, b1, z0, z1); g.fill(q, col); g.outline(q, { w: 0.35, c: shade(col, 0.45), boil: false, ext: 0 });
  }
  if (o.glyph) TK.glyph2(g, g.p.apply(g, K.pt(face, p + d, (a0 + a1) / 2, (z0 + z1) / 2)), Math.min(Math.abs(a1 - a0), z1 - z0) * 2.0, '#F6F3EA', o.glyph);
};
/* an awning sloping out from a face */
TK.awning = function (g, face, p, a0, a1, z, out, col, o) {
  o = o || {}; const drop = o.drop || 1.2, P = (a, d, zz) => face === 'L' ? [a, p + d, zz] : [p + d, a, zz];
  const q = [P(a0, 0, z), P(a1, 0, z), P(a1, out, z - drop), P(a0, out, z - drop)];
  g.fill(q, col);
  if (o.stripe) { const n = Math.max(2, Math.round(Math.abs(a1 - a0) / 1.4)); for (let i = 0; i < n; i += 2) { const s0 = lerp(a0, a1, i / n), s1 = lerp(a0, a1, (i + 1) / n); g.fill([P(s0, 0, z), P(s1, 0, z), P(s1, out, z - drop), P(s0, out, z - drop)], o.stripe); } }
  const v = [P(a0, out, z - drop), P(a1, out, z - drop), P(a1, out, z - drop - 0.6), P(a0, out, z - drop - 0.6)];
  g.fill(v, shade(col, 0.12)); g.outline(q, { w: 0.5, c: shade(col, 0.5), boil: false }); g.line([v[3], v[2]], { w: 0.45, c: shade(col, 0.5), boil: false });
};

/* ---------------- street things ---------------- */
/* a concrete utility pole with a cross-arm and a transformer can; returns the world points the wires hang from */
TK.upole = function (g, x, y, o) {
  o = o || {}; const h = o.h || 14, f = g.p(x, y, 0), t = g.p(x, y, h);
  g.fill2([[f[0] - 0.75, f[1]], [f[0] + 0.75, f[1]], [t[0] + 0.5, t[1]], [t[0] - 0.5, t[1]]], '#B9B6AD');
  g.fill2([[f[0] + 0.1, f[1]], [f[0] + 0.75, f[1]], [t[0] + 0.5, t[1]], [t[0] + 0.05, t[1]]], '#A3A097');
  g.line2([[f[0] - 0.75, f[1]], [t[0] - 0.5, t[1]]], { w: 0.5, c: '#5A564E', boil: false }); g.line2([[f[0] + 0.75, f[1]], [t[0] + 0.5, t[1]]], { w: 0.5, c: '#5A564E', boil: false });
  const arm = (zz, L) => { const a = o.across === 'y' ? g.p(x, y - L, zz) : g.p(x - L, y, zz), b = o.across === 'y' ? g.p(x, y + L, zz) : g.p(x + L, y, zz); g.line2([a, b], { w: 0.55, c: '#5A564E', boil: false, ext: 0 }); };
  arm(h - 0.8, 1.8); arm(h - 2.3, 1.3);
  if (o.can !== false) { const c = g.p(x, y, h - 4.8); g.fill2([[c[0] + 0.6, c[1]], [c[0] + 2.6, c[1]], [c[0] + 2.6, c[1] - 5.2], [c[0] + 0.6, c[1] - 5.2]], '#9FA39E'); g.outline2([[c[0] + 0.6, c[1]], [c[0] + 2.6, c[1]], [c[0] + 2.6, c[1] - 5.2], [c[0] + 0.6, c[1] - 5.2]], { w: 0.4, c: '#5A564E', boil: false }); }
  if (o.band) { const a = g.p(x, y, 4.5), b = g.p(x, y, 6.2); g.fill2([[a[0] - 0.7, a[1]], [a[0] + 0.7, a[1]], [b[0] + 0.65, b[1]], [b[0] - 0.65, b[1]]], '#E6C24F'); }
  if (o.light !== false) g.glow('lamp', x, y, h - 3.4, { r: 1.3 });   // the street light every pole carries (only at night: nothing is drawn by day)
  const L1 = 1.6, L2 = 1.1;
  return o.across === 'y' ? [[x, y - L1, h - 0.8], [x, y + L1, h - 0.8], [x, y - L2, h - 2.3], [x, y + L2, h - 2.3]] : [[x - L1, y, h - 0.8], [x + L1, y, h - 0.8], [x - L2, y, h - 2.3], [x + L2, y, h - 2.3]];
};
/* sagging wires between the hang points of two poles */
TK.wires = function (g, A, B, sag) {
  for (let i = 0; i < Math.min(A.length, B.length); i++) {
    const a = A[i], b = B[i], pts = [];
    for (let k = 0; k <= 10; k++) { const t = k / 10; pts.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t) - (sag || 1.6) * (1 + i * 0.15) * 4 * t * (1 - t)]); }
    g.fine(pts, { w: 0.3, c: '#4A4540' });
  }
};
/* a vending machine against a face: lit window of bottles, buttons, the slot */

/* ---------------- sumō ---------------- */
/* a rikishi: a big round body, a dark mawashi, thick legs in a low stance, a topknot. dir as K.person; push 0..1 leans

TK.rikishi = function (g, x, y, z, o) {
  o = o || {}; const F = g.p(x, y, z || 0), k = o.k || 1, dir = o.dir | 0, sg = (dir === 0 || dir === 3) ? 1 : -1, back = dir >= 2;
  const skin = o.skin || '#E8BE9A', mw = o.mawashi || '#2F3A4F', lean = 1.6 + (o.push || 0) * 1.6, ink = '#3A3128';
  const P = (u, v) => [F[0] + sg * (u + lean * clamp((-v - 7) / 9, 0, 1.6)) * k, F[1] + v * k];
  const PP = (a) => a.map((q) => P(q[0], q[1]));

  const leg = (u0, u1, far) => sh(K.curve([[u0 - 1.5, -6.5], [u1 - 1.4, -2.6], [u1 - 1.3, 0], [u1 + 1.5, 0], [u1 + 1.3, -2.8], [u0 + 1.6, -6.4]], 2, true), far ? shade(skin, 0.12) : skin);

  // the body: a big pear with the belly forward
  const body = K.curve([[-3.6, -7.0], [-4.4, -10.6], [-3.6, -14.8], [-1.6, -16.4], [1.6, -16.4], [3.6, -14.6], [4.9, -11.0], [4.5, -7.6], [2.0, -6.2], [-1.6, -6.2]], 3, true);
  sh(body, skin, 0.6);
  g.fill2(PP([[1.0, -16.0], [3.4, -14.4], [4.6, -11.0], [4.2, -8.2], [2.6, -7.4], [2.8, -11.2]]), shade(skin, 0.1), true);
  leg(-2.2, -3.6, false);

  if (!back) { const c = []; for (let i = 0; i < 5; i++) { const u = 1.0 + i * 0.6, a = P(u, -6.9), b = P(u + 0.1, -4.4); c.push(a[0], a[1], b[0], b[1]); } g.segs2(c, shade(mw, -0.2), 0.45); }
  else sh([[-0.8, -8.8], [0.8, -8.8], [0.5, -5.2], [-0.5, -5.2]], mw, 0.4);

/* ---- src/tiles/streets.js ---- */
/* Tokyo's street grid: four through-streets between the places, running out under the Yamanote viaduct at ±152.
   Left-hand traffic. White dashed centre lines, zebra bars on every arm of the four crossings, utility poles on the far
   kerb of each street with their wires sagging from pole to pole (and across the crossings).
   Traffic is a timetable: each vehicle is periodic; the lane phases were searched offline so that no two vehicles ever
   overlap (axis-aligned boxes with a 1.6 u margin over the whole cycle). Vehicles fade out beyond the viaduct. */
const TST = { in: 37, out: 63, end: 166 };

SF.tile('streets', 0, 0, { order: -99 }, function (T) {
  const S = TST, ASPH = '#D8D3C6', LINE = '#F7F5EE';
  T.ground(function (g) {
    const strips = [[[-S.out, -S.end], [-S.in, S.end]], [[S.in, -S.end], [S.out, S.end]], [[-S.end, -S.out], [S.end, -S.in]], [[-S.end, S.in], [S.end, S.out]]];
    for (const [a, b] of strips) g.fill(K.rect(a[0], a[1], b[0], b[1]), ASPH);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const [cx, cy, dx, dy] of [[S.out * sx, S.in * sy, sx, -sy], [S.in * sx, S.out * sy, -sx, sy], [S.out * sx, S.out * sy, sx, sy]]) {
      const r = 6, pts = [[cx, cy, 0]];
      for (let i = 0; i <= 8; i++) { const a = (Math.PI / 2) * i / 8; pts.push([cx + dx * r * (1 - Math.sin(a)), cy + dy * r * (1 - Math.cos(a)), 0]); }
      g.fill(pts, ASPH);
    }
    for (let i = 0; i < strips.length; i++) {
      const [a, b] = strips[i], alongY = i < 2, d = alongY ? Math.atan2(AY, -AX) : Math.atan2(AY, AX), p = g.P(K.rect(a[0], a[1], b[0], b[1]));
      g.scuff2(p, { dir: d, len: 9, c: '#E5E0D3', dens: 0.45, w: 0.55, spread: 0.05 });
      g.scuff2(p, { dir: d, len: 7, c: '#C9C3B4', dens: 0.12, w: 0.45, spread: 0.04 });
    }
    // white dashed centre lines, broken at the crossings and the zebras
    for (const c of [-50, 50]) for (const alongY of [true, false]) for (let s = -S.end + 3; s < S.end - 5; s += 9) {
      if (Math.abs(Math.abs(s) - 50) < 21) continue;
      const a = alongY ? [c, s, 0] : [s, c, 0], b = alongY ? [c, s + 4.2, 0] : [s + 4.2, c, 0];
      g.line([a, b], { c: LINE, w: 1.0, boil: false, ext: 0.2 });
    }
    // zebra bars on the four arms of each crossing, and the stop lines behind them

      for (const sgn of [-1, 1]) {
        const segs = [];
        for (let k = -11; k <= 11; k += 2.2) {        // arm along y: bars run along y, repeated across x
          const y0 = cy + sgn * 14.5, y1 = cy + sgn * 19.5;
          g.fill(K.rect(cx + k - 0.7, Math.min(y0, y1), cx + k + 0.7, Math.max(y0, y1)), LINE);
          const x0 = cx + sgn * 14.5, x1 = cx + sgn * 19.5;
          g.fill(K.rect(Math.min(x0, x1), cy + k - 0.7, Math.max(x0, x1), cy + k + 0.7), LINE);
        }
        g.line([[cx - 12.5, cy + sgn * 21, 0], [cx + 12.5, cy + sgn * 21, 0]], { c: LINE, w: 0.9, boil: false });
        g.line([[cx + sgn * 21, cy - 12.5, 0], [cx + sgn * 21, cy + 12.5, 0]], { c: LINE, w: 0.9, boil: false });

      }
    }

    for (const sgn of [-1, 1]) for (const c of [-50, 50]) {

        for (let k = 0; k <= 8; k++) { const t = -13 + 26 * k / 8, j = (R() - 0.5) * 3; pts.push(alongY ? [c + t, e + sgn * (1 + j), 0] : [e + sgn * (1 + j), c + t, 0]); }
        g.fill(pts.concat(alongY ? [[c + 13, e - sgn * 0.5, 0], [c - 13, e - sgn * 0.5, 0]] : [[e - sgn * 0.5, c + 13, 0], [e - sgn * 0.5, c - 13, 0]]), ASPH);
      }

  ];

  for (const ch of chains) {
    const hs = STOPS.map((s, i) => 13.5 + ((i * 7) % 3) * 0.4);
    STOPS.forEach((s, i) => {
      const x = ch.alongY ? ch.c : s, y = ch.alongY ? s : ch.c, h = hs[i];
      T.obj([x, y], (g) => {
        TK.upole(g, x, y, { h, across: ch.alongY ? 'x' : 'y', band: i % 3 === 1, can: i % 2 === 0 });
        if (i + 1 < STOPS.length) TK.wires(g, hangAt(ch, s, h), hangAt(ch, STOPS[i + 1], hs[i + 1]), (STOPS[i + 1] - s) > 40 ? 2.6 : 1.5);
      }, { name: 'pole' });
    });
  }

  /* ---- the timetable ---- */
  const END = S.end, SPAN = 2 * END, V = 13, P = SPAN / V;
  const LANES = [[true, 42, 1], [true, 58, -1], [true, -58, 1], [true, -42, -1], [false, 58, 1], [false, 42, -1], [false, -42, 1], [false, -58, -1]];
  const KIND = [['taxi', 'car'], ['kei', 'taxiY'], ['car', 'van'], ['taxi', 'car'], ['van', 'taxi'], ['car', 'kei'], ['taxiG', 'car'], ['car', 'taxi']];
  const PHASE = [20.6402, 11.1821, 0.3856, 19.6398, 1.9216, 15.5861, 7.1265, 0.2975];      // searched offline, see header
  const CARS = ['#F1EFE8', '#C9CCCC', '#2F343B', '#F1EFE8', '#8FA3B5', '#B9A27D', '#E7E2D6', '#6C7A89'];
  const draw = (g, ang, kind, col) => {
    if (kind === 'taxi') TK.taxi(g, ang);
    else if (kind === 'taxiY') TK.taxi(g, ang, { col: '#E6C24F', lamp: '#F3F1EA' });
    else if (kind === 'taxiG') TK.taxi(g, ang, { col: '#6FA36B', lamp: '#F3F1EA' });
    else if (kind === 'kei') TK.kei(g, ang, { cargo: (gg, B) => { const p = B.pt(-1, 0, 2.0); K.rbox(gg, p[0], p[1], 1.6, 1.4, ang, 2.0, 3.2, '#C9A26B', { w: 0.5 }); } });
    else if (kind === 'van') K.bus(g, ang, { L: 6.0, W: 2.5, h: 4.8, n: 3, band: col === '#F1EFE8' ? '#3F7F4F' : '#5E8FC9' });
    else K.car(g, ang, { col });
  };
  LANES.forEach((L, li) => {
    for (let k = 0; k < 2; k++) {
      const kind = KIND[li][k], col = CARS[(li * 3 + k * 5) % CARS.length];
      T.actor({
        cast: false, sample: 0.18, period: P,
        at(t) {
          // Japan drives on the left: the searched timetable runs backwards in time (t -> -t), so every lane's cars
          // drive the other way along the same lane. The same configurations occur, so it stays collision-free.
          const s = ((((PHASE[li] * V + k * SPAN / 2 - L[2] * V * t) % SPAN) + SPAN) % SPAN) - END, edge = Math.min(1, (END - 2 - Math.abs(s)) / 10);
          if (edge <= 0.02) return null;
          const ang = L[0] ? (L[2] < 0 ? Math.PI / 2 : -Math.PI / 2) : (L[2] < 0 ? 0 : Math.PI);
          return { x: L[0] ? L[1] : s, y: L[0] ? s : L[1], key: 'l' + li, ang, alpha: edge < 1 ? edge : null };
        },
        draw(g, st) { draw(g, st.ang, kind, col); },
      });
    }
  });
});

/* ---- src/tiles/loop.js ---- */
/* The Yamanote loop: a red-brick arched viaduct right round the city (centre line a rounded square of half-size 152,
   corners of radius 16), carrying two tracks. Steel plate girders span the streets where they run out under it, with
   yellow-and-black clearance bars. In the arches on the outside: izakaya with lanterns and noren, yakitori smoke, a
   ramen counter, tiny bars, shutters, bicycles; people drink outside on beer crates. Catenary masts stand on the back
   edge. Two silver-and-green trains run the loop in opposite directions.
   Depth: the far half (sides W and N, the top corner) is the tile 'loopFar', drawn before every place; the near half
   (sides E and S, the other three corners) is 'loopNear', drawn after every place. Each side is one object with
   { under: deck } so cars pass under its girders and trains ride on top. Train cars in the near half are drawn on top

   The cycle (21 s): road A (along x) gets green, then road B, then every car light is red and everyone crosses at once,
   diagonals included, while cars queue at the stop lines. The cycle is shifted so the film's Shibuya shot opens on

  // signals on the four corners: car heads and the walking man
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) T.actor({ sample: 5, period: 10, grow: false,
    at(t) { const { tc } = cyc(t); const ph = tc < 3.8 ? 'A' : tc < 4.8 ? 'Ay' : tc < 8.8 ? 'B' : tc < 9.8 ? 'By' : tc < PED0 ? 'R' : tc < CYC - 2.2 ? 'P' : (Math.floor(tc * 3) % 2 ? 'Pb' : 'R'); return { x: sx * 8.1, y: sy * 8.1, key: ph, ph }; },

      const pg = st.ph === 'P', pr = !pg && st.ph !== 'Pb';
      g.fill2([[p[0] + 0.8, p[1] - 3.0], [p[0] + 1.4, p[1] - 3.0], [p[0] + 1.4, p[1] - 1.4], [p[0] + 0.8, p[1] - 1.4]], pr ? '#E0503E' : '#5A544A', true); if (pr) g.mark({ nc: true, light: true });
      g.fill2([[p[0] + 0.6, p[1] - 0.6], [p[0] + 1.6, p[1] - 0.6], [p[0] + 1.4, p[1] + 1.0], [p[0] + 0.8, p[1] + 1.0]], pg ? '#5FC07A' : '#5A544A', true); if (pg) g.mark({ nc: true, light: true });
    } });

  /* ---- the cars: road A (along x) and road B (along y), two per lane, queueing at the stop lines ---- */
  // left-hand traffic: heading +x keeps to the -y side, heading +y to the +x side
  const LANES = [{ ax: 'x', c: -3.5, d: 1, g0: 0 }, { ax: 'x', c: 3.5, d: -1, g0: 0 }, { ax: 'y', c: 3.5, d: 1, g0: 5.0 }, { ax: 'y', c: -3.5, d: -1, g0: 5.0 }];
  const KINDS = [['taxi', 'bus'], ['car', 'taxi'], ['taxi', 'car'], ['bus', 'taxi']];

  LANES.forEach((L, li) => [0, 1].forEach((k) => {
    const kind = KINDS[li][k], col = ['#F1EFE8', '#C9CCCC', '#2F343B', '#8FA3B5'][(li + k * 2) % 4], hl = kind === 'bus' ? 6.8 : 5.3;
    const qk = k === 0 ? -15.2 - hl : Q[1] - (hl - 5.3), td = L.g0 + k * 0.8, te = td + 8 + k * 2.2, D = qk + 37, Ta = 2 * D / 10;
    const sAt = (tc) => {                                       // position along the lane in this cycle
      if (tc >= td) { const u = tc - td; const s = u < TAU_A ? qk + ACC * u * u / 2 : qk + DACC + V * (u - TAU_A); if (s < 40) return s; }

  }));

  /* ---- the crowd: 72 people shuttle between the four corners, one crossing per cycle ---- */
  const NW = 72, CORN = [[1, 1], [1, -1], [-1, -1], [-1, 1]], SLOTS = [];
  for (let ci = 0; ci < 4; ci++) { const [sx, sy] = CORN[ci], R = RNG(ci * 97 + 5), list = []; for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) { if (list.length >= 18) break; const u = 0.55 + i * 1.42 + (j % 2) * 0.6 + (R() - 0.5) * 0.3, v = 0.55 + j * 1.18 + (R() - 0.5) * 0.3; if (u > 5.6) continue; list.push({ x: sx * (8.6 + u), y: sy * (8.6 + v), front: Math.min(u, v) + 0.35 * Math.max(u, v), ci }); } while (list.length < 18) list.push({ x: sx * (8.6 + 2.8), y: sy * (8.6 + 4.6 + list.length * 0.01), front: 4, ci }); SLOTS.push(list); }
  // each cycle a seeded shuffle of the 72 slots: about a quarter stay on their corner, the rest scatter (diagonals too)

  const slotOf = (n, w) => { const s = perm(n)[w]; return SLOTS[s % 4][Math.floor(s / 4)]; };
  const dirOf = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
  const LOOKS = [];
  for (let i = 0; i < 24; i++) LOOKS.push(i % 6 === 1 ? TK.salary(600 + i) : i === 9 || i === 20 ? TK.kimono(600 + i) : TK.who(600 + i, i % 5 === 3 ? { phone: true } : {}));

        if (tc >= t1) { const C = slotOf(n + 2, w), d = C.ci === B.ci ? dirOf(-B.x, -B.y) : dirOf(C.x - B.x, C.y - B.y); return { x: B.x, y: B.y, key: 's' + d, dir: d, pose: look.phone ? 'hold' : 'stand' }; }
        const u = (tc - t0) * spd, f = u / dist, d = dirOf(B.x - A.x, B.y - A.y), ph = Math.floor((u / 2.4) % 1 * 8);

      },

  }
});

   low stalls with red parasols opposite, so nothing tall stands between us and the path) → Hōzōmon (two storeys, two
   roofs) → the incense burner with its smoke → the main hall on a stone podium under a huge roof. The five-storey

SF.tile('sensoji', 0, 100, { rim: 24 }, function (T) {

    g.fill(K.rect(-H, 27, H, 33.5), '#E2DBCB'); g.line([[-H, 27, 0], [H, 27, 0]], { w: 0.5, c: '#B9B1A0', boil: false });
    // moss and a little garden on the near side, a pond with carp-coloured dots

    const pond = K.curve([[-12, 13, 0], [-5, 12, 0], [-1, 15, 0], [-3, 20, 0], [-10, 21, 0], [-14, 17, 0]], 5, true);
    g.fill(pond.map((p) => [p[0] * 1.06 + 0.4, p[1] * 1.04 - 0.6, 0]), C.waterD); g.fill(pond, C.water); g.water(pond, { dens: 0.7 });
    for (const [x, y, c] of [[-8, 15.5, '#E08A3C'], [-6, 17.6, '#F3F1EA'], [-10, 18, '#E08A3C']]) { const p = g.p(x, y, 0.02); g.fill2([[p[0] - 1.4, p[1]], [p[0], p[1] - 0.5], [p[0] + 1.4, p[1]], [p[0], p[1] + 0.5]], c, true); }

  /* a temple body: vermilion posts on a podium, white plaster between, a dark band of lattice under the eaves */

    if (pinch && ptrs.size === 2) {
      const p = Array.from(ptrs.values()), d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
      zoomAt((p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2, d / pinch.d); pinch.d = d; return;
    }
    if (drag) {
      const { s, k } = scale(), pz = APP.cam.z * s;
      drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
      if (drag.moved > 4) { APP.cam.cx = drag.cx - (e.clientX - drag.x) * k / pz; APP.cam.cy = drag.cy - (e.clientY - drag.y) * k / pz; clampCam(APP.cam); }
    }
  });
  const up = (e) => {
    if (drag && drag.moved <= 4 && ptrs.size === 1 && APP.mode === 'explore') {
      if (!uiHit(e.clientX, e.clientY)) { const w = toWide(e.clientX, e.clientY); visitWorld(w[0], w[1]); }
    }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) { drag = null; cv.style.cursor = APP.mode === 'explore' ? 'grab' : 'none'; }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', (e) => {
    e.preventDefault(); touch();
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
    zoomAt(e.clientX, e.clientY, f);
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'r' || k === 'R') { replay_(); return; }
    touch();
    if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === 'n' || k === 'N') SF.setLook({ night: !LOOK.night });
    else if (k === '0' || k === 'Escape') { if (SF.home) SF.glideTo(SF.home()); else cutTo(WIDE); }   // the page's guide may frame the city beside its panel
    else if (k >= '1' && k <= '9' && VISIT[+k - 1]) cutTo(shotByName(VISIT[+k - 1]));
  });
}
function togglePause() {
  if (APP.paused) { APP.t0 = performance.now() - APP.pauseAt * 1000; APP.paused = false; }
  else { APP.pauseAt = now(); APP.paused = true; }
}
function replay_() { ACT_DL.size; startFilm(); }

/* ---------- the two pen-drawn icons ---------- */
const UI = { dl: null, r: 26 };
function uiIcons() {
  if (UI.dl) return UI.dl;
  const mk = (fn) => { const g = new G('ui' + fn.name); g.boilP = 0; fn(g); return { cmds: g.cmds, comp: new Map() }; };
  const arc = (r, a0, a1, n) => { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([Math.cos(a) * r, Math.sin(a) * r]); } return p; };
  UI.dl = {
    replay: mk(function replay(g) { g.line2(arc(8, 0.75, 5.5, 24), { w: 1, taper: 0.3, ext: 0 }); const a = 5.5, e = [8 * Math.cos(a), 8 * Math.sin(a)], t = [-Math.sin(a), Math.cos(a)], n = [Math.cos(a), Math.sin(a)]; g.line2([[e[0] - t[0] * 3.4 + n[0] * 3.2, e[1] - t[1] * 3.4 + n[1] * 3.2], [e[0] + t[0] * 1.6, e[1] + t[1] * 1.6], [e[0] - t[0] * 3.4 - n[0] * 3.2, e[1] - t[1] * 3.4 - n[1] * 3.2]], { w: 1, ext: 0 }); }),
    pause: mk(function pause(g) { g.line2([[-3.4, -7], [-3.6, 7]], { w: 1.25 }); g.line2([[3.6, -7], [3.4, 7]], { w: 1.25 }); }),
    play: mk(function play(g) { g.outline2([[-4, -7.5], [7, 0], [-4, 7.5]], { w: 1 }); }),
  };
  return UI.dl;
}
function uiPos() { const cv = APP.cv, k = cv.width / cv.clientWidth; return { k, a: [34 * k, cv.height - 34 * k], b: [78 * k, cv.height - 34 * k] }; }
function uiHit(ex, ey) {
  if (SF.ui === false) return false;
  const p = uiPos(), x = ex * p.k, y = ey * p.k, r = 20 * p.k;
  if (Math.hypot(x - p.a[0], y - p.a[1]) < r) { replay_(); return true; }
  if (Math.hypot(x - p.b[0], y - p.b[1]) < r) { togglePause(); return true; }
  return false;
}
function drawUI(ctx, cv) {
  if (SF.ui === false) return;                               // the page's guide draws its own controls
  const idle = (performance.now() - APP.lastInput) / 1000, a = APP.paused ? 1 : clamp(1.6 - (idle - 2.5) / 0.8, 0, 1);
  if (a <= 0) return;
  const ic = uiIcons(), p = uiPos(), s = 1.7 * p.k;
  ctx.globalAlpha = 0.8 * a;
  for (const [dl, pos] of [[ic.replay, p.a], [APP.paused ? ic.play : ic.pause, p.b]]) {
    ctx.setTransform(s, 0, 0, s, pos[0], pos[1]);
    for (const g of compiled(dl, 0.75, true)) { const c = LOOK.night ? '#E9E2D2' : g.col; if (g.m === 0) { ctx.fillStyle = c; ctx.fill(g.p); } else { ctx.strokeStyle = c; ctx.lineWidth = g.lw; ctx.stroke(g.p); } }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
}

/* ---------- for the page's guide (a DOM overlay): read the view, move the camera, hear the mode change ----------
   Cameras are in wide px (the 1920 x 1080 frame at zoom 1); SF.prj turns a world point into wide px. */
window.SF = SF;                                              // a top-level const is not a window property
const EV = {};
function emit(k, a) { for (const f of EV[k] || []) { try { f(a); } catch (e) { console.error(e); } } }
SF.on = (k, f) => { (EV[k] = EV[k] || []).push(f); };
SF.prj = (x, y, z) => prj(x, y, z || 0);
SF.wide = WIDE; SF.shots = SHOTS; SF.visit = VISIT; SF.bounds = BOUNDS;
SF.shot = (name) => shotByName(name);
SF.zMin = () => BOUNDS.z[0];
/* the camera on screen now, and how wide px map to CSS px */
SF.view = function () {
  const cv = APP.cv, cam = APP.mode === 'explore' ? APP.cam : (APP.filmCam || WIDE);
  const k = cv.width / cv.clientWidth, pz = cam.z * Math.min(cv.width / 1920, cv.height / 1080) / k;
  return { mode: APP.mode, z: cam.z, cx: cam.cx, cy: cam.cy, pz, w: cv.clientWidth, h: cv.clientHeight, paused: !!APP.paused, gliding: !!APP.glide };
};
SF.toScreen = function (wx, wy, v) { v = v || SF.view(); return [(wx - v.cx) * v.pz + v.w / 2, (wy - v.cy) * v.pz + v.h / 2]; };
/* the map's extent in wide px (every tile, satellites included) */
SF.boxes = () => SF.live.map((t) => t.bb.slice());              // every tile's and satellite's wide-px box
SF.extent = function () { let a = [1e9, 1e9, -1e9, -1e9]; for (const t of SF.live) { a[0] = Math.min(a[0], t.bb[0]); a[1] = Math.min(a[1], t.bb[1]); a[2] = Math.max(a[2], t.bb[2]); a[3] = Math.max(a[3], t.bb[3]); } return a; };
/* glide the explore camera to a camera {z, cx, cy}, a shot's name, or WIDE; it pulls back on long trips */
SF.glideTo = function (to, ms) {
  if (typeof to === 'string') to = shotByName(to) || WIDE;
  if (APP.mode !== 'explore') toExplore(false);
  const b = { z: to.z, cx: to.cx, cy: to.cy }; clampCam(b);
  const a = { z: APP.cam.z, cx: APP.cam.cx, cy: APP.cam.cy }, d = Math.hypot(b.cx - a.cx, b.cy - a.cy);
  const fit = 1920 * 0.7 / Math.max(1, d), lo = Math.min(a.z, b.z), dip = Math.max(0, Math.log(lo / Math.max(fit, WIDE.z)));
  APP.glide = { a, b, dip, t0: performance.now(), ms: ms || clamp(700 + d * 0.5 + dip * 260, 700, 1600) };
  APP.lastInput = performance.now();
};
function stepGlide() {
  const g = APP.glide, t = clamp((performance.now() - g.t0) / g.ms, 0, 1), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lz = Math.log(g.a.z) + (Math.log(g.b.z) - Math.log(g.a.z)) * e - g.dip * Math.sin(Math.PI * e);
  APP.cam = { z: Math.exp(lz), cx: g.a.cx + (g.b.cx - g.a.cx) * e, cy: g.a.cy + (g.b.cy - g.a.cy) * e };
  APP.dirtyZoom = performance.now(); APP.lastInput = performance.now();
  if (t >= 1) { APP.cam = Object.assign({}, g.b); APP.glide = null; APP.phase = (APP.phase + 1) % 6; emit('arrive', Object.assign({}, g.b)); }
}
SF.paper = () => (LOOK.night ? NIGHT.paper : [240, 238, 228]);     // the colour of the bare paper (the guide finds room for its notes)
SF.pause = () => { if (!APP.paused) togglePause(); };
SF.resume = () => { if (APP.paused) togglePause(); };
SF.togglePause = () => togglePause();
SF.replay = () => replay_();

</script>
