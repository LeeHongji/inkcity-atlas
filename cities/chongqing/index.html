<script>
'use strict';
/* ---- ../../engine/00_core.js ---- */
/* core: projection, seeded noise, colour helpers.
   World units: 1 street pitch = 100 u (a tile is 74 u across with streets between). Origin = centre of the middle tile.
   +X runs to the lower right of the screen, +Y to the lower left, +Z straight up.
   "Wide px" are the pixels of the 1920x1080 wide view; every display list is stored in them. */
const SF = { tiles: [], tileBy: {}, actors: [], W: 1920, H: 1080 };
const AX = 2.92, AY = 1.59, VZ = 3.46, OX = 960, OY = 603;
const FPS = 30;

function prj(x, y, z) { return [OX + (x - y) * AX, OY + (x + y) * AY - (z || 0) * VZ]; }
/* wide px -> ground (z = 0) world coordinates */
function unprj(wx, wy) { const a = (wx - OX) / AX, b = (wy - OY) / AY; return [(a + b) / 2, (b - a) / 2]; }

/* ---------- deterministic randomness ---------- */
function hashi(n) {
  n = Math.imul(n ^ (n >>> 16), 0x7feb352d); n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  return ((n ^ (n >>> 16)) >>> 0);
}
function h1(n) { return hashi(n | 0) / 4294967296; }               // [0,1)
function h2(a, b) { return hashi((Math.imul(a | 0, 0x9e3779b1) ^ (b | 0)) + 0x632be5ab) / 4294967296; }
function hstr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function RNG(seed) {
  let a = (typeof seed === 'string' ? hstr(seed) : seed) >>> 0;
  const r = function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => lo + Math.floor((hi - lo + 1) * r());
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.sign = () => (r() < 0.5 ? -1 : 1);
  return r;
}
/* smooth 1-D value noise in [-1,1] */
function vnoise(x, seed) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = h2(i, seed) * 2 - 1, b = h2(i + 1, seed) * 2 - 1;
  return a + (b - a) * u;
}
/* smooth 2-D value noise in [0,1] */
function vnoise2(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const k = (a, b) => h2(a * 7919 + b * 104729, seed);
  const a = k(ix, iy), b = k(ix + 1, iy), c = k(ix, iy + 1), d = k(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

/* ---------- small maths ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* ---------- colour ---------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + ((1 << 24) | (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255)).toString(16).slice(1); }
/* mix two hex colours */
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
/* darker / lighter in a paint-like way (towards a warm dark / towards paper) */
function shade(c, t) { return t >= 0 ? mix(c, '#3A3226', t) : mix(c, '#F6F3EA', -t); }

/* ---------- palette (approximate targets decoded from the reference) ---------- */
const C = {
  paper: '#F0EEE4', ink: '#2C271C', ink2: '#5E574A', ink3: '#8C8576',
  street: '#DDD7C9', streetMark: '#EDE8DC', dash: '#D9B44A', kerb: '#E9E5DA', pave: '#EAE7DC', paveScuff: '#F7F5EE',
  grass: '#B5CF8E', grassM: '#95B16B', grassD: '#788F53', grassL: '#C6DBA0',
  water: '#AACBE3', waterD: '#8BA3BD', waterL: '#C9DFEE', foam: '#F6F7F3',
  slab: '#D7C2A5', slabD: '#B4A58D', earth: '#C9B79B', earthD: '#AD9C82',
  wall: '#F1EFE8', wallM: '#E3E0D6', wallD: '#CFCCC1', stone: '#DAD6CA',
  red: '#BF5B49', redD: '#A34635', redL: '#CE7265', redDeep: '#713B2A', intl: '#D4553A', intlD: '#B9432C', intlL: '#E06A4C',
  navy: '#434D58', navyD: '#2F3740', glass: '#CFE0EA', glassD: '#9DB6C8',
  gold: '#DAAD45', goldM: '#B3A467', teal: '#5B9086', tealL: '#67AD8B', tealD: '#42706A',
  concrete: '#BCBEBA', concreteD: '#A1A39F', wood: '#C9A26B', woodD: '#A07C4C', trunk: '#A0714B', trunkD: '#7C5638',
  leaf: '#8DB868', leafD: '#6E9A50', leafL: '#A6CB7E', leafInk: '#4B6B36', cyp: '#4F7A4A', cypD: '#3C6038',
  dome: '#B9CDE0', domeD: '#93A9C4', sand: '#EBDDB5', pink: '#EDA9BD', pinkD: '#D98AA4', lav: '#B9A7D6', butter: '#EBD98C', mint: '#B5DCC2', sky: '#A9CDE6', rose: '#E7A9A0',
  white: '#F8F7F2', black: '#2A2622', yellow: '#E9C543', orange: '#E08A3C', purple: '#9A7CC0', blue: '#5E8FC9', blueD: '#3F6FA8', green: '#6FAE6A', brown: '#8A5A3A', brick: '#B5624B', brickD: '#96503E',
};
const SKIN = ['#F2D3B8', '#E8BE9A', '#D9A57B', '#C08A5E', '#A06B45', '#7A4E33', '#5F3D2A'];
const HAIR = ['#2B2420', '#3D2B1F', '#5A3A24', '#7B4E2C', '#A8743D', '#D9B560', '#B24A2E', '#8E8A84', '#1F2A3C'];
const CLOTH = ['#C9584B', '#DD8E4A', '#E6C24F', '#8FBF73', '#5FA58F', '#5F8FC9', '#3F5F8F', '#8E79C0', '#D98AA4', '#F0EDE4', '#3B3F47', '#B9A27D', '#7FB7D9', '#A4C66B', '#E7A9A0', '#6C7A89'];

/* ---- ../../engine/10_pen.js ---- */
/* the pen and the paint.
   A recorder (G) turns drawing calls into a display list stored in wide px.
   Display lists are replayed into canvases at any zoom; line weight is applied at replay time,
   so a drawing is re-inked crisply at every zoom instead of being scaled. */

/* main-contour screen width (px) as one smooth curve through 1.4 @x1, 2.25 @x3, 4.8 @x9.3 */
function lineW(zoom) { const x = Math.log(Math.max(zoom, 0.3)); return Math.exp(0.336 + 0.3154 * x + 0.1065 * x * x); }

const K_FILL = 0, K_RIB = 1, K_STROKE = 2, K_DISC = 3, K_SEGS = 4, K_TRIS = 5, K_RING = 6;
const BOIL_N = 6;

function polyArea(p) { let a = 0; for (let i = 0, n = p.length; i < n; i += 2) { const j = (i + 2) % n; a += p[i] * p[j + 1] - p[j] * p[i + 1]; } return a / 2; }
function pointInPoly(x, y, p) {
  let inside = false;
  for (let i = 0, n = p.length, j = n - 2; i < n; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function flat(pts) { const a = new Float32Array(pts.length * 2); for (let i = 0; i < pts.length; i++) { a[2 * i] = pts[i][0]; a[2 * i + 1] = pts[i][1]; } return a; }

/* Build one pen stroke: per-segment resample (corners are kept), sideways low-frequency wobble plus a tiny
   tremor, a speed-like width profile (a little heavier at the start, each end pools or flicks),
   and ends that overshoot or stop short by a hair. */
function mkRibbon(pts, seed, o) {
  const step = o.step || 2.6, wob = o.wob == null ? 1 : o.wob;
  let P = pts;
  if (o.close) P = pts.concat([pts[0]]);
  // end overshoot / undershoot (wide px)
  const r0 = h2(seed, 11), r1 = h2(seed, 12);
  const ext = o.close ? [0, 0] : [(o.ext == null ? 1 : o.ext) * (r0 < 0.18 ? -0.45 * h2(seed, 13) : 0.15 + 0.75 * r0 * r0),
                                  (o.ext == null ? 1 : o.ext) * (r1 < 0.18 ? -0.45 * h2(seed, 14) : 0.15 + 0.75 * r1 * r1)];
  const xs = [], ys = [], ss = [];
  let s = 0;
  for (let i = 0; i < P.length - 1; i++) {
    let ax = P[i][0], ay = P[i][1], bx = P[i + 1][0], by = P[i + 1][1];
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    if (len < 1e-4) continue;
    if (i === 0 && ext[0]) { ax -= dx / len * ext[0]; ay -= dy / len * ext[0]; }
    if (i === P.length - 2 && ext[1]) { bx += dx / len * ext[1]; by += dy / len * ext[1]; }
    const L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(L / step));
    for (let k = (xs.length ? 1 : 0); k <= n; k++) { const t = k / n; xs.push(ax + (bx - ax) * t); ys.push(ay + (by - ay) * t); ss.push(s + L * t); }
    s += L;
  }
  const n = xs.length;
  if (n < 2) return null;
  const c = new Float32Array(n * 2), nr = new Float32Array(n * 2), w = new Float32Array(n);
  const amp = wob * Math.min(0.55, 0.2 + 0.004 * s), lam = 16 + 10 * h2(seed, 3);
  const startHeavy = h2(seed, 5) < 0.6, endKind = h2(seed, 6);          // <0.45 flick, <0.7 pool, else plain
  const taper = o.taper == null ? 1 : o.taper;
  for (let i = 0; i < n; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
    let tx = xs[i1] - xs[i0], ty = ys[i1] - ys[i0];
    if (o.close && (i === 0 || i === n - 1)) { tx = xs[1] - xs[n - 2]; ty = ys[1] - ys[n - 2]; }
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const nx = -ty, ny = tx;
    const si = ss[i];
    // fade the wobble out at closed-loop seams so the loop meets itself
    const edge = o.close ? Math.min(1, Math.min(si, s - si) / 4) : 1;
    const off = edge * (amp * vnoise(si / lam, seed) + 0.06 * wob * vnoise(si / 2.3, seed + 7));
    c[2 * i] = xs[i] + nx * off; c[2 * i + 1] = ys[i] + ny * off;
    nr[2 * i] = nx; nr[2 * i + 1] = ny;
    let wi = 1 + 0.16 * vnoise(si / 21, seed + 21);
    if (!o.close && taper) {
      if (startHeavy) wi *= 1 + 0.28 * taper * Math.max(0, 1 - si / 2.2);
      const e = s - si;
      if (endKind < 0.45) wi *= 1 - 0.6 * taper * Math.max(0, 1 - e / 3.5);
      else if (endKind < 0.7) wi *= 1 + 0.3 * taper * Math.max(0, 1 - e / 1.8);
      if (o.flick) wi *= Math.min(1, 0.25 + e / (0.5 * s + 0.01)) * Math.min(1, 0.4 + si / (0.3 * s + 0.01));
    }
    w[i] = wi;
  }
  let bo = null;
  if (o.boil) {
    bo = new Float32Array(BOIL_N * n);
    for (let k = 0; k < BOIL_N; k++) for (let i = 0; i < n; i++) {
      bo[k * n + i] = 0.5 * vnoise(ss[i] / 8.5 + 31 * k, seed + 101 + k) + 0.22 * vnoise(ss[i] / 2.2, seed + 301 + k * 17);
    }
  }
  return { k: K_RIB, c, n: nr, w, len: s, bo };
}

class G {
  constructor(seed) {
    this.cmds = []; this.seed = typeof seed === 'string' ? hstr(seed) : (seed | 0); this.cnt = 0;
    this.ox = 0; this.oy = 0; this.oz = 0; this.stack = [];
    this.bb = [1e9, 1e9, -1e9, -1e9];
    this.ink = C.ink; this.boilP = 0.5; this.swap = false;
  }
  /* world -> wide px (with the recorder's current origin) */
  p(x, y, z) { return this.swap ? prj(this.ox + y, this.oy + x, this.oz + (z || 0)) : prj(this.ox + x, this.oy + y, this.oz + (z || 0)); }
  P(pts) { const o = new Array(pts.length); for (let i = 0; i < pts.length; i++) o[i] = this.p(pts[i][0], pts[i][1], pts[i][2]); return o; }
  /* draw with a shifted origin; swap=true mirrors the drawing across the X=Y diagonal (turns a +X-facing thing to face +Y) */
  at(x, y, z, fn, swap) {
    this.stack.push([this.ox, this.oy, this.oz, this.swap]);
    if (this.swap) { this.ox += y; this.oy += x; } else { this.ox += x; this.oy += y; }
    this.oz += (z || 0); if (swap) this.swap = !this.swap;
    fn(this);
    const s = this.stack.pop(); this.ox = s[0]; this.oy = s[1]; this.oz = s[2]; this.swap = s[3];
  }
  _bb(a) { const b = this.bb; for (let i = 0; i < a.length; i += 2) { if (a[i] < b[0]) b[0] = a[i]; if (a[i] > b[2]) b[2] = a[i]; if (a[i + 1] < b[1]) b[1] = a[i + 1]; if (a[i + 1] > b[3]) b[3] = a[i + 1]; } }
  _seed() { return (this.seed + Math.imul(++this.cnt, 2654435761)) | 0; }

  /* ----- wide-px (2-D) primitives ----- */
  fill2(pts, col, exact) {
    if (!col || pts.length < 3) return;
    let a = flat(pts);
    // a hair of hand-registration: vertices move by a position-keyed amount, so shared edges stay shared
    // (exact: off, for parts smaller than the wobble itself, such as a face)
    if (!exact) for (let i = 0; i < a.length; i += 2) { const k = Math.round(a[i] * 8) * 4099 + Math.round(a[i + 1] * 8); a[i] += (h2(k, 71) - 0.5) * 0.3; a[i + 1] += (h2(k, 72) - 0.5) * 0.3; }
    if (polyArea(a) < 0) { const r = new Float32Array(a.length); for (let i = 0, n = a.length / 2; i < n; i++) { r[2 * i] = a[2 * (n - 1 - i)]; r[2 * i + 1] = a[2 * (n - 1 - i) + 1]; } a = r; }
    this._bb(a); this.cmds.push({ k: K_FILL, p: a, c: col });
  }
  line2(pts, o) {
    o = o || {};
    if (pts.length < 2) return;
    const seed = this._seed(), wt = o.w == null ? 1 : o.w;
    const boil = o.co ? false : (o.boil == null ? (wt >= 0.7 && h2(seed, 91) < this.boilP) : !!o.boil);
    const r = mkRibbon(pts, seed, { close: o.close, boil, wob: o.wob, ext: o.ext, taper: o.taper, flick: o.flick, step: o.step });
    if (!r) return;
    r.col = o.c || this.ink; r.wt = wt; r.cons = o.cons !== false; if (o.co) r.co = true;
    this._bb(r.c); this.cmds.push(r);
  }
  fine2(pts, o) {
    o = o || {};
    if (pts.length < 2) return;
    const a = flat(o.close ? pts.concat([pts[0]]) : pts);
    this._bb(a); this.cmds.push({ k: K_STROKE, p: a, col: o.c || this.ink, wt: o.w == null ? 0.5 : o.w, cons: o.cons !== false });
  }
  /* outline of a polygon: each straight run is its own stroke, so corners are joined by hand */
  outline2(pts, o) {
    o = o || {};
    const n = pts.length; if (n < 2) return;
    const closed = o.open ? false : true;
    const corner = (i) => {
      const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
      const ux = b[0] - a[0], uy = b[1] - a[1], vx = c[0] - b[0], vy = c[1] - b[1];
      const d = (ux * vx + uy * vy) / ((Math.hypot(ux, uy) || 1) * (Math.hypot(vx, vy) || 1));
      return d < 0.82;
    };
    let starts = [];
    for (let i = 0; i < n; i++) if ((closed || (i > 0 && i < n - 1)) && corner(i)) starts.push(i);
    if (!closed) {
      let run = [pts[0]];
      for (let i = 1; i < n; i++) { run.push(pts[i]); if (starts.indexOf(i) >= 0) { this.line2(run, o); run = [pts[i]]; } }
      if (run.length > 1) this.line2(run, o);
      return;
    }
    if (starts.length === 0) { this.line2(pts, Object.assign({}, o, { close: true })); return; }
    for (let k = 0; k < starts.length; k++) {
      const a = starts[k], b = starts[(k + 1) % starts.length], run = [];
      let i = a; run.push(pts[i]);
      do { i = (i + 1) % n; run.push(pts[i]); } while (i !== b);
      if (o.skip && o.skip(k, run)) continue;
      this.line2(run, o);
    }
  }
  poly2(pts, col, o) { this.fill2(pts, col); if (o !== false) this.outline2(pts, o); }
  disc2(pt, r, col) { if (r <= 0) return; this._bb([pt[0] - r, pt[1] - r, pt[0] + r, pt[1] + r]); this.cmds.push({ k: K_DISC, x: pt[0], y: pt[1], r, c: col }); }
  ring2(pt, r, o) { o = o || {}; this._bb([pt[0] - r, pt[1] - r, pt[0] + r, pt[1] + r]); this.cmds.push({ k: K_RING, x: pt[0], y: pt[1], r, col: o.c || this.ink, wt: o.w == null ? 0.6 : o.w, cons: true }); }
  /* batches of tiny marks */
  segs2(arr, col, wt, cons) { if (!arr.length) return; for (let i = 0; i < arr.length; i += 2400) { const a = Float32Array.from(arr.slice(i, i + 2400)); this._bb(a); this.cmds.push({ k: K_SEGS, p: a, col, wt: wt == null ? 0.5 : wt, cons: !!cons }); } }
  tris2(arr, col, cons) { if (!arr.length) return; for (let i = 0; i < arr.length; i += 2400) { const a = Float32Array.from(arr.slice(i, i + 2400)); this._bb(a); this.cmds.push({ k: K_TRIS, p: a, c: col, cons: !!cons }); } }

  /* ----- world (3-D) versions ----- */
  fill(pts, col) { this.fill2(this.P(pts), col); }
  line(pts, o) { this.line2(this.P(pts), o); }
  fine(pts, o) { this.fine2(this.P(pts), o); }
  outline(pts, o) { this.outline2(this.P(pts), o); }
  poly(pts, col, o) { this.poly2(this.P(pts), col, o); }

  /* ----- marks inside paint (all take a wide-px polygon) ----- */
  _scatter(poly, n, seed, fn) {
    const a = flat(poly); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < a.length; i += 2) { x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]); y0 = Math.min(y0, a[i + 1]); y1 = Math.max(y1, a[i + 1]); }
    const area = Math.abs(polyArea(a));
    const cnt = typeof n === 'function' ? n(area) : n;
    const r = RNG(seed);
    let made = 0, tries = 0;
    while (made < cnt && tries < cnt * 12) {
      tries++;
      const x = x0 + (x1 - x0) * r(), y = y0 + (y1 - y0) * r();
      if (!pointInPoly(x, y, a)) continue;
      fn(x, y, r, a); made++;
    }
  }
  /* pale dry-brush scuffs: short strokes along dir (radians, screen) */
  scuff2(poly, o) {
    o = o || {};
    const dir = o.dir == null ? -0.5 : o.dir, len = o.len || 5, segs = [];
    const dens = o.dens == null ? 1 : o.dens;
    this._scatter(poly, o.n || ((A) => A / 55 * dens), this._seed(), (x, y, r, a) => {
      const l = len * (0.4 + r()), d = dir + (r() - 0.5) * (o.spread == null ? 0.25 : o.spread);
      const ex = x + Math.cos(d) * l, ey = y + Math.sin(d) * l;
      if (!pointInPoly(ex, ey, a)) return;
      segs.push(x, y, ex, ey);
    });
    this.segs2(segs, o.c || C.paveScuff, o.w == null ? 0.55 : o.w);
  }
  /* grass: dark tapered blades in groups of two or three, plus a few lighter ticks */
  grass2(poly, o) {
    o = o || {};
    const dens = o.dens == null ? 1 : o.dens, dark = [], light = [];
    this._scatter(poly, (A) => A / 70 * dens, this._seed(), (x, y, r) => {

/* a rock mass: a convex footprint (world [x, y] points, anticlockwise on screen) whose corners rise to their own heights;

     Jialing on bridges to the map's cut edge (x 196).

     Chaotianmen podium at the tip, where they go into tunnels under the square (the podium's far faces hide them).
   - x = -50 and x = +50 are pedestrian streets (no traffic).
   Every lane has the same loop length SPAN and speed V, so the whole timetable repeats every P seconds; each vehicle

   phases were searched with tools/traffic.js so no two vehicles' boxes ever overlap there. */

    { ax: 'x', c: 148.5, d: 1, a: -142, b: 132, fa: true, fb: false },
    { ax: 'x', c: 141.5, d: -1, a: 132, b: -142, fa: false, fb: true },

/* ---- src/tiles/liziba.js ---- */
/* (100,-100) Liziba: Line 2 runs straight through a residential tower.
   What it is: a 19-storey slab on the Jialing bank (here 17 storeys, 2.8 u each, 32 u long, 14 deep) built together
   with the station: floors 1-5 shops and offices, 6-8 the station, 9 up flats. The two monorail beams run along the
   building's length; trains glide in at the far end, stop at the platform inside (seen through the glazed station
   floors on the river face), and come out of a square opening in the end wall over the viewing plaza, then dive into
   a tunnel under a fig-topped cliff at the plaza's end.
   Levels: the plaza and the slab's foot at z 0 (the street level); behind the plaza the Guihuayuan hill road on a
   terrace at z 19.6, the same height as the station's 8th floor, reached by a long flight of stairs, and a footbridge
   from it into the station (the 8th floor is the "ground floor" of the hill road).
   Who: tourists packed on the viewing plaza with their phones up, a couple pretending to swallow the train, a
   souvenir stall, a bangbang porter climbing the stairs, people waiting on the platform inside, neighbours playing
   mahjong under the fig on the hill road, a man on the footbridge watching.
   Moving: two trains (one per beam) on a timetable phased so a train comes out of the building as the shot opens;
   walkers on the stairs and the plaza.
   Depth: the slab is split along x into a back part (behind both beams), a middle part (the beams' slice, { under })
   and the river face; each train car is two half-car actors so the end wall's opening hides the right parts. */
const LZ = { X0: 22, X1: 36, Y0: -37, Y1: -5, ST: 2.8, N: 17, BA: 29.5, BB: 33, Z: 15.4, TER: 19.6 };
SF.tile('liziba', 100, -100, { rim: 22 }, function (T) {
  const H = 37, L = LZ, ZT = L.N * L.ST, Z = L.Z, SH = SCENE.shots.find((s) => s.name === 'liziba');
  const SLAB = '#E4DCCB', SLABR = '#CFC6B4', TOP = '#D5CEC0';

  T.ground(function (g) {
    K.slab(g, H, { top: '#DAD2C1' });
    // the viewing plaza: big square slabs
    g.fill(K.rect(-4, 3, 21, 36), '#DDD6C7');
    const s = []; for (let x = -4; x <= 21; x += 3) { const a = g.p(x, 3, 0), b = g.p(x, 36, 0); s.push(a[0], a[1], b[0], b[1]); } for (let y = 3; y <= 36; y += 3) { const a = g.p(-4, y, 0), b = g.p(21, y, 0); s.push(a[0], a[1], b[0], b[1]); }
    g.segs2(s, '#C6BEAD', 0.25);
    CQ.paving(g, -36, 3, 21, 36, 0, { dens: 0.3 });
    g.fill(K.rect(22, -4, 36.5, 26), '#D6D0C2');
  }, { rim: true });

  /* ---- the hill road terrace (far-left), its stairs, the houses on it ---- */
  T.obj([-37, -37, -4, 2], (g) => {
    CQ.terrace(g, -37, -37, -4, 2, 0, L.TER, { top: '#DCD6C8' });
    CQ.rail(g, 'R', -4.3, -36, 1.5, L.TER, { h: 1.4 });
    CQ.rail(g, 'L', 1.7, -36, -4.5, L.TER, { h: 1.4 });
    g.fill(K.rect(-34, -34, -10, -26, L.TER), '#C9C3B5');
    // shops built into the foot of the retaining wall, facing the alley under the footbridge
    for (const [y0, y1, sg] of [[-34, -27, ['火锅', CQC.red]], [-24, -17, ['小面', '#E6B84A']], [-13, -6, ['茶馆', '#3F6B4E']]]) {
      g.fill(K.on('R', -3.97, y0, y1, 0, 3.4), '#4A4540'); g.fill(K.on('R', -3.96, y0 + 0.6, y1 - 0.6, 0.2, 2.9), '#E9C98A');
      CQH.sign(g, 'R', -3.9, y0 - 0.2, y1 + 0.2, 3.6, 5.2, sg[1], sg[0]);
    }
  }, { name: 'hill road' });
  // the long flight up the terrace's front wall: climbs towards -x
  T.obj([-34, 2, -5, 6.5], (g) => { CQ.steps(g, -34, 2.2, -5, 6.5, 0, L.TER, 'x', { rise: 0.62 }); CQ.rail(g, 'L', 6.4, -34, -5, 0, { h: 1.2 }); }, { name: 'stairs' });
  for (const [x0, y0, x1, y1, n, sg, col] of [[-36, -36, -27, -29, 2, ['茶馆', '#3F6B4E'], CQC.plaster], [-26, -36, -17, -30, 3, null, '#D9CDB4'], [-36, -26, -29, -16, 2, ['小面', '#D9732F'], '#E3DCCB']]) {
    T.obj([x0, y0, x1, y1], (g) => CQ.oldhouse(g, { x0, y0, x1, y1, z: L.TER, n, sign: sg, col, signFace: x1 - x0 > y1 - y0 ? 'L' : 'R' }), { on: true, name: 'hill house' });
  }

  T.cast([-9, -4], (g) => { CQ.person(g, -8, -4, L.TER, CQ.elder(405, { dir: 0, cage: true, pose: 'hold', bird: '#7FA9C9' })); CQ.person(g, -8.5, -0.5, L.TER, CQ.elder(406, { dir: 0, pose: 'stand' })); }, { on: true });

  /* ---- the footbridge from the hill road into the station's 8th floor ---- */
  T.obj([-4, -24, 22, -18], (g) => {

    const p = g.p(8, -18, z - 1.2), q = g.p(8, -18, 0); g.fill2([[p[0] - 1.1, p[1]], [p[0] + 1.1, p[1]], [q[0] + 1.3, q[1]], [q[0] - 1.3, q[1]]], '#C3BCAD'); g.outline2([[p[0] - 1.1, p[1]], [q[0] - 1.3, q[1]], [q[0] + 1.3, q[1]], [p[0] + 1.1, p[1]]], { w: 0.5, boil: false });

  /* ---- the slab: back part (behind both beams) ---- */
  const winRows = (g, f, p, a0, a1, z0, z1, skipStation) => {
    const W = []; const nw = Math.max(1, Math.round(Math.abs(a1 - a0) / 2.4));

      for (let i = 0; i < nw; i++) { const a = a0 + (a1 - a0) * (i + 0.5) / nw; W.push(K.on(f, p + 0.03, a - 0.55, a + 0.55, zz + (k < 5 ? 0.6 : 0.8), zz + (k < 5 ? 2.2 : 2.0))); } }
    for (const q of W) g.fill(q, '#5E6872');
  };
  T.obj([L.X0, L.Y0, L.BA - 2, L.Y1], (g) => {
    g.boilP = 0.2;
    const x0 = L.X0, x1 = L.BA - 2, y0 = L.Y0, y1 = L.Y1;
    K.box(g, x0, y0, x1, y1, 0, ZT, { t: TOP, l: SLAB, r: SLABR }, { w: 0.9 });
    winRows(g, 'L', y1, x0, x1, 0, ZT, true);
    // the station inside: back wall, platform with its edge line, the floor and ceiling seen through the openings
    g.fill(K.on('R', x1 + 0.02, y0, y1, 3.0, Z + 6.4), '#3E4448'); g.fill(K.on('R', x1 + 0.025, y0, y1, 3.0, Z - 1.6), '#4A5054');

    for (let y = y0 + 2; y < y1; y += 4) CQH.sign(g, 'R', x1 + 0.04, y, y + 1.6, Z + 4.0, Z + 5.0, '#2F5F8F', '李子坝站', { line: false });

    for (const bx of [L.BA, L.BB]) { g.fill([[bx + 0.75, y0, Z - 2], [bx + 0.75, y1, Z - 2], [bx + 0.75, y1, Z], [bx + 0.75, y0, Z]], CQC.concreteD); g.fill(K.rect(bx - 0.75, y0, bx + 0.75, y1, Z), CQC.concrete); g.fill(K.on('L', y1, bx - 0.75, bx + 0.75, Z - 2, Z), CQC.concrete); }
    // people waiting on the platform
    for (let i = 0; i < 6; i++) { const y = y0 + 4 + i * 4.6; K.person(g, x1 + 0.7, y, Z, CQ.who(410 + i, { dir: i % 2 ? 0 : 3, pose: i === 2 ? 'hold' : 'stand', k: 0.95 })); }
  }, { name: 'slab back' });

  /* ---- the slab: the beams' slice (trains inside it are covered: { under }) ---- */
  T.obj([L.BA - 2, L.Y0, 34.7, L.Y1], (g) => {
    g.boilP = 0.2;
    const x0 = L.BA - 2, x1 = 34.7, y1 = L.Y1, zo0 = Z - 2.3, zo1 = Z + 4.8;

    g.line([[x0, y1, zo0], [x1, y1, zo0], [x1, y1, zo1], [x0, y1, zo1], [x0, y1, zo0]], { w: 0.75 });
    g.line([[x0, y1, ZT], [x1, y1, ZT]], { w: 0.8 }); g.line([[x0, L.Y0, ZT], [x1, L.Y0, ZT]], { w: 0.8 });
    winRows(g, 'L', y1, x0 + 0.8, x1 - 0.8, 0, zo0 - 1.4); winRows(g, 'L', y1, x0 + 0.8, x1 - 0.8, zo1 + 1.4, ZT);

  /* ---- the slab: the river face, the station floors glazed (the trains show through) ---- */

    const x0 = 34.7, x1 = L.X1, y0 = L.Y0, y1 = L.Y1, zs0 = 5 * L.ST, zs1 = 8 * L.ST;
    g.fill(K.on('R', x1, y0, y1, 0, zs0), SLABR); g.fill(K.on('R', x1, y0, y1, zs1, ZT), SLABR);
    g.fill(K.on('L', y1, x0, x1, 0, ZT), SLAB); g.fill(K.rect(x0, y0, x1, y1, ZT), TOP);
    // shop floors 1-5: glass at the bottom, offices above
    g.fill(K.on('R', x1 + 0.03, y0 + 1, y1 - 1, 0.3, 3.4), '#4E555B');
    for (let y = y0 + 3; y < y1 - 1; y += 3) g.fine([[x1 + 0.05, y, 0.3], [x1 + 0.05, y, 3.4]], { w: 0.3, c: '#9A958A' });
    winRows(g, 'R', x1, y1, y0, 4.2, zs0); winRows(g, 'R', x1, y1, y0, zs1 + 0.1, ZT);
    // the station band: translucent glazing, mullions, a light orange stripe (the line's colour)
    g.fill(K.on('R', x1, y0, y1, zs0 + 0.6, zs1 - 0.6), 'rgba(196,214,222,0.32)');
    const m = []; for (let y = y0; y <= y1 + 0.01; y += 2.0) { const a = g.p(x1, y, zs0 + 0.6), b = g.p(x1, y, zs1 - 0.6); m.push(a[0], a[1], b[0], b[1]); } g.segs2(m, '#7A858C', 0.35);

    g.line([[x1, y0, 0], [x1, y0, ZT]], { w: 0.9 }); g.line([[x1, y1, 0], [x1, y1, ZT]], { w: 0.8 });
    g.line([[x1, y0, ZT], [x1, y1, ZT], [x0, y1, ZT]], { w: 0.85 }); g.line([[x1, y1, 0], [x1, y0, 0]], { w: 0.85 }); g.line([[x0, y1, 0], [x1, y1, 0]], { w: 0.85 });

  /* ---- the beams in the open, their piers, the tunnel cliff ---- */

  T.obj([31.25, 11], (g) => {

    K.box(g, L.BA - 1.2, 10, L.BB + 1.2, 12, Z - 3.2, Z - 2.0, CQC.concreteD, { w: 0.6 });

  T.obj([21, 30, 37, 37], (g) => {

/* (0,100) Shibati: the Eighteen Steps, the old way down from the upper town to the Yangtze.
   What it is: a stone stairway that drops through the old quarter in short steep flights and landings, with houses
   of plaster and dark timber under grey tile roofs stepping down beside it, each on its own terrace of retaining wall.
   A paifang gate at the top carries the name.
   Levels: five terraces across the tile, z 18, 13.5, 9, 4.5 and 0 (the bottom one meets the Yangtze road); a flight in
   the middle of each terrace's far edge climbs to the one above. The top terrace starts 20 u in from the car street
   behind it (y +50) so its traffic is never hidden; along that street a strip of low shops stands at z 0.
   Who: bangbang porters climbing with loads on their bamboo poles while others come down empty-handed, a noodle stall
   with low stools on a landing, a teahouse with its doors open, a mahjong game on a terrace, an old man with his
   birdcage, washing on poles, a cat on a wall.
   Moving: the porters' climb (one carries a load all the way up, past the noodle stall, the teahouse and the mahjong),
   people going up and down, noodle steam, a game of shuttlecock-kicking (jianzi) on the bottom terrace. */
SF.tile('shibati', 0, 100, { rim: 46 }, function (T) {
  const H = 37, ZS = [18, 13.5, 9, 4.5, 0], YB = [-26, -12, 2, 16, 28, 37], CW = 4;
  const zAt = (y) => {                                           // the stair surface along the corridor
    for (let k = 1; k < 5; k++) { const ya = YB[k]; if (y >= ya && y < ya + 4.5) return ZS[k] + (ZS[k - 1] - ZS[k]) * (1 - (y - ya) / 4.5); }
    for (let k = 0; k < 5; k++) if (y >= YB[k] && y < YB[k + 1]) return ZS[k];
    return y < YB[0] ? 0 : 0;
  };

  T.ground(function (g) {
    K.slab(g, H, { top: '#D6CCB8' });
    g.fill(K.rect(-37, -37, 37, -26, 0), '#DAD3C4'); CQ.paving(g, -37, -37, 37, -26, 0, { dens: 0.4 });
  }, { rim: true });

  /* ---- the terraces with their flights ---- */
  // the four terraces are ONE terrain object, drawn back to front inside it: the walkers on them are then inside its
  // footprint and never make it a sprite (a lower, nearer terrace never truly hides someone on a higher one)
  T.obj([-37, YB[0], 37, YB[4]], (g) => {
    for (let k = 0; k < 4; k++) {
      const y0 = YB[k], y1 = YB[k + 1], z = ZS[k];
      CQ.terrace(g, -37, y0, 37, y1, 0, z, { top: k % 2 ? '#D6CEBD' : '#DCD5C5' });
      g.fill(K.rect(-CW, y0, CW, y1, z), '#CFC6B3');
      const j = []; for (let y = y0 + 1.5; y < y1; y += 1.5) { const a = g.p(-CW, y, z), b = g.p(CW, y, z); j.push(a[0], a[1], b[0], b[1]); } g.segs2(j, '#B3A991', 0.25);
      if (k > 0) { CQ.steps(g, -CW, y0, CW, y0 + 4.5, z, ZS[k - 1], 'y', { rise: 0.5, zb: z }); CQ.rail(g, 'R', CW + 0.2, y0, y0 + 4.5, z, { h: 1.0 }); }
    }
  }, { name: 'terraces' });

  T.obj([-CW, 28, CW, 32.5], (g) => { CQ.steps(g, -CW, 28, CW, 32.5, 0, ZS[3], 'y', { rise: 0.5 }); }, { name: 'flight 4' });
  // the paifang gate over the top of the stairs
  T.obj([-6, -13.5, 6, -11], (g) => {
    const z = ZS[0];
    for (const x of [-5, 5]) K.box(g, x - 0.6, -12.9, x + 0.6, -11.7, z, z + 8, { t: '#B9B09C', l: '#9E9483', r: '#8A8070' }, { w: 0.6 });

/* ---- ../../engine/80_render.js ---- */
/* rendering: paper, per-tile bakes at a zoom, the frame, the build animation.
   A bake is: one base canvas per tile (everything that can never hide an actor), one small canvas per
   "sprite" object (things an actor can pass behind), and vector paths for the six boil drawings.
   Bakes are deterministic functions of (tile, zoom, region), so they are only a cache. */

const R = SF.R = { tex: null, jobs: [], pixels: 0, budget: 64e6, stamp: 0, drawStamp: 0, stats: { bakeMs: 0 }, dead: [], deadPx: 0, bmpUntil: 0, bmpPending: false, warmPx: 0 };
/* make the GPU finish a freshly drawn canvas now, not on the frame of the cut */
function warm(cv) { if (!R.warmCtx) R.warmCtx = mkCanvas(2, 2).getContext('2d'); R.warmCtx.drawImage(cv, 0, 0, 1, 1); }
/* replay a display list in slices of roughly equal work: points, plus the device pixels a fill covers (at x9 one big
   fill costs more than thousands of points) */
const fillArea = (d) => { if (d.ab == null) { const p = d.p; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (let i = 0; i < p.length; i += 2) { if (p[i] < x0) x0 = p[i]; if (p[i] > x1) x1 = p[i]; if (p[i + 1] < y0) y0 = p[i + 1]; if (p[i + 1] > y1) y1 = p[i + 1]; } d.ab = (x1 - x0) * (y1 - y0); } return d.ab; };
const cmdWork = (d, pz2) => (d.p ? d.p.length : d.c ? d.c.length * 2 : 8) + (d.k === K_FILL && pz2 ? fillArea(d) * pz2 / 400 : 0);
function* replaySliced(ctx, list, hw, opt, pz) {
  let i0 = 0, w = 0; const pz2 = pz ? pz * pz : 0;
  for (let i = 0; i < list.length; i++) { w += cmdWork(list[i], pz2); if (w > 5000) { replay(ctx, list.slice(i0, i + 1), hw, opt); i0 = i + 1; w = 0; yield 'slice'; } }
  if (i0 < list.length) replay(ctx, list.slice(i0), hw, opt);
}

/* every cache canvas reports a GPU reset (R.lost): Chrome wipes them all and the caches must be rebuilt (gpuReset) */
const onLost = () => { R.lost = true; };
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); c.addEventListener('contextlost', onLost); return c; }
/* forget everything drawn on the GPU: paper and grain, bakes, construction canvases, actor bitmaps, pose atlases */
function gpuReset() {
  R.lost = false; R.jobs.length = 0; R.dead.length = 0; R.deadPx = 0; R.pixels = 0;
  mkTextures(); R.paperPat = null; R.grainPat = null; R.warmCtx = null;
  for (const c of ABMP.list) c.dl.bmp.delete(c.key);
  ABMP.list.length = 0; ABMP.px = 0;
  for (const a of SF.actors) a.lastB = null;
  for (const A of ATLS) { A.pages.length = 0; atlasReset(A); }
  for (const t of SF.live) { t.bakes = []; t.wide = null; t.cons = null; t.doneAt = null; }
}

/* ---------- paper and paint grain (seamless 512 px tiles) ---------- */
function mkTextures() {
  const N = 512;
  const pn = (x, y, per, seed) => {              // periodic value noise, [0,1]
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const k = (a, b) => h2(((a % per) + per) % per * 9173 + ((b % per) + per) % per * 31, seed);
    const a = k(ix, iy), b = k(ix + 1, iy), c = k(ix, iy + 1), d = k(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  };
  const paper = mkCanvas(N, N), grain = mkCanvas(N, N);
  const pc = paper.getContext('2d'), gc = grain.getContext('2d');
  const pd = pc.createImageData(N, N), gd = gc.createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4;
    const fine = pn(x / 2.2, y / 2.2, Math.round(N / 2.2), 5) - 0.5, mid = pn(x / 8, y / 8, N / 8, 6) - 0.5, big = pn(x / 64, y / 64, N / 64, 7) - 0.5;
    const speck = h2(x * 7919 + y, 8);
    let v = fine * 3.4 + mid * 3.0 + big * 2.2;
    if (speck > 0.9965) v -= 5 + 6 * h2(x, y); else if (speck < 0.002) v += 3;
    pd.data[i] = clamp(240.5 + v, 0, 255); pd.data[i + 1] = clamp(238 + v * 0.95, 0, 255); pd.data[i + 2] = clamp(228 + v * 1.05, 0, 255); pd.data[i + 3] = 255;
    const g = fine * 1.5 + mid * 1.1 + (pn(x / 3.3, y / 1.4, Math.round(N / 3.3), 9) - 0.5) * 0.9;     // paint grain, signed
    if (g > 0) { gd.data[i] = 255; gd.data[i + 1] = 252; gd.data[i + 2] = 244; gd.data[i + 3] = clamp(g * 15, 0, 255); }
    else { gd.data[i] = 70; gd.data[i + 1] = 58; gd.data[i + 2] = 44; gd.data[i + 3] = clamp(-g * 15, 0, 255); }
  }
  pc.putImageData(pd, 0, 0); gc.putImageData(gd, 0, 0);
  R.tex = { paper, grain, N };
}

/* ---------- views ---------- */
/* cam = {z, cx, cy}: zoom relative to the wide view and centre in wide px.
   The picture is composed for 1920x1080 and fitted to the canvas. */
function mkView(cam, cw, ch, fit) {
  const s = Math.min(cw / 1920, ch / 1080), pz = cam.z * s;
  const v = { cam, cw, ch, s, z: cam.z, pz, tx: Math.round(cw / 2 - cam.cx * pz), ty: Math.round(ch / 2 - cam.cy * pz) };
  v.hw = lineW(cam.z) / (2 * cam.z);                         // main contour half-width, wide px
  v.amp = 0.9 / cam.z;                                       // boil amplitude, wide px
  if (fit) { const w = Math.round(1920 * s), h = Math.round(1080 * s); v.clip = [Math.round((cw - w) / 2), Math.round((ch - h) / 2), w, h]; }
  const c = v.clip || [0, 0, cw, ch];
  v.rect = [(c[0] - v.tx) / pz, (c[1] - v.ty) / pz, (c[0] + c[2] - v.tx) / pz, (c[1] + c[3] - v.ty) / pz];   // visible wide-px rect
  return v;
}
function isect(a, b) { return [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])]; }
function devRect(r, pz) { const x0 = Math.floor(r[0] * pz), y0 = Math.floor(r[1] * pz); return [x0, y0, Math.ceil(r[2] * pz) - x0, Math.ceil(r[3] * pz) - y0]; }

function grainOver(ctx, x0, y0, w, h) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-atop';
  if (!R.grainPat) R.grainPat = ctx.createPattern(R.tex.grain, 'repeat');
  const ox = ((-x0 % 512) + 512) % 512, oy = ((-y0 % 512) + 512) % 512;
  ctx.translate(ox - 512, oy - 512); ctx.fillStyle = ctx.createPattern(R.tex.grain, 'repeat'); ctx.fillRect(0, 0, w + 1024, h + 1024);
  ctx.restore();
}
/* the six boil drawings of a set of objects as one Path2D per colour per drawing; a generator so it can be sliced */
function* compileBoilGen(objs, hw, amp, region) {
  const out = []; let any = false, n = 0;
  for (let k = 0; k < BOIL_N; k++) {
    const by = new Map();
    for (const ob of objs) {
      if (region && !bbHit(ob.bb, region)) continue;
      for (const d of ob.list) {
        if (d.k !== K_RIB || !d.bo || !d.live) continue;
        if (region) {                                        // cull per stroke, not per object: big objects have many off-view lines
          if (!d.rb) { const c = d.c; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (let i = 0; i < c.length; i += 2) { if (c[i] < x0) x0 = c[i]; if (c[i] > x1) x1 = c[i]; if (c[i + 1] < y0) y0 = c[i + 1]; if (c[i + 1] > y1) y1 = c[i + 1]; } d.rb = [x0 - 4, y0 - 4, x1 + 4, y1 + 4]; }
          if (!bbHit(d.rb, region)) continue;
        }
        let p = by.get(d.col); if (!p) { p = new Path2D(); by.set(d.col, p); }
        ribPath(p, d, hw, null, k * d.w.length, amp); any = true;
        if ((++n % 150) === 0) yield 'boil';
      }
    }
    out.push(Array.from(by, ([col, path]) => ({ col, path })));
  }
  return any ? out : null;
}
function compileBoil(objs, hw, amp, region) { const g = compileBoilGen(objs, hw, amp, region); let r; do { r = g.next(); } while (!r.done); return r.value; }

/* ---------- bakes ---------- */
function* bakeGen(t, v, region, o) {
  o = o || {};
  const pz = v.pz, hw = v.hw, t0 = performance.now();
  const reg = isect(region, o.noCast ? t.bbNoCast : t.bb);
  const b = { tile: t, pz, z: v.z, region: reg, base: null, sprites: [], boil: null, pixels: 0, ready: false, stamp: ++R.stamp, noCast: !!o.noCast };
  if (reg[0] >= reg[2] || reg[1] >= reg[3]) { b.ready = true; return b; }
  // the canvas covers only what is drawn inside the region (a ring or a shared sea is mostly empty inside its box);
  // b.region stays the full region, so the bake still counts as covering the view
  let tight = [1e9, 1e9, -1e9, -1e9];
  for (const ob of t.statics) { if (o.noCast && ob.cast) continue; if (!bbHit(ob.bb, reg)) continue; tight = [Math.min(tight[0], ob.bb[0]), Math.min(tight[1], ob.bb[1]), Math.max(tight[2], ob.bb[2]), Math.max(tight[3], ob.bb[3])]; }
  tight = isect(reg, tight);
  if (tight[0] >= tight[2] || tight[1] >= tight[3]) { b.ready = true; return b; }
  const dr = devRect(tight, pz);
  const cv = mkCanvas(dr[2], dr[3]), ctx = cv.getContext('2d');
  ctx.setTransform(pz, 0, 0, pz, -dr[0], -dr[1]); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  b.base = { cv, x: dr[0], y: dr[1], w: dr[2], h: dr[3] }; b.pixels += dr[2] * dr[3];
  const baseObjs = [];
  let n = 0;
  for (const ob of t.statics) {
    if (o.noCast && ob.cast) continue;
    if (!bbHit(ob.bb, reg)) continue;
    if (ob.promoted && !o.noCast) continue;
    yield* replaySliced(ctx, ob.list, hw, { skipBoil: !o.noCast }, pz);
    baseObjs.push(ob);
    yield 'obj';
  }
  grainOver(ctx, dr[0], dr[1], dr[2], dr[3]); warm(cv); R.warmPx += dr[2] * dr[3]; yield 'grain+warm';
  if (!o.noCast) {
    b.boil = yield* compileBoilGen(baseObjs, hw, v.amp, reg); yield 'boil-done';
    for (const ob of t.statics) {
      if (!ob.promoted || !bbHit(ob.bb, reg)) continue;
      const r = devRect(isect(ob.bb, reg), pz);
      if (r[2] <= 0 || r[3] <= 0) continue;

      yield* replaySliced(sx, ob.list, hw, { skipBoil: true }, pz);
      grainOver(sx, r[0], r[1], r[2], r[3]); warm(sc); R.warmPx += r[2] * r[3];
      b.sprites.push({ ob, cv: sc, x: r[0], y: r[1], w: r[2], h: r[3], boil: yield* compileBoilGen([ob], hw, v.amp, reg) });
      b.pixels += r[2] * r[3];
      yield 'sprite';
    }
  }
  b.ready = true; R.stats.bakeMs += performance.now() - t0;

  let best = null, bd = 1e9;
  for (const t of SF.live) {
    if (t.name === 'streets' || t.o.shared) continue;                // shared ground (a sea, a canal) is not a place to visit
    const inside = Math.abs(g[0] - t.cx) <= t.half + 4 && Math.abs(g[1] - t.cy) <= t.half + 4;
    const d = Math.hypot(wx - (t.bb[0] + t.bb[2]) / 2, wy - (t.bb[1] + t.bb[3]) / 2);

  }
  if (!best) return;
  const s = shotByName(best.name);
  const dive = SCENE.dive && SCENE.dive[best.name];
  if (s && dive) { const at = Math.abs(APP.cam.z - s.z) < 0.01 && Math.abs(APP.cam.cx - s.cx) < 2; cutTo(at ? shotByName(dive) : s); return; }
  if (s) cutTo(s); else cutTo({ z: 4, cx: (best.bb[0] + best.bb[2]) / 2, cy: (best.bb[1] + best.bb[3]) / 2 });
}
function bindInput() {
  const cv = APP.cv;
  const ptrs = new Map(); let drag = null, pinch = null;
  const scale = () => { const s = Math.min(cv.width / 1920, cv.height / 1080); return { s, k: cv.width / cv.clientWidth }; };
  const toWide = (ex, ey) => { const { s, k } = scale(), pz = APP.cam.z * s; return [(ex * k - cv.width / 2) / pz + APP.cam.cx, (ey * k - cv.height / 2) / pz + APP.cam.cy]; };
  const touch = () => { APP.lastInput = performance.now(); APP.glide = null; if (APP.mode === 'film') toExplore(false); };
  const zoomAt = (ex, ey, f) => {
    const a = toWide(ex, ey); APP.cam.z = clamp(APP.cam.z * f, BOUNDS.z[0], BOUNDS.z[1]); const b = toWide(ex, ey);
    APP.cam.cx += a[0] - b[0]; APP.cam.cy += a[1] - b[1]; clampCam(APP.cam); APP.dirtyZoom = performance.now();
  };
  cv.addEventListener('pointerdown', (e) => {
    const wasFilm = APP.mode === 'film'; touch(); cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, cx: APP.cam.cx, cy: APP.cam.cy, moved: wasFilm ? 99 : 0 }; cv.style.cursor = 'grabbing'; }
    if (ptrs.size === 2) { const p = Array.from(ptrs.values()); pinch = { d: Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) }; drag = null; }
  });
  cv.addEventListener('pointermove', (e) => {
    if (APP.mode !== 'explore') return;                     // moving the mouse alone does not interrupt the film
    APP.lastInput = performance.now();
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && ptrs.size === 2) {
      const p = Array.from(ptrs.values()), d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
      zoomAt((p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2, d / pinch.d); pinch.d = d; return;
    }

      const { s, k } = scale(), pz = APP.cam.z * s;
      drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
      if (drag.moved > 4) { APP.cam.cx = drag.cx - (e.clientX - drag.x) * k / pz; APP.cam.cy = drag.cy - (e.clientY - drag.y) * k / pz; clampCam(APP.cam); }
    }
  });
  const up = (e) => {
    if (drag && drag.moved <= 4 && ptrs.size === 1 && APP.mode === 'explore') {
      if (!uiHit(e.clientX, e.clientY)) { const w = toWide(e.clientX, e.clientY); visitWorld(w[0], w[1]); }
    }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) { drag = null; cv.style.cursor = APP.mode === 'explore' ? 'grab' : 'none'; }

  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'r' || k === 'R') { replay_(); return; }
    touch();
    if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === '0' || k === 'Escape') { if (SF.home) SF.glideTo(SF.home()); else cutTo(WIDE); }   // the page's guide may frame the city beside its panel
    else if (k >= '1' && k <= '9' && VISIT[+k - 1]) cutTo(shotByName(VISIT[+k - 1]));
  });
}
function togglePause() {
  if (APP.paused) { APP.t0 = performance.now() - APP.pauseAt * 1000; APP.paused = false; }
  else { APP.pauseAt = now(); APP.paused = true; }
}
function replay_() { ACT_DL.size; startFilm(); }

/* ---------- the two pen-drawn icons ---------- */
const UI = { dl: null, r: 26 };
function uiIcons() {
  if (UI.dl) return UI.dl;
  const mk = (fn) => { const g = new G('ui' + fn.name); g.boilP = 0; fn(g); return { cmds: g.cmds, comp: new Map() }; };
  const arc = (r, a0, a1, n) => { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([Math.cos(a) * r, Math.sin(a) * r]); } return p; };
  UI.dl = {
    replay: mk(function replay(g) { g.line2(arc(8, 0.75, 5.5, 24), { w: 1, taper: 0.3, ext: 0 }); const a = 5.5, e = [8 * Math.cos(a), 8 * Math.sin(a)], t = [-Math.sin(a), Math.cos(a)], n = [Math.cos(a), Math.sin(a)]; g.line2([[e[0] - t[0] * 3.4 + n[0] * 3.2, e[1] - t[1] * 3.4 + n[1] * 3.2], [e[0] + t[0] * 1.6, e[1] + t[1] * 1.6], [e[0] - t[0] * 3.4 - n[0] * 3.2, e[1] - t[1] * 3.4 - n[1] * 3.2]], { w: 1, ext: 0 }); }),
    pause: mk(function pause(g) { g.line2([[-3.4, -7], [-3.6, 7]], { w: 1.25 }); g.line2([[3.6, -7], [3.4, 7]], { w: 1.25 }); }),
    play: mk(function play(g) { g.outline2([[-4, -7.5], [7, 0], [-4, 7.5]], { w: 1 }); }),
  };
  return UI.dl;
}
function uiPos() { const cv = APP.cv, k = cv.width / cv.clientWidth; return { k, a: [34 * k, cv.height - 34 * k], b: [78 * k, cv.height - 34 * k] }; }
function uiHit(ex, ey) {
  if (SF.ui === false) return false;
  const p = uiPos(), x = ex * p.k, y = ey * p.k, r = 20 * p.k;
  if (Math.hypot(x - p.a[0], y - p.a[1]) < r) { replay_(); return true; }
  if (Math.hypot(x - p.b[0], y - p.b[1]) < r) { togglePause(); return true; }
  return false;
}
function drawUI(ctx, cv) {
  if (SF.ui === false) return;                               // the page's guide draws its own controls
  const idle = (performance.now() - APP.lastInput) / 1000, a = APP.paused ? 1 : clamp(1.6 - (idle - 2.5) / 0.8, 0, 1);
  if (a <= 0) return;
  const ic = uiIcons(), p = uiPos(), s = 1.7 * p.k;
  ctx.globalAlpha = 0.8 * a;
  for (const [dl, pos] of [[ic.replay, p.a], [APP.paused ? ic.play : ic.pause, p.b]]) {
    ctx.setTransform(s, 0, 0, s, pos[0], pos[1]);
    for (const g of compiled(dl, 0.75)) { if (g.m === 0) { ctx.fillStyle = g.col; ctx.fill(g.p); } else { ctx.strokeStyle = g.col; ctx.lineWidth = g.lw; ctx.stroke(g.p); } }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
}

/* ---------- for the page's guide (a DOM overlay): read the view, move the camera, hear the mode change ----------
   Cameras are in wide px (the 1920 x 1080 frame at zoom 1); SF.prj turns a world point into wide px. */
window.SF = SF;                                              // a top-level const is not a window property
const EV = {};
function emit(k, a) { for (const f of EV[k] || []) { try { f(a); } catch (e) { console.error(e); } } }
SF.on = (k, f) => { (EV[k] = EV[k] || []).push(f); };
SF.prj = (x, y, z) => prj(x, y, z || 0);
SF.wide = WIDE; SF.shots = SHOTS; SF.visit = VISIT; SF.bounds = BOUNDS;
SF.shot = (name) => shotByName(name);
SF.zMin = () => BOUNDS.z[0];
/* the camera on screen now, and how wide px map to CSS px */
SF.view = function () {
  const cv = APP.cv, cam = APP.mode === 'explore' ? APP.cam : (APP.filmCam || WIDE);
  const k = cv.width / cv.clientWidth, pz = cam.z * Math.min(cv.width / 1920, cv.height / 1080) / k;
  return { mode: APP.mode, z: cam.z, cx: cam.cx, cy: cam.cy, pz, w: cv.clientWidth, h: cv.clientHeight, paused: !!APP.paused, gliding: !!APP.glide };
};
SF.toScreen = function (wx, wy, v) { v = v || SF.view(); return [(wx - v.cx) * v.pz + v.w / 2, (wy - v.cy) * v.pz + v.h / 2]; };
/* the map's extent in wide px (every tile, satellites included) */
SF.boxes = () => SF.live.map((t) => t.bb.slice());              // every tile's and satellite's wide-px box
SF.extent = function () { let a = [1e9, 1e9, -1e9, -1e9]; for (const t of SF.live) { a[0] = Math.min(a[0], t.bb[0]); a[1] = Math.min(a[1], t.bb[1]); a[2] = Math.max(a[2], t.bb[2]); a[3] = Math.max(a[3], t.bb[3]); } return a; };
/* glide the explore camera to a camera {z, cx, cy}, a shot's name, or WIDE; it pulls back on long trips */
SF.glideTo = function (to, ms) {
  if (typeof to === 'string') to = shotByName(to) || WIDE;
  if (APP.mode !== 'explore') toExplore(false);
  const b = { z: to.z, cx: to.cx, cy: to.cy }; clampCam(b);
  const a = { z: APP.cam.z, cx: APP.cam.cx, cy: APP.cam.cy }, d = Math.hypot(b.cx - a.cx, b.cy - a.cy);
  const fit = 1920 * 0.7 / Math.max(1, d), lo = Math.min(a.z, b.z), dip = Math.max(0, Math.log(lo / Math.max(fit, WIDE.z)));
  APP.glide = { a, b, dip, t0: performance.now(), ms: ms || clamp(700 + d * 0.5 + dip * 260, 700, 1600) };

};
function stepGlide() {
  const g = APP.glide, t = clamp((performance.now() - g.t0) / g.ms, 0, 1), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lz = Math.log(g.a.z) + (Math.log(g.b.z) - Math.log(g.a.z)) * e - g.dip * Math.sin(Math.PI * e);
  APP.cam = { z: Math.exp(lz), cx: g.a.cx + (g.b.cx - g.a.cx) * e, cy: g.a.cy + (g.b.cy - g.a.cy) * e };
  APP.dirtyZoom = performance.now(); APP.lastInput = performance.now();
  if (t >= 1) { APP.cam = Object.assign({}, g.b); APP.glide = null; APP.phase = (APP.phase + 1) % 6; emit('arrive', Object.assign({}, g.b)); }
}
SF.pause = () => { if (!APP.paused) togglePause(); };
SF.resume = () => { if (APP.paused) togglePause(); };
SF.togglePause = () => togglePause();
SF.replay = () => replay_();

</script>
