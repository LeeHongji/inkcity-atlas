/* New York's own kit (NK): lettering in a small stroke font, Manhattan buildings (brick walk-ups with zig-zag fire
   escapes and cornices, brownstones with high stoops, cast-iron fronts, wooden water tanks on steel legs, setback
   towers), street furniture (cobra-head lamps, hydrants, subway entrances with green globes, hot-dog carts, litter
   baskets, mailboxes, Citi Bike docks, the orange-and-white Con Ed steam stack and its steam), the people of New York
   (every skin and style, tourists in I-heart-NY tees, suits, NYPD, delivery riders with their insulated boxes) and
   its vehicles (yellow cabs, black cars, MTA buses, box trucks, a fire engine, delivery bikes, horse carriages).
   Everything in tile-local u unless the name ends in 2 (wide px). */
const NK = {};

/* ---------------- palette ---------------- */
const NYC = {
  cab: '#F2C12E', cabD: '#D9A41F', brick: '#B9654C', brickD: '#9A4F3B', brick2: '#C47A5A', brick3: '#A85A48',
  brown: '#8E5F48', brownD: '#6F4635', lime: '#E7DFCA', limeD: '#CFC5AC', iron: '#2F2C2A', ironL: '#5A554F',
  asph: '#D3CFC6', asphD: '#C4BFB4', walk: '#E9E5DC', walkD: '#D8D3C7', kerb: '#BDB7AA',
  bus: '#D58E78', bike: '#A9CC93', subway: '#3E8E5A', mta: '#2F6DB5', glass: '#C3D7E3', glassD: '#93AFC2',
  tank: '#9C7A55', tankD: '#7A5C3E', con1: '#E8742C', con2: '#F6F2E8', steam: '#F7F5EF',
};

/* ---------------- night: what lights up (none of this draws anything by day) ---------------- */
NK.LIT = '#FFE3A6';                     // a lit pane: bus, ferry and cabin windows
/* set o on one drawing command, as g.mark does (nc: a colour, true = its own colour, or a function of it) */
NK.nset = function (d, o) { for (const key in o) { const v = o[key]; if (key !== 'nc') { d[key] = v; continue; } const c = v === true ? (d.c || d.col) : typeof v === 'function' ? v(d.c || d.col) : v; if (c) d.nc = c; } };
/* the commands drawn since i0 take o: the fills (strokes: true: the pen lines, lettering and marks instead); day: only
   those of this day colour */
NK.nmark = function (g, i0, o, strokes, day) {
  const key = day && day.toLowerCase();
  for (let k = i0; k < g.cmds.length; k++) {
    const d = g.cmds[k], fill = d.k === K_FILL || d.k === K_DISC || d.k === K_TRIS;
    if (fill === !strokes && (!key || String(d.c || d.col).toLowerCase() === key)) NK.nset(d, o);
  }
};
/* a colour under a floodlight: its night colour pulled back towards its day colour warmed by the light (t: how much) */
NK.flood = (t, tint) => (c) => { if (typeof c !== 'string' || c[0] !== '#') return undefined; const n = nightColour(c); return n[0] === '#' ? mix(n, tint ? mix(c, tint, 0.3) : c, t) : undefined; };
/* floodlight the fills drawn since i0 (up to i1; those not already lit or windows): NK.flood(t, tint) on each */
NK.floodMark = function (g, i0, t, tint, i1) { const f = NK.flood(t, tint); for (let k = i0; k < (i1 == null ? g.cmds.length : i1); k++) { const d = g.cmds[k]; if ((d.k === K_FILL || d.k === K_DISC || d.k === K_TRIS) && d.nc == null && d.win == null) { const c = f(d.c); if (c) d.nc = c; } } };
/* lit windows in hashed rows or strips (a share of them lit, warm, a few dim): the colour for strip number i */
NK.WARM = ['#F0CF8A', '#E6BC72', '#F6DA9C', '#DDAE66'];
NK.stripLit = (i, share, seed) => { const h = h2(i * 7 + 3, (seed || 0) + 917); return h < share ? NK.WARM[Math.floor(h2(i, (seed || 0) + 31) * NK.WARM.length)] : h < share + 0.1 ? '#A8835A' : undefined; };

    C: [[4, 5.2, 3, 6, 1, 6, 0, 5, 0, 1, 1, 0, 3, 0, 4, 0.8]], D: [[0, 0, 0, 6, 2.5, 6, 4, 4.5, 4, 1.5, 2.5, 0, 0, 0]],
    E: [[4, 6, 0, 6, 0, 0, 4, 0], [0, 3.1, 3, 3.1]], F: [[4, 6, 0, 6, 0, 0], [0, 3.1, 3, 3.1]],
    G: [[4, 5.2, 3, 6, 1, 6, 0, 5, 0, 1, 1, 0, 3, 0, 4, 1, 4, 2.8, 2.4, 2.8]], H: [[0, 0, 0, 6], [4, 0, 4, 6], [0, 3.1, 4, 3.1]],
    I: [[2, 0, 2, 6], [1, 6, 3, 6], [1, 0, 3, 0]], J: [[4, 6, 4, 1, 3, 0, 1, 0, 0, 1]], K: [[0, 0, 0, 6], [4, 6, 0, 2.4], [1.4, 3.6, 4, 0]],
    L: [[0, 6, 0, 0, 4, 0]], M: [[0, 0, 0, 6, 2, 3, 4, 6, 4, 0]], N: [[0, 0, 0, 6, 4, 0, 4, 6]], O: [O], P: [P],
    Q: [O, [2.6, 1.4, 4.2, -0.4]], R: [P, [2, 3, 4, 0]], S: [[4, 5.2, 3, 6, 1, 6, 0, 5, 0, 4, 1, 3.1, 3, 3, 4, 2, 4, 1, 3, 0, 1, 0, 0, 0.8]],
    T: [[0, 6, 4, 6], [2, 6, 2, 0]], U: [[0, 6, 0, 1, 1, 0, 3, 0, 4, 1, 4, 6]], V: [[0, 6, 2, 0, 4, 6]], W: [[0, 6, 1, 0, 2, 4, 3, 0, 4, 6]],

    5: [[4, 6, 0.4, 6, 0, 3.4, 3, 3.6, 4, 2.5, 4, 1, 3, 0, 0.5, 0, 0, 0.6]], 6: [[3.6, 6, 1.6, 6, 0, 4, 0, 1, 1, 0, 3, 0, 4, 1, 4, 2.4, 3, 3.4, 1, 3.4, 0, 2.4]],
    7: [[0, 6, 4, 6, 1.5, 0]], 8: [[1, 3.2, 0, 4.2, 0, 5, 1, 6, 3, 6, 4, 5, 4, 4.2, 3, 3.2, 1, 3.2, 0, 2.2, 0, 1, 1, 0, 3, 0, 4, 1, 4, 2.2, 3, 3.2]],
    9: [[4, 3.6, 3, 2.6, 1, 2.6, 0, 3.6, 0, 5, 1, 6, 3, 6, 4, 5, 4, 1, 3, 0, 1, 0]],
    '-': [[0.6, 3, 3.4, 3]], '.': [[1.8, 0, 2.2, 0, 2.2, 0.4, 1.8, 0.4, 1.8, 0]], "'": [[2, 6, 2, 4.6]], '&': [[4, 0, 0.6, 4.2, 0.6, 5.2, 1.4, 6, 2.4, 5.2, 2.4, 4.4, 0, 2, 0, 0.8, 1, 0, 2.4, 0, 4, 2]],
    '/': [[0, 0, 4, 6]], '!': [[2, 6, 2, 1.6], [2, 0.4, 2, 0]],

/* text along any plane: P(a, z) -> world point; the string starts at a0 (or is centred on it with o.center) and runs to
   increasing a; h = cap height in u. Strokes are batched (cheap) in wide px. */
NK.textP = function (g, P, a0, z0, h, str, col, o) {
  o = o || {}; const u = h / 6, adv = (o.track || 5.5) * u, s = String(str).toUpperCase(), segs = [];
  let a = o.center ? a0 - (s.length * adv - 1.5 * u) / 2 : a0;
  const it = o.italic || 0;
  for (const ch of s) {
    const gl = NK_FONT[ch];
    if (gl) for (const pl of gl) for (let i = 0; i + 3 < pl.length; i += 2) {
      const p0 = g.p.apply(g, P(a + (pl[i] + pl[i + 1] * it) * u, z0 + pl[i + 1] * u)), p1 = g.p.apply(g, P(a + (pl[i + 2] + pl[i + 3] * it) * u, z0 + pl[i + 3] * u));
      segs.push(p0[0], p0[1], p1[0], p1[1]);
    }
    a += adv;
  }
  const i0 = g.cmds.length;
  g.segs2(segs, col, o.w || clamp(h * 0.5, 0.22, 1.6));
  if (o.nc) NK.nmark(g, i0, { nc: o.nc }, true);                                 // lit letters at night
};
/* text on a building face: face 'L' (plane y = p, reads along +x) or 'R' (plane x = p, reads along -y) */
NK.text = function (g, face, p, a, z0, h, str, col, o) {
  const P = face === 'L' ? (s, z) => [s, p + 0.06, z] : (s, z) => [p + 0.06, -s, z];
  NK.textP(g, P, face === 'L' ? a : -a, z0, h, str, col, o);
};
/* a sign board on a face with a word on it */
NK.sign = function (g, face, p, a0, a1, z0, z1, col, word, o) {
  o = o || {}; const q = K.on(face, p + 0.05, a0, a1, z0, z1);
  g.fill(q, col); if (o.lit) g.mark({ nc: o.lit });                              // o.lit: a lit sign at night (true: its own colour)
  g.outline(q, { w: o.w || 0.45, c: o.c || shade(col, 0.5), boil: false });
  const ink = o.ink || (hex2rgb(col).reduce((x, y) => x + y) > 430 ? '#2C271C' : '#FBF8EE');
  if (word) {
    const h = Math.min((z1 - z0) * 0.6, Math.abs(a1 - a0) / (word.length * 5.5 / 6 + 0.3));
    NK.text(g, face, p + 0.02, (a0 + a1) / 2, (z0 + z1) / 2 - h / 2, h, word, ink, { center: true, nc: o.lit ? true : undefined });
  }
  if (o.lit && o.halo !== 0) {                                                    // its glow, in the board's colour (a dark board: its letters')
    const c = g.p.apply(g, K.pt(face, p + 0.1, (a0 + a1) / 2, (z0 + z1) / 2)), dark = hex2rgb(col).reduce((x, y) => x + y) < 260;
    g.glow2('neon', c, c, { r: (o.halo || 0.22) * Math.max(Math.abs(a1 - a0) * 2.92, (z1 - z0) * 3.46), col: o.glowCol || (dark ? ink : col) });
  }
};

/* ---------------- building parts ---------------- */
/* windows in a grid on a face: n per floor across [a0,a1], floors from z0 every fh, nf floors */
NK.windows = function (g, face, p, a0, a1, z0, fh, nf, n, o) {
  o = o || {}; const cw = (a1 - a0) / n, ww = cw * (o.fill || 0.52), wh = fh * (o.hfill || 0.56);
  for (let f = 0; f < nf; f++) for (let i = 0; i < n; i++) {
    if (o.skip && o.skip(f, i)) continue;
    const m = a0 + cw * (i + 0.5), zb = z0 + f * fh + fh * (o.sill || 0.2);
    K.win(g, face, p + 0.02, m - ww / 2, m + ww / 2, zb, zb + wh, { style: o.style || 'glass', w: 0.4, arch: o.arch });
    if (o.lintel) g.fill(K.on(face, p + 0.04, m - ww / 2 - 0.25, m + ww / 2 + 0.25, zb + wh, zb + wh + 0.35), o.lintel);
    if (o.sillCol) g.fill(K.on(face, p + 0.04, m - ww / 2 - 0.15, m + ww / 2 + 0.15, zb - 0.22, zb), o.sillCol);
  }
};
/* a projecting cornice band round the top of a box (the visible faces), with brackets */
NK.cornice = function (g, x0, y0, x1, y1, z, col, o) {
  o = o || {}; const d = o.d == null ? 0.7 : o.d, h = o.h || 1.1;
  K.box(g, x0 - d, y0 - d, x1 + d, y1 + d, z, z + h, col, { w: 0.6, boil: false });
  const br = [];
  for (const [f, pl, A0, A1] of [['L', y1 + d, x0, x1], ['R', x1 + d, y0, y1]]) for (let a = A0 + 0.8; a < A1 - 0.4; a += 1.6) {
    const p0 = g.p.apply(g, K.pt(f, pl + 0.02, a, z + 0.1)), p1 = g.p.apply(g, K.pt(f, pl + 0.02, a, z + h * 0.7)); br.push(p0[0], p0[1], p1[0], p1[1]);
  }
  g.segs2(br, shade(typeof col === 'object' ? col.l : col, 0.35), 0.4);
};
/* a zig-zag fire escape on a face: a balcony at each floor, a stair between them, a drop ladder at the bottom */
NK.fireEscape = function (g, face, p, a0, a1, z0, fh, nf, o) {
  o = o || {}; const d = o.d || 1.5, col = o.col || NYC.iron, P = (a, w, z) => face === 'L' ? [a, p + w, z] : [p + w, a, z];
  const segs = [], S = (A, B) => { const q0 = g.p.apply(g, A), q1 = g.p.apply(g, B); segs.push(q0[0], q0[1], q1[0], q1[1]); };
  for (let f = 0; f < nf; f++) {
    const z = z0 + f * fh;
    // the slatted platform and its railing
    g.fill([P(a0, 0, z), P(a1, 0, z), P(a1, d, z), P(a0, d, z)], 'rgba(47,44,42,0.55)');
    S(P(a0, d, z), P(a1, d, z)); S(P(a0, d, z + 1.2), P(a1, d, z + 1.2)); S(P(a1, 0, z + 1.2), P(a1, d, z + 1.2)); S(P(a0, 0, z + 1.2), P(a0, d, z + 1.2));
    for (let a = a0; a <= a1 + 0.01; a += (a1 - a0) / 5) S(P(a, d, z), P(a, d, z + 1.2));
    // the stair down to the platform below, alternating direction
    if (f > 0) { const s0 = f % 2 ? a0 + 0.4 : a1 - 0.4, s1 = f % 2 ? a1 - 1.6 : a0 + 1.6; S(P(s0, d * 0.5, z), P(s1, d * 0.5, z - fh)); S(P(s0, d * 0.95, z), P(s1, d * 0.95, z - fh)); }
  }
  // the drop ladder hanging under the lowest platform
  const la = o.ladder == null ? a1 - 1 : o.ladder; S(P(la, d * 0.6, z0), P(la, d * 0.6, z0 - fh * 0.55)); S(P(la + 0.6, d * 0.6, z0), P(la + 0.6, d * 0.6, z0 - fh * 0.55));
  g.segs2(segs, col, 0.42);
};
/* a wooden water tank on a steel stand: staves, hoops, a conical roof with a finial, a ladder */
NK.tank = function (g, x, y, z, o) {
  o = o || {}; const r = o.r || 2.1, h = o.h || 4.2, leg = o.leg || 2.2, col = o.col || NYC.tank;
  const legs = [];
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const a = g.p(x + dx * r * 0.62, y + dy * r * 0.62, z), b = g.p(x + dx * r * 0.62, y + dy * r * 0.62, z + leg); legs.push(a[0], a[1], b[0], b[1]); }
  const xa = g.p(x - r * 0.62, y + r * 0.62, z + 0.2), xb = g.p(x + r * 0.62, y + r * 0.62, z + leg - 0.1), xc = g.p(x + r * 0.62, y + r * 0.62, z + 0.2), xd = g.p(x - r * 0.62, y + r * 0.62, z + leg - 0.1);
  legs.push(xa[0], xa[1], xb[0], xb[1], xc[0], xc[1], xd[0], xd[1]);
  g.segs2(legs, '#4A4440', 0.55);
  K.box(g, x - r * 0.8, y - r * 0.8, x + r * 0.8, y + r * 0.8, z + leg - 0.35, z + leg, '#6E6660', { w: 0.4, boil: false });
  K.cyl(g, x, y, r, z + leg, z + leg + h, { t: shade(col, -0.15), l: col, r: shade(col, 0.16) }, { w: 0.7, n: 12, nt: true, c: '#4A3726' });
  const st = [];
  for (let i = 1; i < 9; i++) { const a = A_L + (A_R + TAU - A_L) * i / 9 - TAU * 0; const aa = Math.PI * 0.75 - Math.PI * i / 9; const p0 = g.p(x + Math.cos(aa) * r, y + Math.sin(aa) * r, z + leg + 0.1), p1 = g.p(x + Math.cos(aa) * r, y + Math.sin(aa) * r, z + leg + h - 0.1); st.push(p0[0], p0[1], p1[0], p1[1]); void a; }
  g.segs2(st, shade(col, 0.3), 0.28);
  for (const t of [0.22, 0.55, 0.85]) g.fine(K.arc(x, y, z + leg + h * t, r + 0.04, A_L, A_R, 12), { w: 0.38, c: '#3E3A36' });
  K.cone(g, x, y, r + 0.25, z + leg + h, r * 0.75, shade(col, -0.05), { c: '#4A3726' });
  const f = g.p(x, y, z + leg + h + r * 0.75); g.disc2([f[0], f[1] - 0.6], 0.45, '#4A4440');
  // a ladder up the side we see
  const L0 = g.p(x + r * 0.7, y + r * 0.72, z + leg), L1 = g.p(x + r * 0.7, y + r * 0.72, z + leg + h + 0.4);
  g.segs2([L0[0] - 0.4, L0[1], L1[0] - 0.4, L1[1], L0[0] + 0.4, L0[1], L1[0] + 0.4, L1[1]], '#3E3A36', 0.3);
};
/* rooftop clutter: bulkhead, vents, a chimney */
NK.roofStuff = function (g, x0, y0, x1, y1, z, seed) {
  const R = RNG(seed || 1);
  const bx = lerp(x0 + 1, x1 - 4, R()), by = lerp(y0 + 1, y1 - 4, R());
  K.box(g, bx, by, bx + 3, by + 2.6, z, z + 2.2, { t: '#D9D3C6', l: '#E3DED2', r: '#C9C3B6' }, { w: 0.5, boil: false });
  const v = g.p(lerp(x0 + 1, x1 - 1, R()), lerp(y0 + 1, y1 - 1, R()), z);
  g.fill2([[v[0] - 0.8, v[1]], [v[0] + 0.8, v[1]], [v[0] + 0.8, v[1] - 2.4], [v[0] - 0.8, v[1] - 2.4]], '#B9B4AA'); g.fill2([[v[0] - 1.1, v[1] - 2.4], [v[0] + 1.1, v[1] - 2.4], [v[0], v[1] - 3.3]], '#8E8A84');
};
/* a flat-roofed block with parapet edge: the common Manhattan box */
NK.block = function (g, x0, y0, x1, y1, h, col, o) {
  o = o || {}; K.box(g, x0, y0, x1, y1, o.z0 || 0, h, col, { w: o.w || 0.9 });

   all timetables from NYT. */
const NYS = { K: 13, END: 186, AV: [-150, -50, 50, 150], ST: [-150, -50, 50, 150] };
const NY_AVNAME = ['3 AV', '5 AV', '6 AV', '7 AV'], NY_STNAME = ['14 ST', '34 ST', '42 ST', '59 ST'];
const NY_MANHOLES = [[-48.5, 98], [-45, -8], [-48.5, -96], [51, 28], [46, -118], [-147, 22], [149, -32], [152, 112], [22, -49], [-80, 47], [112, -152], [-118, 148], [62, 152], [-30, -147]];
const NY_STACKS = [[-96, -39.5], [104, 60.5], [-120, 160.5]];

SF.tile('streets', 0, 0, { order: -99 }, function (T) {
  const S = NYS, H = S.K, E = S.END, ASPH = NYC.asph, LINE = '#F7F5EE';
  const inJ = (v, list) => list.some((c) => Math.abs(v - c) < H + 0.01);
  // words painted on the road: letters stretched along the lane (up = the way traffic drives), nearest word first
  const roadText = (g, cx, cy, ux, uy, words, h, col) => {
    const rx = -uy, ry = ux, k = 0.4;
    words.forEach((w, n) => { const z0 = -h * 0.5 + (n - (words.length - 1) / 2) * h * 1.35 * 1; NK.textP(g, (a, z) => [cx + rx * a * k + ux * z, cy + ry * a * k + uy * z, 0.02], 0, z0, h, w, col, { center: true, w: 0.5 }); });
  };
  /* ---------------- ground ---------------- */
  T.ground(function (g) {
    g.boilP = 0.15;
    // the outer sidewalk ring beyond the outer kerbs
    const O0 = 163, O1 = 170, WALK = NYC.walk;
    for (const s of [-1, 1]) {
      g.fill(K.rect(-O1, s > 0 ? O0 : -O1, O1, s > 0 ? O1 : -O0), WALK); g.fill(K.rect(s > 0 ? O0 : -O1, -O1, s > 0 ? O1 : -O0, O1), WALK);
    }
    for (const X of S.AV) for (const s of [-1, 1]) g.fill(K.rect(X - H, s > 0 ? O0 - 0.5 : -E - 4, X + H, s > 0 ? E + 4 : -O0 + 0.5), ASPH);
    for (const Y of S.ST) for (const s of [-1, 1]) g.fill(K.rect(s > 0 ? O0 - 0.5 : -E - 4, Y - H, s > 0 ? E + 4 : -O0 + 0.5, Y + H), ASPH);
    // the grid inside
    for (const X of S.AV) g.fill(K.rect(X - H, -O0, X + H, O0), ASPH);
    for (const Y of S.ST) g.fill(K.rect(-O0, Y - H, O0, Y + H), ASPH);
    // outer kerb lines
    const kl = { w: 0.6, c: '#A9A296', boil: false };
    for (const s of [-1, 1]) {
      const edge = [];
      let prev = -O0;
      for (const c of S.AV.concat([O0 + H])) { const a = prev, b = c - H; if (b > a) edge.push([a, b]); prev = c + H; }
      for (const [a, b] of edge) { g.line([[a, s * O0, 0], [Math.min(b, O0), s * O0, 0]], kl); g.line([[s * O0, a, 0], [s * O0, Math.min(b, O0), 0]], kl); g.line([[a, s * O1, 0], [Math.min(b, O1), s * O1, 0]], kl); g.line([[s * O1, a, 0], [s * O1, Math.min(b, O1), 0]], kl); }
    }
    // the scuffed asphalt
    for (const X of S.AV) g.scuff(K.rect(X - H, -E, X + H, E), { dir: Math.atan2(AY, -AX), len: 9, c: '#DCD8CF', dens: 0.35, w: 0.55, spread: 0.05 });
    for (const Y of S.ST) g.scuff(K.rect(-E, Y - H, E, Y + H), { dir: Math.atan2(AY, AX), len: 9, c: '#DCD8CF', dens: 0.35, w: 0.55, spread: 0.05 });
    for (const X of S.AV) g.scuff(K.rect(X - H, -E, X + H, E), { dir: Math.atan2(AY, -AX), len: 6, c: NYC.asphD, dens: 0.1, w: 0.45, spread: 0.05 });
    // avenue paint: the bike lane (green) and its buffer, the bus lane (terracotta), lane lines, symbols
    const A = NYT.AVL;
    S.AV.forEach((X, i) => {
      const m = -NYT.AV[i].d, segs = [];
      const xb0 = X + m * (-12.7), xb1 = X + m * (-9.3), xbus0 = X + m * 7.4, xbus1 = X + m * 12.9;
      for (let k = 0; k <= S.ST.length; k++) {
        const y0 = k === 0 ? -E : S.ST[k - 1] + H + 1, y1 = k === S.ST.length ? E : S.ST[k] - H - 1;
        g.fill(K.rect(Math.min(xb0, xb1), y0, Math.max(xb0, xb1), y1), NYC.bike);
        { const q0 = X + m * (-9.2), q1 = X + m * (-4.8), hs = []; g.line([[q0, y0, 0], [q0, y1, 0]], { w: 0.5, c: LINE, boil: false }); g.line([[q1, y0, 0], [q1, y1, 0]], { w: 0.5, c: LINE, boil: false }); for (let y = y0 + 2; y < y1 - 3; y += 3.2) { const a = g.p(q0, y, 0), b = g.p(q1, y + 2.4, 0); hs.push(a[0], a[1], b[0], b[1]); } g.segs2(hs, LINE, 0.4); }
        g.fill(K.rect(Math.min(xbus0, xbus1), y0 + (k === 0 ? 0 : 10), Math.max(xbus0, xbus1), y1 - (k === S.ST.length ? 0 : 10)), NYC.bus);
                for (let y = y0 + 2; y < y1 - 3; y += 9) { const a = g.p(X + m * 1.4, y, 0), b = g.p(X + m * 1.4, y + 4.2, 0); segs.push(a[0], a[1], b[0], b[1]); }
        // "BUS ONLY" in each block, the letters tall along the lane, read by the drivers coming up behind
        if (y1 - y0 > 40) roadText(g, X + m * 10.25, (y0 + y1) / 2 + NYT.AV[i].d * 4, 0, NYT.AV[i].d, ['BUS', 'ONLY'], 3.4, LINE);
        // bike symbols in the bike lane
        for (const yy of [y0 + 12, y1 - 12]) if (y1 - y0 > 30) { const c = g.p(X + m * (-11), yy, 0); g.ring2([c[0] - 1.4, c[1] + 0.6], 1.0, { w: 0.4, c: LINE }); g.ring2([c[0] + 1.4, c[1] - 0.6], 1.0, { w: 0.4, c: LINE }); g.segs2([c[0] - 1.4, c[1] + 0.6, c[0] + 0.2, c[1] - 0.8, c[0] + 0.2, c[1] - 0.8, c[0] + 1.4, c[1] - 0.6], LINE, 0.4); }
      }
      g.segs2(segs, LINE, 0.75);
    });
    // cross-street lane dashes
    for (const Y of S.ST) for (const e of [-5.9, 5.9]) { const segs = []; for (let x = -E + 2; x < E - 4; x += 12.4) { if (Math.abs(Math.abs(x) - 50) < 22 || Math.abs(Math.abs(x) - 150) < 22) continue; const a = g.p(x, Y + e, 0), b = g.p(x, Y + e + Math.sign(e) * 1.4, 0); segs.push(a[0], a[1], b[0], b[1]); } g.segs2(segs, LINE, 0.5); }
    // ladder crosswalks on the four arms of every junction, and the stop lines
    for (const X of S.AV) for (const Y of S.ST) for (const s of [-1, 1]) {
      for (let k = -H + 1.1; k <= H - 1; k += 2.2) {
        g.fill(K.rect(X + k - 0.65, Math.min(Y + s * 14.2, Y + s * 19.6), X + k + 0.65, Math.max(Y + s * 14.2, Y + s * 19.6)), LINE);
        g.fill(K.rect(Math.min(X + s * 14.2, X + s * 19.6), Y + k - 0.65, Math.max(X + s * 14.2, X + s * 19.6), Y + k + 0.65), LINE);
      }
    }
    NYT.AV.forEach((A2, i) => S.ST.forEach((Y) => { const y = Y - A2.d * 21.2; g.line([[A2.x - H + 0.4, y, 0], [A2.x + H - 0.4, y, 0]], { c: LINE, w: 1.0, boil: false }); }));
    NYT.ST.forEach((S2) => S.AV.forEach((X) => { const x = X - S2.d * 21.2; g.line([[x, S2.y - H + 0.4, 0], [x, S2.y + H - 0.4, 0]], { c: LINE, w: 1.0, boil: false }); }));
    // manhole covers
    for (const [x, y] of NY_MANHOLES) { const p = g.P(K.arc(x, y, 0, 1.3, 0, TAU, 12)); g.fill2(p, '#9A958B'); g.outline2(p, { w: 0.35, c: '#6E6A62', boil: false }); }
    // the stub ends: a ragged dry-brush edge
    for (const s of [-1, 1]) for (const c of S.AV) {
      for (const ay of [true, false]) {
        const e = s * E, R = RNG(Math.round(c * 7 + s * 3 + (ay ? 1 : 2))), pts = [];
        for (let k = 0; k <= 8; k++) { const t = -H + 2 * H * k / 8, j = (R() - 0.5) * 3; pts.push(ay ? [c + t, e + s * (2 + j), 0] : [e + s * (2 + j), c + t, 0]); }
        g.fill(pts.concat(ay ? [[c + H, e - s * 0.5, 0], [c - H, e - s * 0.5, 0]] : [[e - s * 0.5, c + H, 0], [e - s * 0.5, c - H, 0]]), ASPH);
      }
    }
  });

  /* ---------------- parked cars, work zones, lamps ---------------- */
  // parked cars on both sides of the cross streets, kept clear of junctions
  const R = RNG(4242), PCOL = ['#2F3238', '#C9CCCC', '#8FA3B5', '#F1EFE8', '#6C2E2E', '#3F5F8F', '#B9A27D', '#4A5A48', '#2F3238'];
  const okAlong = (v, list) => list.every((c) => Math.abs(v - c) > 27);
  // the avenue's planted buffer between the bike lane and the traffic: flexi-posts and a planter now and then
  NYT.AV.forEach((A2, i) => {
    const xb = A2.x + (-A2.d) * NYT.AVL.buf;
    for (let y = -176; y < 176; y += 16) {
      if (!okAlong(y, NYS.ST) || Math.abs(y) > 172) continue;
      const kk = Math.round(y / 16 + i * 3);
      if (kk % 3 === 0) T.obj([xb, y], (g) => { K.box(g, xb - 1.0, y - 2.4, xb + 1.0, y + 2.4, 0, 1.4, { t: '#B9A487', l: '#A8936F', r: '#8E7B5C' }, { w: 0.45, boil: false }); for (const dy of [-1.4, 0, 1.4]) K.bush(g, xb, y + dy, { r: 0.9, z: 1.4, col: kk % 2 ? '#8DB868' : '#B5CF8E' }); }, { name: 'planter' });
      else { T.obj([xb, y], (g) => { for (const dy of [-4, 0, 4]) { const a = g.p(xb, y + dy, 0), b = g.p(xb, y + dy, 2.2); g.fill2([[a[0] - 0.35, a[1]], [a[0] + 0.35, a[1]], [b[0] + 0.35, b[1]], [b[0] - 0.35, b[1]]], '#F6F3EA', true); g.fill2([[b[0] - 0.35, b[1] + 0.9], [b[0] + 0.35, b[1] + 0.9], [b[0] + 0.35, b[1] + 1.4], [b[0] - 0.35, b[1] + 1.4]], '#C9463E', true); } }, { name: 'posts' }); }
    }
  });
  NYT.ST.forEach((S2, j) => {
    for (const side of [-1, 1]) {
      const yp = S2.y + side * 9.0;
      for (let x = -158; x < 158; x += 12.4) {
        if (!okAlong(x, NYS.AV) || R() < 0.42) continue;
        if (NY_STACKS.some(([sx, sy]) => Math.abs(sx - x) < 9 && Math.abs(sy - yp) < 4)) continue;
        const col = R.pick(PCOL), ang = S2.d > 0 ? 0 : Math.PI;
        T.obj([x, yp], (g) => g.at(x, yp, 0, (g2) => K.car(g2, ang, { col })), { name: 'parked' });
      }
    }
  });
  // Con Ed work zones: the striped stack, a ring of cones, a barrel
  for (const [x, y] of NY_STACKS) {
    T.obj([x, y], (g) => {
      for (let k = 0; k < 8; k++) { const a = TAU * k / 8, c = g.p(x + Math.cos(a) * 3.2, y + Math.sin(a) * 2.2, 0); if (Math.sin(a) < -0.3) g.fill2([[c[0] - 0.7, c[1]], [c[0] + 0.7, c[1]], [c[0], c[1] - 2.4]], '#E8742C', true); }
      NK.stack(g, x, y);
      for (let k = 0; k < 8; k++) { const a = TAU * k / 8, c = g.p(x + Math.cos(a) * 3.2, y + Math.sin(a) * 2.2, 0); if (Math.sin(a) >= -0.3) { g.fill2([[c[0] - 0.7, c[1]], [c[0] + 0.7, c[1]], [c[0], c[1] - 2.4]], '#E8742C', true); g.fill2([[c[0] - 0.45, c[1] - 0.9], [c[0] + 0.45, c[1] - 0.9], [c[0] + 0.3, c[1] - 1.4], [c[0] - 0.3, c[1] - 1.4]], '#F6F2E8', true); } }
    }, { name: 'stack' });
    NK.steamActor(T, x, y, { z: 9.4, H: 15, n: 5, w: 1.6, drift: 5, per: 2.2, cast: false });
  }
  // steaming manholes
  NY_MANHOLES.forEach(([x, y], k) => { if (k % 3 === 0) NK.steamActor(T, x, y, { z: 0.2, H: 9, n: 4, w: 1.5, drift: 3, per: 2.8, phase: k * 0.37, cast: false }); });
  // cobra-head lamps on the near kerb of each street, arms over the road
  for (const X of NYS.AV) for (let y = -160; y <= 160; y += 34) { if (!okAlong(y, NYS.ST)) continue; T.obj([X + 13.3, y], (g) => NK.lamp(g, X + 13.3, y, -1, 0, { L: 5 }), { name: 'lamp' }); }
  for (const Y of NYS.ST) for (let x = -160; x <= 160; x += 34) { if (!okAlong(x, NYS.AV)) continue; T.obj([x, Y + 13.3], (g) => NK.lamp(g, x, Y + 13.3, 0, -1, { L: 5 }), { name: 'lamp' }); }

  /* ---------------- signals ---------------- */
  // a pole with a mast arm along (dx, dy) of length L at height h, a street-name blade on top
  const pole = (g, x, y, arms, names) => {
    const f = g.p(x, y, 0), t = g.p(x, y, 11.2);
    g.fill2([[f[0] - 1.0, f[1]], [f[0] + 1.0, f[1]], [f[0] + 0.8, f[1] - 1.6], [f[0] - 0.8, f[1] - 1.6]], '#4A4744');
    g.fill2([[f[0] - 0.55, f[1] - 1.5], [f[0] + 0.55, f[1] - 1.5], [t[0] + 0.4, t[1]], [t[0] - 0.4, t[1]]], '#5A5650');
    g.glow('lamp', x, y, 11.0, { r: 1.3 });                                         // the street light every signal pole carries (only at night)
    for (const [dx, dy, L] of arms) { const a = g.p(x, y, 10.6), b = g.p(x + dx * L, y + dy * L, 10.6), c = g.p(x, y, 8.6); g.line2([a, b], { w: 0.75, c: '#4A4744', boil: false, ext: 0 }); g.line2([c, g.p(x + dx * L * 0.35, y + dy * L * 0.35, 10.6)], { w: 0.45, c: '#4A4744', boil: false, ext: 0 }); }
    names.forEach(([word, ax], k) => {
      const z = 11.4 + k * 1.15, L = 2.6, P = ax === 'x' ? (s, zz) => [x + s, y + 0.05, zz] : (s, zz) => [x + 0.05, y - s, zz];
      g.fill([P(-L, z), P(L, z), P(L, z + 1.0), P(-L, z + 1.0)], '#2E7D4F'); NK.textP(g, P, 0, z + 0.22, 0.56, word, '#F6F3EA', { center: true, w: 0.3 });
    });
  };
  NYT.AV.forEach((A2, i) => NYT.ST.forEach((S2, j) => {
    const X = A2.x, Y = S2.y, c = 12.4;
    // avenue: far-side arm over the travel lanes; southbound heads face us (+y), northbound show their backs
    const ay = A2.d < 0 ? Y - c : Y + c, axp = X + c;
    // cross street: eastbound heads face us (+x) on the far side; westbound show their backs
    const cx = S2.d < 0 ? X - c : X + c, cyp = Y + c;
    const nearPole = A2.d > 0 || S2.d > 0;
    if (A2.d < 0) T.obj([axp, ay], (g) => pole(g, axp, ay, [[-1, 0, 19]], [[NY_AVNAME[i], 'x'], [NY_STNAME[j], 'y']]), { name: 'signal' });
    if (S2.d < 0) T.obj([cx, cyp], (g) => pole(g, cx, cyp, [[0, -1, 19]], A2.d < 0 ? [] : [[NY_AVNAME[i], 'x'], [NY_STNAME[j], 'y']]), { name: 'signal' });
    if (nearPole) T.obj([X + c, Y + c], (g) => pole(g, X + c, Y + c, (A2.d > 0 ? [[-1, 0, 19]] : []).concat(S2.d > 0 ? [[0, -1, 19]] : []), A2.d < 0 || S2.d < 0 ? [] : [[NY_AVNAME[i], 'x'], [NY_STNAME[j], 'y']]), { name: 'signal' });
    // the heads: one actor per approach, keyed by its light
    const head = (g, st, face, lamps) => {
      for (const [hx, hy] of lamps) {
        const top = g.p(hx, hy, 10.4), w = 2.3, h = 11, x0 = top[0] - w, y0 = top[1] + 0.4;
        g.fill2([[top[0] - 0.15, top[1]], [top[0] + 0.15, top[1]], [top[0] + 0.15, y0], [top[0] - 0.15, y0]], '#3A3632', true);
        const box = [[x0, y0], [x0 + 2 * w, y0], [x0 + 2 * w, y0 + h], [x0, y0 + h]];
        if (face) {
          g.fill2([[x0 - 1.1, y0 - 0.7], [x0 + 2 * w + 1.1, y0 - 0.7], [x0 + 2 * w + 1.1, y0 + h + 0.7], [x0 - 1.1, y0 + h + 0.7]], '#2A2622', true);
          g.fill2(box, '#4A4540', true);
          [['#E0503E', 'R'], ['#F0B43C', 'A'], ['#62C47E', 'G']].forEach(([col, k], q) => { g.disc2([x0 + w, y0 + 1.9 + q * 3.6], 1.45, st.l === k ? col : '#5E5850'); if (st.l === k) g.mark({ nc: true, light: true }); });
          const lit = st.l === 'R' ? 0 : st.l === 'A' ? 1 : 2; g.disc2([x0 + w, y0 + 1.9 + lit * 3.6], 2.5, st.l === 'R' ? 'rgba(224,80,62,0.3)' : st.l === 'A' ? 'rgba(240,180,60,0.3)' : 'rgba(98,196,126,0.3)'); g.mark({ nc: true });
        } else {
          g.fill2(box, '#3A3632', true);
          const lit = st.l === 'R' ? 0 : st.l === 'A' ? 1 : 2; g.fill2([[x0 + 2 * w - 0.3, y0 + 0.5 + lit * 3.6], [x0 + 2 * w + 0.9, y0 + 0.7 + lit * 3.6], [x0 + 2 * w + 0.9, y0 + 3.1 + lit * 3.6], [x0 + 2 * w - 0.3, y0 + 3.3 + lit * 3.6]], st.l === 'R' ? '#E0503E' : st.l === 'A' ? '#F0B43C' : '#62C47E', true); g.mark({ nc: true, light: true });   // its light spills past the back of the head
        }
      }
    };
    const aLamps = [[X + (-A2.d) * NYT.AVL.t1, A2.d < 0 ? Y - c : Y + c], [X + (-A2.d) * NYT.AVL.t2 * 0.9, A2.d < 0 ? Y - c : Y + c]];
    const cLamps = [[S2.d < 0 ? X - c : X + c, Y + 3.3], [S2.d < 0 ? X - c : X + c, Y - 3.3]];
    T.actor({ sample: 5, period: 10, grow: false, cast: false,
      at(t) { const l = NYT.light(i, j, 'ave', t); return { x: X, y: A2.d < 0 ? Y - c : Y + c, z: 0, key: 'a' + l, l }; },
      draw(g, st) { const yy = A2.d < 0 ? Y - c : Y + c; head(g, st, A2.d < 0, aLamps.map(([hx, hy]) => [hx - X, hy - yy])); } });
    T.actor({ sample: 5, period: 10, grow: false, cast: false,
      at(t) { const l = NYT.light(i, j, 'crs', t); return { x: S2.d < 0 ? X - c : X + c, y: Y, z: 0, key: 'c' + l, l }; },
      draw(g, st) { const xx = S2.d < 0 ? X - c : X + c; head(g, st, S2.d < 0, cLamps.map(([hx, hy]) => [hx - xx, hy - Y])); } });
  }));

  /* ---------------- the traffic ---------------- */
  const CABCOL = ['#2F3238', '#C9CCCC', '#8FA3B5', '#F1EFE8', '#3F5F8F', '#6C2E2E'];
  // side-by-side vehicles: an actor sorts by x + y, so a car in the far lane that is a little ahead would be painted over
  // the car beside it in the near lane. A small bias per lane (ranked across the street) keeps lanes in order.
  const laneBias = new Map();
  for (const L of NYT.LANES) {
    if (L.kind === 'bike') { laneBias.set(L, 0); continue; }
    const sib = NYT.LANES.filter((M2) => M2.axis === L.axis && M2.kind !== 'bike' && (L.axis === 'y' ? M2.ai === L.ai : M2.sj === L.sj)).map((M2) => M2.c).sort((p, q) => p - q);
    const r = sib.indexOf(L.c), n = sib.length;
    laneBias.set(L, n === 1 ? 0 : (r / (n - 1) - 0.5) * (n === 2 ? 8 : 11));
  }
  NYT.tracks.forEach((tr, ti) => {
    const M = NYT.copies(tr), col = CABCOL[ti % CABCOL.length], who = NK.who(7000 + ti, { cap: undefined }), box = ['#2FA58F', '#C9463E', '#E8742C', '#2F6DB5'][ti % 4];
    for (let m = 0; m < M; m++) T.actor({ cast: false, sample: 0.25, period: NYT.PER * M, grow: false, bias: laneBias.get(tr.lane),
      // anchored at the vehicle's far end (smallest x or y), drawn half a length on: a car whose far end is behind a
      // building is ordered behind it, like the car beside it, so two cars side by side are never split by a sprite
      at(t) { const p = NYT.at(tr, m, t); if (!p) return null; const ax = tr.lane.axis === 'x'; return { x: ax ? p.x - p.len / 2 : p.x, y: ax ? p.y : p.y - p.len / 2, key: 'h' + Math.round(p.ang * 100), ang: p.ang, ox: ax ? p.len / 2 : 0, oy: ax ? 0 : p.len / 2, alpha: p.alpha < 1 ? p.alpha : null }; },
      draw(g, st) { g.at(st.ox, st.oy, 0, (g2) => this.draw0(g2, st)); },
      draw0(g, st) {
        const k = tr.type, a = st.ang;
        if (k === 'cab') NK.cab(g, a); else if (k === 'cabv') NK.cab(g, a, { van: true }); else if (k === 'black') NK.blackcar(g, a);

/* (-100,-100) The Financial District, at the far top of the map.
   One World Trade Center stands at the far corner: a glass podium, then a shaft whose square base is chamfered into
   eight long triangles, so it turns into a square set at 45 degrees at the roof; a white spire with rings above.
   Along the far side, facing us across the plaza: the Stock Exchange (a temple front of six Corinthian columns between
   two piers, a pediment, the giant flag hung across the columns, the taller annex behind) and Federal Hall (a Doric
   temple of eight columns on a high flight of steps, George Washington on his plinth at the foot).
   The middle band is the granite Wall Street plaza, closed to cars by black security bollards: the Charging Bull on its
   plinth with tourists queueing to pose at the horns and a friend taking the photo, pigeons, a hot-dog cart, an NYPD
   officer, suits with coffee walking through. The near half is low so the plaza stays in view: a memorial pool sunk in
   the paving, water falling down its inner walls into the square void, visitors at the bronze parapet among swamp white
   oaks; and the Oculus, the white ribbed station hall spreading its wings, commuters walking in.
   What moves: the falling water, the flag on Federal Hall, walkers, pigeons, the pool visitors' children. */

/* (0,-100) Where Chinatown meets Little Italy.
   Mulberry Street runs along x through the far half, closed to cars for dinner: on its far side a row of walk-ups
   with restaurants below (red brick, cream stucco, green-trimmed; awnings, RISTORANTE / CAFFE / PIZZA boards, fire
   escapes, a water tank) on the Little Italy end, and on the Chinatown end narrow buildings hung with red and yellow
   signboards, a bakery, a herb shop. Arches of red, white and green bulbs span the Italian end of the street, strings
   of red paper lanterns the Chinese end. Red-checked tables in the street with diners; a waiter carries plates.
   The near half is Columbus Park, low so the street stays in view: stone tables where old men play xiangqi and cards
   with a crowd of kibitzers, a tai chi class moving slowly in a row, birdcages hung on a branch, kids shooting hoops on
   the half court. Along the right-hand kerb, a two-storey Chinatown row with fruit stands out on the sidewalk under
   striped awnings: oranges, dragon fruit, bok choy; a fishmonger on ice.
   What moves: the waiter, strollers, the tai chi class, the basketball, a hand-truck of boxes, lantern tassels. */

      if (t <= 1) segs.push(c[0] - h * 0.85, c[1] + a * 0.9, c[0] + h * 0.85, c[1] + a * 0.9);
      else if (t <= 3) segs.push(c[0] + a * 0.9, c[1] - h * 0.9, c[0] + a * 0.9, c[1] + h * 0.9);
      else if (t === 4) segs.push(c[0] + a * 0.5, c[1] - h * 0.3, c[0] + a * 0.5 - h * 0.6, c[1] + h * 0.8);
      else segs.push(c[0], c[1], c[0] + h * 0.7, c[1] + h * 0.75);
    }
    g.segs2(segs, col, Math.max(0.3, s * 0.13));
  };
  /* a Chinese signboard on a face: vertical (a column of glyphs) or horizontal */

/* (100,0) Chelsea, the High Line and Hudson Yards (the west side, by the Hudson).

   Drawn as it is built: pairs of steel columns, a deep plate girder painted dark green-grey, and on the deck a ribbon of
   concrete planks that taper into wild planting (tall grasses, perennials, little birches), the old rails surfacing in
   the beds, a sundeck of wooden loungers, railings on both edges, a stair down at the north end. Beside it Chelsea
   Market: the old biscuit factory, a big dark-red brick block with arched windows, a loading-dock canopy and water
   tanks. A white-box gallery with tall glass. North, at Hudson Yards, the Vessel: a copper honeycomb of stair flights
   rising as an upturned bowl, on a paved square with planting.
   Who is there: strollers on the High Line, sunbathers on the loungers, a couple taking a selfie at the rail, people
   looking at a huge canvas in the gallery, a queue for the Vessel and tourists on its landings, a food truck with
   customers, a market shopper with bags, a dog walker. What moves: walkers on the deck both ways, walkers on the square
   and the sidewalks, a Citi Bike rider, steam from the market's vent. */

  const HX0 = 22, HX1 = 30, HY0 = -31, HY1 = 23, DZ = 6.6;          // the High Line's footprint and deck height

    // the sidewalk strip under the High Line

/* (0,0) The Empire State Building and Herald Square: the centrepiece.
   What it is: the 1931 Art Deco tower on Fifth Avenue at 34th Street, drawn as it is built: a five-storey limestone base
   filling the lot, a setback, the long shaft with its projecting central bays, then the stepped setbacks of the 72nd to
   86th floors (the observation deck with its rail), the stepped drum of the mooring mast with its ribs, the spire and the
   antenna with a red light. The shaft is limestone with continuous vertical piers between strips of windows and dark
   spandrels, so it reads as one tall striped prism. It stands in the middle of the tile, a little to the far side, so its
   height covers as little of the places behind it as possible. The Fifth Avenue entrance (the 'R' face) has a marquee and
   flags; the 34th Street face ('L') has the queue for the observation deck.
   Around it: on the near right, Herald Square: a paved triangle with green bistro tables and chairs, the bell monument
   (a granite wall, a bronze bell, Minerva above it), trees, planters; behind it a department store with red awnings and
   window displays. On the near left a pair of Koreatown walk-ups (a BBQ place and a deli) with fire escapes and a tank.
   Who is there: tourists craning their necks and photographing the tower, a tour guide with a flag and her group, the
   line for the observation deck, a hot-dog vendor, people at the bistro tables, a couple with shopping bags, an NYPD

/* (-100,0) The Flatiron and Madison Square.

   Drawn as it is built: a three-storey rusticated limestone base, a tall shaft of cream terracotta with rows of windows
   between continuous piers, the rounded prow, a deep cornice and a crown of arched top-floor windows. Its prow points
   at us (north), so both long faces show: the lit one on Broadway, the shaded one on the plaza side. Broadway runs
   diagonally through the tile as a real road with its own bike lane, from the avenue at the far left into the prow
   plaza; on the other side of the wedge a pedestrian plaza (the Flatiron plazas) with granite blocks, green tables and
   planters. North of the prow lies Madison Square Park: lawns under big plane trees, a fenced dog run, the burger kiosk
   with its long queue, benches, a statue. Low lofts and walk-ups (fire escapes, a water tank) fill the edges.
   Who is there: people queueing for burgers and eating them on the benches, dogs chasing a ball in the run, a tourist
   lying on the plaza to fit the whole wedge into a photo, chess at a plaza table, a parked cab dropping someone off.
   What moves: Citi Bike riders down Broadway and out along the plaza, walkers in the park and on the plaza, the dogs. */
SF.tile('flatiron', -100, 0, { rim: 14 }, function (T) {

   copper-green roof. A paved plaza in front (Pershing Square): cafe tables under green umbrellas, a TAXI line, the
   pretzel cart, a subway entrance with green globes, a sax player with listeners, commuters streaming out of the doors.
   At the far corner the Chrysler Building: a white-brick tower in three setbacks with dark window stripes, steel
   eagles at the shaft's corners and the stainless-steel crown of seven stacked sunburst arches pierced by triangular
   windows, then the needle spire. Behind the terminal an office slab (the Graybar), shops on 5th; on the north side

/* (0,100) Times Square: the bowtie plaza where Broadway crosses Seventh Avenue, a canyon of light.
   How it is built: the pedestrian plaza of dark pavers with pale discs runs the length of the tile. At its far (south)
   end stands One Times Square, a narrow tower that is nothing but stacked screens, a news ticker round its waist and the
   New Year's ball on a mast on top. The east side is a wall of three towers whose west faces are giant billboards (the
   screens are actors: a winking face, a fizzing drink, BROADWAY in lights, a skyline at sunset), the far corners carry
   more. On the west side a theatre with a bulb-lit marquee and a vertical blade sign; beyond it Duffy Square with
   Father Duffy in bronze and the NYPD booth. The red steps (TKTS) rise from the plaza towards the far end: people sit
   on the red glass treads facing us, watching a breakdance crew perform in a ring in front of them.
   Who is there: tourists everywhere (I-heart-NY tees, phones up), a Statue of Liberty performer posing for photos, a
   red furry monster and a caped superhero working the crowd, the guitar-playing cowboy in his hat, boots and white
   briefs, a pretzel cart, two NYPD officers and a mounted officer on a white-faced horse, a pedicab waiting.
   What moves: every screen, the ticker, the dancers (a flip, a freeze, a windmill), the monster, the horse, walkers. */
SF.tile('times', 0, 100, { rim: 36 }, function (T) {
  const H = 37, PAVE = '#CBC7C0', DISC = '#E6E3DC';
  const STEPS = { x0: -12, x1: 4, y0: 4, y1: 17, n: 10, top: 7.4 };

  /* ---------------- ground ---------------- */
  T.ground(function (g) {
    NK.lot(g, { inner: PAVE });
    const pl = K.rect(-31, -31, 31, 31);
    g.scuff(pl, { dir: Math.atan2(AY, -AX), len: 5, c: '#D8D4CD', dens: 0.5, w: 0.5, spread: 0.05 });
    const d = []; for (let x = -28; x < 29; x += 4.6) for (let y = -28; y < 29; y += 4.6) { const p = g.p(x + ((y * 7) % 2), y, 0); d.push(p); }
    for (const p of d) g.fill2([[p[0] - 1.1, p[1]], [p[0], p[1] - 0.6], [p[0] + 1.1, p[1]], [p[0], p[1] + 0.6]], DISC, true);
    // the performance ring: a chalk circle and a cardboard mat
    g.fill(K.arc(-4, 25.5, 0.01, 4.4, 0, TAU, 20), '#D7CDB8');
    g.fill([[-7, 23.5, 0.02], [-1, 23.5, 0.02], [-1, 27.5, 0.02], [-7, 27.5, 0.02]], '#C9A774');
    g.outline(K.arc(-4, 25.5, 0.02, 4.4, 0, TAU, 20), { w: 0.4, c: '#F6F3EA', boil: false });
  }, { rim: true });

  /* ---------------- billboard screens: actors keyed by their frame ---------------- */
  // a screen on a face. face 'R': plane x = p, seen from left (y = A) to right (y = B < A). face 'L': plane y = p, x from A to B.
  const screen = (face, p, A, B, z0, z1, kind, o) => {
    o = o || {}; const W = Math.abs(B - A), Hh = z1 - z0, NPH = o.nph || 8, per = o.per || 4;
    const ax = face === 'R' ? p : A, ay = face === 'R' ? B : p;
    const Q = face === 'R' ? (u, v) => [p + 0.08 - ax, A - u - ay, z0 + v] : (u, v) => [A + u - ax, p + 0.08 - ay, z0 + v];
    T.actor({ sample: 5, period: 20, grow: false,
      at(t) { const ph = Math.floor(((t / per + (o.phase || 0)) % 1) * NPH); return { x: ax, y: ay, z: 0, key: kind + ph, ph }; },
      draw(g, st) { TS_paint(g, Q, W, Hh, kind, st.ph, NPH, o); } });
  };
  const rect = (g, Q, u0, v0, u1, v1, col) => g.fill([Q(u0, v0), Q(u1, v0), Q(u1, v1), Q(u0, v1)], col);
  /* a screen's light at night (nothing by day): glows along its foot, over the lit shop floor below it; face 'L' (plane
     y = p) or 'R' (plane x = p), from a0 to a1 along it, from z0 */
  const shine = (g, face, p, a0, a1, z0, z1, col, r) => {
    const n = Math.max(2, Math.round(Math.abs(a1 - a0) / 7));
    for (let i = 0; i < n; i++) { const q = K.pt(face, p + 0.4, lerp(a0, a1, (i + 0.5) / n), z0 + 0.4); g.glow('neon', q[0], q[1], q[2], { r: Math.min(4.6, r * 0.7), col }); }
  };
  function TS_paint(g, Q, W, Hh, kind, ph, NPH, o) {
    const t = ph / NPH, i0 = g.cmds.length;
    if (kind === 'face') {               // a giant smiling face that winks
      rect(g, Q, 0, 0, W, Hh, '#F2C12E');
      const cx = W / 2, cz = Hh / 2, r = Math.min(W, Hh) * 0.36, ring = [];
      for (let i = 0; i < 24; i++) { const a = TAU * i / 24; ring.push(Q(cx + Math.cos(a) * r, cz + Math.sin(a) * r)); }
      g.fill(ring, '#FBF3D6'); g.mark({ light: true });                                 // (light: it shines at night)
      const wink = ph % 4 === 2;
      g.fill([Q(cx - r * 0.45, cz + r * 0.25), Q(cx - r * 0.25, cz + r * 0.25), Q(cx - r * 0.25, cz + r * 0.55), Q(cx - r * 0.45, cz + r * 0.55)], '#2C271C');
      if (wink) g.fill([Q(cx + r * 0.2, cz + r * 0.32), Q(cx + r * 0.5, cz + r * 0.32), Q(cx + r * 0.5, cz + r * 0.4), Q(cx + r * 0.2, cz + r * 0.4)], '#2C271C');
      else g.fill([Q(cx + r * 0.25, cz + r * 0.25), Q(cx + r * 0.45, cz + r * 0.25), Q(cx + r * 0.45, cz + r * 0.55), Q(cx + r * 0.25, cz + r * 0.55)], '#2C271C');
      const sm = []; for (let i = 0; i <= 10; i++) { const a = Math.PI * (1.15 + 0.7 * i / 10); sm.push(Q(cx + Math.cos(a) * r * 0.6, cz + Math.sin(a) * r * 0.6)); }
      for (let i = 10; i >= 0; i--) { const a = Math.PI * (1.15 + 0.7 * i / 10); sm.push(Q(cx + Math.cos(a) * r * 0.42, cz - r * 0.05 + Math.sin(a) * r * 0.42)); }
      g.fill(sm, '#C9463E');
      for (const s of [-1, 1]) g.fill([Q(cx + s * r * 0.62, cz - r * 0.05), Q(cx + s * r * 0.82, cz - r * 0.05), Q(cx + s * r * 0.82, cz + r * 0.1), Q(cx + s * r * 0.62, cz + r * 0.1)], '#F2A3A0');
    } else if (kind === 'drink') {       // a fizzing drink on red, bubbles rising
      rect(g, Q, 0, 0, W, Hh, '#C9362E');
      for (let i = 0; i < 5; i++) rect(g, Q, 0, Hh * i / 5, W, Hh * i / 5 + Hh * 0.04, '#D9473C');
      const cx = W * 0.35, gl = [Q(cx - W * 0.12, Hh * 0.12), Q(cx + W * 0.12, Hh * 0.12), Q(cx + W * 0.16, Hh * 0.8), Q(cx - W * 0.16, Hh * 0.8)];
