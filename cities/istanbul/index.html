/* ---------------- boats in parts ----------------
   A boat is a list of primitives laid out along its length u (bow at +u) and across it v, heights z above the water.
   Each part [u0, u1] is drawn by its own actor anchored at its own centre, so a long hull slides under a bridge or past
   a pier piece by piece. Primitives: { box: [ua, ub], hw, vc, z: [z0, z1], col } · { bow: [ua, ub], hw, z, col, top }
   · { stern: [ua, ub], hw, z, col, top } (a rounded counter) · { band: [ua, ub], hw, z, col } (painted on the visible
   side) · { at: u, fn(g, P, vis) } (anything else, drawn in the part that contains u). */
IS.boatPart = function (g, prims, ang, u0, u1, cu, night) {
  const ca = Math.cos(ang), sa = Math.sin(ang), P = (u, v, z) => [(u - cu) * ca - v * sa, (u - cu) * sa + v * ca, z];
  const side = (-sa + ca) > 0 ? 1 : -1, vis = { side, bow: ca + sa > 0 };
  const taper = (p, wd) => {
    const a = Math.max(p[0], u0), b = Math.min(p[1], u1); if (b - a < 0.01) return;
    const col = K.tones(p.col), z0 = p.z[0], z1 = p.z[1], n = 4;
    const pts = (s, z) => { const r = []; for (let i = 0; i <= n; i++) { const u = lerp(a, b, i / n); r.push(P(u, s * wd(u), z)); } return r; };
    const sideQ = pts(side, z0).concat(pts(side, z1).reverse()); g.fill(sideQ, mix(col.l, col.r, vis.bow === (p.bow != null) ? 0.2 : 0.7)); g.outline(sideQ, { w: 0.5, boil: false });
    const top = pts(-1, z1).concat(pts(1, z1).reverse()); g.fill(top, p.top || col.t); g.outline(top, { w: 0.45, boil: false });
  };
  for (const p of prims) {
    if (p.box) {
      const a = Math.max(p.box[0], u0), b = Math.min(p.box[1], u1); if (b - a < 0.01) continue;
      const c = P((a + b) / 2, p.vc || 0, 0);
      K.rbox(g, c[0], c[1], (b - a) / 2, p.hw, ang, p.z[0], p.z[1], p.col, { w: p.w == null ? 0.55 : p.w, nb: true, nt: p.nt });
    } else if (p.band) {

    else if (p.at != null) { if (p.at < u0 || p.at >= u1 || (p.night && !night)) continue; p.fn(g, P, vis); }
    else if (p.span) { if (p.night && !night) continue; const a = Math.max(p.span[0], u0), b = Math.min(p.span[1], u1); if (b - a > 0.05) p.fn(g, P, vis, a, b); }
  }
};
/* night prims for a boat (drawn only in its night poses): the lit window rows' broken reflections on the water beside

/* The Galata Bridge (x -63..-37 over the Golden Horn, y -72..-28), the clever moment. What it is: a two-level bridge.
   The upper deck (z 6) carries the avenue across: the T1 tram on its two tracks in the middle, a car lane each side, a
   footway along each rail lined with anglers. Under it, on both sides, the lower deck: a row of fish restaurants on a
   promenade just above the water, open to the Horn under the upper deck, each with its coloured valance, hanging lamps
   and a name board; diners at the tables, waiters, a tout with a menu. The middle span (y -60..-40) has no lower deck:
   the Golden Horn ferries pass under it. Steel girders, grey-blue, on concrete piers.
   Seen from the south-east, the east side is a living cutaway: the restaurants under the deck, the anglers above them
   casting and reeling in a wave that runs down the rail (each angler 0.45 s after the one before, a silvery fish on
   some lines), their lines falling past the restaurant awnings into the water, cats waiting at the buckets, the tram
   and the cars crossing behind them, a simit seller and a tea seller walking the footway.
   Depth: lower-deck restaurants (bias: before the deck), the upper deck { under: 6 } (boats under, everything on it at
   z 6 on it), the east rail in pieces { on: true } so the anglers and the traffic are behind it. Ramps up to the deck are
   drawn by the neighbouring tiles (IS.ramp), so they sort with the buildings beside them. */
/* a ramp of the avenue up to the bridge deck: world box x -63..-37, y wy0..wy1, rising from z 0 at the land end to the
   deck at the water end (IT.zAve). Drawn from the tile T that owns it (tile-local = world - T's centre). */
IS.ramp = function (T, wy0, wy1) {
  const ox = T.cx, oy = T.cy, x0 = -63 - ox, x1 = -37 - ox, y0 = wy0 - oy, y1 = wy1 - oy, Z = (yy) => IT.zAve(yy + oy);
  T.obj([x0, y0, x1, y1], function (g) {
    g.boilP = 0.3;
    const n = 12, ys = []; for (let i = 0; i <= n; i++) ys.push(lerp(y0, y1, i / n));
    // the east wall: dressed stone with two dark arches (passages under the ramp), the parapet
    const wallTop = ys.map((y) => [x1, y, Z(y)]), base = [[x1, y1, 0], [x1, y0, 0]];
    g.fill(wallTop.concat(base), '#D5CCB8');
    const st = []; for (let z = 1.1; z < 6; z += 1.1) { let a = null; for (const y of ys) { if (Z(y) > z + 0.1) { const p = g.p(x1 + 0.02, y, z); if (a) st.push(a[0], a[1], p[0], p[1]); a = p; } else a = null; } }
    g.segs2(st, '#B9AF9A', 0.3);
    const ym = (y0 + y1) / 2, hi = Z(y0) > Z(y1) ? y0 : y1, archY = lerp(ym, hi, 0.45);
    if (Math.max(Z(y0), Z(y1)) > 4) { const q = [[x1 + 0.02, archY - 2.2, 0], [x1 + 0.02, archY + 2.2, 0]]; for (let k = 0; k <= 8; k++) { const t = Math.PI * k / 8; q.push([x1 + 0.02, archY + 2.2 * Math.cos(t), 2.2 + 1.6 * Math.sin(t)]); } g.fill(q, '#4E4A42'); }
    g.line(wallTop, { w: 0.8, boil: false }); g.line(base, { w: 0.8, boil: false });
    g.line([[x1, y0, 0], [x1, y0, Z(y0)]], { w: 0.7, boil: false }); g.line([[x1, y1, 0], [x1, y1, Z(y1)]], { w: 0.7, boil: false });
    // the end face towards the water (the north abutment over the Horn faces +y)
    if (Z(y1) > 0.5) { g.fill([[x0, y1, IT.WL], [x1, y1, IT.WL], [x1, y1, Z(y1)], [x0, y1, Z(y1)]], '#C9C0AC'); g.outline([[x0, y1, IT.WL], [x1, y1, IT.WL], [x1, y1, Z(y1)], [x0, y1, Z(y1)]], { w: 0.75, boil: false }); }
    // the surface: footways, lanes, the tram bed and rails
    const strip = (a, b, col) => g.fill(ys.map((y) => [a, y, Z(y)]).concat(ys.slice().reverse().map((y) => [b, y, Z(y)])), col);
    strip(x0, x1, IS.C.asph); strip(x0, x0 + 2.6, IS.C.pave); strip(x1 - 2.6, x1, IS.C.pave); strip(-55 - ox, -45 - ox, '#C9C2B2');
    const r = []; for (const c of [-52.6, -47.4]) for (const d of [-1, 1]) for (let i = 0; i < n; i++) { const a = g.p(c + d - ox, ys[i], Z(ys[i])), b = g.p(c + d - ox, ys[i + 1], Z(ys[i + 1])); r.push(a[0], a[1], b[0], b[1]); }
    g.segs2(r, '#7E776B', 0.5);
    // the far (west) parapet
    const par = (x) => { const top = ys.map((y) => [x, y, Z(y) + 1.0]); g.line(top, { w: 0.6, c: '#8C8576', boil: false }); const ps = []; for (const y of ys) { const a = g.p(x, y, Z(y)), b = g.p(x, y, Z(y) + 1.0); ps.push(a[0], a[1], b[0], b[1]); } g.segs2(ps, '#A39C8E', 0.4); };
    par(x0 + 0.3);
    par(x1 - 0.3);
  }, { name: 'ramp', under: 0 });
};

/* (-100,0) Süleymaniye. What it is: Sinan's great mosque for Süleyman the Magnificent on the third hill above the
   Golden Horn. Built of pale limestone: a square prayer hall whose central lead dome rises on a ring of windows, held
   by two half-domes on the qibla axis (east and west) and by buttressed tympanum walls on the sides, four little
   weight turrets at the dome's corners; in front of it (west) the arcaded courtyard with its row of small domes and
   the şadırvan in the middle; four minarets at the courtyard's corners, the two by the mosque taller with three
   balconies, the far two with two. The whole complex stands on a terrace above the city: a stone retaining wall with
   an arched gate and steps. Along its south edge the row of medrese cells, each with its own little dome. In the
   garden east of the mosque Süleyman's octagonal tomb among cypresses and turbaned gravestones. Below the terrace, the
   street of bean restaurants (KURU FASULYE) with their tables out, and on the east edge the avenue's ramp up to the
   Galata Bridge.
   Who is there: people at the terrace parapet looking out over the Horn, a family on the steps, a man washing at the
   fountain, students under the arcade, diners at the bean restaurants, a porter with a towering load of boxes, cats in
   the cemetery. What moves: walkers on the terrace and the street, the porter, pigeons, a flag. */

    g.fill(K.rect(10, -22, TX1 - 1, 4, TZ + 0.01), '#B9CF92'); g.grass(K.rect(10, -22, TX1 - 1, 4, TZ + 0.01), { dens: 0.7 });
    // the gate in the east wall, steps down to the street

  const lz = Math.log(g.a.z) + (Math.log(g.b.z) - Math.log(g.a.z)) * e - g.dip * Math.sin(Math.PI * e);
  APP.cam = { z: Math.exp(lz), cx: g.a.cx + (g.b.cx - g.a.cx) * e, cy: g.a.cy + (g.b.cy - g.a.cy) * e };
  APP.dirtyZoom = performance.now(); APP.lastInput = performance.now();
  if (t >= 1) { APP.cam = Object.assign({}, g.b); APP.glide = null; APP.phase = (APP.phase + 1) % 6; emit('arrive', Object.assign({}, g.b)); }
}
