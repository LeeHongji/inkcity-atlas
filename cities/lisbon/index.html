<script>
'use strict';
/* ---- ../../engine/00_core.js ---- */
/* core: projection, seeded noise, colour helpers.
   World units: 1 street pitch = 100 u (a tile is 74 u across with streets between). Origin = centre of the middle tile.
   +X runs to the lower right of the screen, +Y to the lower left, +Z straight up.
   "Wide px" are the pixels of the 1920x1080 wide view; every display list is stored in them. */
const SF = { tiles: [], tileBy: {}, actors: [], W: 1920, H: 1080 };
const AX = 2.92, AY = 1.59, VZ = 3.46, OX = 960, OY = 603;
const FPS = 30;

function prj(x, y, z) { return [OX + (x - y) * AX, OY + (x + y) * AY - (z || 0) * VZ]; }
/* wide px -> ground (z = 0) world coordinates */
function unprj(wx, wy) { const a = (wx - OX) / AX, b = (wy - OY) / AY; return [(a + b) / 2, (b - a) / 2]; }

/* ---------- deterministic randomness ---------- */
function hashi(n) {
  n = Math.imul(n ^ (n >>> 16), 0x7feb352d); n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  return ((n ^ (n >>> 16)) >>> 0);
}
function h1(n) { return hashi(n | 0) / 4294967296; }               // [0,1)
function h2(a, b) { return hashi((Math.imul(a | 0, 0x9e3779b1) ^ (b | 0)) + 0x632be5ab) / 4294967296; }
function hstr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function RNG(seed) {
  let a = (typeof seed === 'string' ? hstr(seed) : seed) >>> 0;
  const r = function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => lo + Math.floor((hi - lo + 1) * r());
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.sign = () => (r() < 0.5 ? -1 : 1);

}
/* smooth 1-D value noise in [-1,1] */
function vnoise(x, seed) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = h2(i, seed) * 2 - 1, b = h2(i + 1, seed) * 2 - 1;
  return a + (b - a) * u;
}
/* smooth 2-D value noise in [0,1] */
function vnoise2(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const k = (a, b) => h2(a * 7919 + b * 104729, seed);
  const a = k(ix, iy), b = k(ix + 1, iy), c = k(ix, iy + 1), d = k(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

/* ---------- small maths ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* ---------- colour ---------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + ((1 << 24) | (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255)).toString(16).slice(1); }
/* mix two hex colours */
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
/* darker / lighter in a paint-like way (towards a warm dark / towards paper) */
function shade(c, t) { return t >= 0 ? mix(c, '#3A3226', t) : mix(c, '#F6F3EA', -t); }

/* ---------- palette (approximate targets decoded from the reference) ---------- */
const C = {
  paper: '#F0EEE4', ink: '#2C271C', ink2: '#5E574A', ink3: '#8C8576',
  street: '#DDD7C9', streetMark: '#EDE8DC', dash: '#D9B44A', kerb: '#E9E5DA', pave: '#EAE7DC', paveScuff: '#F7F5EE',
  grass: '#B5CF8E', grassM: '#95B16B', grassD: '#788F53', grassL: '#C6DBA0',
  water: '#AACBE3', waterD: '#8BA3BD', waterL: '#C9DFEE', foam: '#F6F7F3',
  slab: '#D7C2A5', slabD: '#B4A58D', earth: '#C9B79B', earthD: '#AD9C82',
  wall: '#F1EFE8', wallM: '#E3E0D6', wallD: '#CFCCC1', stone: '#DAD6CA',
  red: '#BF5B49', redD: '#A34635', redL: '#CE7265', redDeep: '#713B2A', intl: '#D4553A', intlD: '#B9432C', intlL: '#E06A4C',
  navy: '#434D58', navyD: '#2F3740', glass: '#CFE0EA', glassD: '#9DB6C8',
  gold: '#DAAD45', goldM: '#B3A467', teal: '#5B9086', tealL: '#67AD8B', tealD: '#42706A',
  concrete: '#BCBEBA', concreteD: '#A1A39F', wood: '#C9A26B', woodD: '#A07C4C', trunk: '#A0714B', trunkD: '#7C5638',
  leaf: '#8DB868', leafD: '#6E9A50', leafL: '#A6CB7E', leafInk: '#4B6B36', cyp: '#4F7A4A', cypD: '#3C6038',
  dome: '#B9CDE0', domeD: '#93A9C4', sand: '#EBDDB5', pink: '#EDA9BD', pinkD: '#D98AA4', lav: '#B9A7D6', butter: '#EBD98C', mint: '#B5DCC2', sky: '#A9CDE6', rose: '#E7A9A0',
  white: '#F8F7F2', black: '#2A2622', yellow: '#E9C543', orange: '#E08A3C', purple: '#9A7CC0', blue: '#5E8FC9', blueD: '#3F6FA8', green: '#6FAE6A', brown: '#8A5A3A', brick: '#B5624B', brickD: '#96503E',
};
const SKIN = ['#F2D3B8', '#E8BE9A', '#D9A57B', '#C08A5E', '#A06B45', '#7A4E33', '#5F3D2A'];
const HAIR = ['#2B2420', '#3D2B1F', '#5A3A24', '#7B4E2C', '#A8743D', '#D9B560', '#B24A2E', '#8E8A84', '#1F2A3C'];
const CLOTH = ['#C9584B', '#DD8E4A', '#E6C24F', '#8FBF73', '#5FA58F', '#5F8FC9', '#3F5F8F', '#8E79C0', '#D98AA4', '#F0EDE4', '#3B3F47', '#B9A27D', '#7FB7D9', '#A4C66B', '#E7A9A0', '#6C7A89'];

/* ---- ../../engine/10_pen.js ---- */
/* the pen and the paint.
   A recorder (G) turns drawing calls into a display list stored in wide px.
   Display lists are replayed into canvases at any zoom; line weight is applied at replay time,
   so a drawing is re-inked crisply at every zoom instead of being scaled. */

/* main-contour screen width (px) as one smooth curve through 1.4 @x1, 2.25 @x3, 4.8 @x9.3 */
function lineW(zoom) { const x = Math.log(Math.max(zoom, 0.3)); return Math.exp(0.336 + 0.3154 * x + 0.1065 * x * x); }

const K_FILL = 0, K_RIB = 1, K_STROKE = 2, K_DISC = 3, K_SEGS = 4, K_TRIS = 5, K_RING = 6;
const BOIL_N = 6;

function polyArea(p) { let a = 0; for (let i = 0, n = p.length; i < n; i += 2) { const j = (i + 2) % n; a += p[i] * p[j + 1] - p[j] * p[i + 1]; } return a / 2; }
function pointInPoly(x, y, p) {
  let inside = false;
  for (let i = 0, n = p.length, j = n - 2; i < n; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function flat(pts) { const a = new Float32Array(pts.length * 2); for (let i = 0; i < pts.length; i++) { a[2 * i] = pts[i][0]; a[2 * i + 1] = pts[i][1]; } return a; }

/* Build one pen stroke: per-segment resample (corners are kept), sideways low-frequency wobble plus a tiny
   tremor, a speed-like width profile (a little heavier at the start, each end pools or flicks),
   and ends that overshoot or stop short by a hair. */
function mkRibbon(pts, seed, o) {
  const step = o.step || 2.6, wob = o.wob == null ? 1 : o.wob;
  let P = pts;
  if (o.close) P = pts.concat([pts[0]]);
  // end overshoot / undershoot (wide px)
  const r0 = h2(seed, 11), r1 = h2(seed, 12);
  const ext = o.close ? [0, 0] : [(o.ext == null ? 1 : o.ext) * (r0 < 0.18 ? -0.45 * h2(seed, 13) : 0.15 + 0.75 * r0 * r0),
                                  (o.ext == null ? 1 : o.ext) * (r1 < 0.18 ? -0.45 * h2(seed, 14) : 0.15 + 0.75 * r1 * r1)];
  const xs = [], ys = [], ss = [];
  let s = 0;
  for (let i = 0; i < P.length - 1; i++) {
    let ax = P[i][0], ay = P[i][1], bx = P[i + 1][0], by = P[i + 1][1];
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    if (len < 1e-4) continue;
    if (i === 0 && ext[0]) { ax -= dx / len * ext[0]; ay -= dy / len * ext[0]; }
    if (i === P.length - 2 && ext[1]) { bx += dx / len * ext[1]; by += dy / len * ext[1]; }
    const L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(L / step));
    for (let k = (xs.length ? 1 : 0); k <= n; k++) { const t = k / n; xs.push(ax + (bx - ax) * t); ys.push(ay + (by - ay) * t); ss.push(s + L * t); }
    s += L;
  }
  const n = xs.length;
  if (n < 2) return null;
  const c = new Float32Array(n * 2), nr = new Float32Array(n * 2), w = new Float32Array(n);
  const amp = wob * Math.min(0.55, 0.2 + 0.004 * s), lam = 16 + 10 * h2(seed, 3);
  const startHeavy = h2(seed, 5) < 0.6, endKind = h2(seed, 6);          // <0.45 flick, <0.7 pool, else plain
  const taper = o.taper == null ? 1 : o.taper;
  for (let i = 0; i < n; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
    let tx = xs[i1] - xs[i0], ty = ys[i1] - ys[i0];
    if (o.close && (i === 0 || i === n - 1)) { tx = xs[1] - xs[n - 2]; ty = ys[1] - ys[n - 2]; }
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const nx = -ty, ny = tx;
    const si = ss[i];
    // fade the wobble out at closed-loop seams so the loop meets itself
    const edge = o.close ? Math.min(1, Math.min(si, s - si) / 4) : 1;
    const off = edge * (amp * vnoise(si / lam, seed) + 0.06 * wob * vnoise(si / 2.3, seed + 7));
    c[2 * i] = xs[i] + nx * off; c[2 * i + 1] = ys[i] + ny * off;
    nr[2 * i] = nx; nr[2 * i + 1] = ny;

    if (!o.close && taper) {
      if (startHeavy) wi *= 1 + 0.28 * taper * Math.max(0, 1 - si / 2.2);
      const e = s - si;
      if (endKind < 0.45) wi *= 1 - 0.6 * taper * Math.max(0, 1 - e / 3.5);
      else if (endKind < 0.7) wi *= 1 + 0.3 * taper * Math.max(0, 1 - e / 1.8);
      if (o.flick) wi *= Math.min(1, 0.25 + e / (0.5 * s + 0.01)) * Math.min(1, 0.4 + si / (0.3 * s + 0.01));
    }
    w[i] = wi;
  }
  let bo = null;
  if (o.boil) {
    bo = new Float32Array(BOIL_N * n);
    for (let k = 0; k < BOIL_N; k++) for (let i = 0; i < n; i++) {
      bo[k * n + i] = 0.5 * vnoise(ss[i] / 8.5 + 31 * k, seed + 101 + k) + 0.22 * vnoise(ss[i] / 2.2, seed + 301 + k * 17);
    }
  }
  return { k: K_RIB, c, n: nr, w, len: s, bo };
}

class G {
  constructor(seed) {
    this.cmds = []; this.seed = typeof seed === 'string' ? hstr(seed) : (seed | 0); this.cnt = 0;
    this.ox = 0; this.oy = 0; this.oz = 0; this.stack = [];
    this.bb = [1e9, 1e9, -1e9, -1e9];
    this.ink = C.ink; this.boilP = 0.5; this.swap = false;
  }
  /* world -> wide px (with the recorder's current origin) */
  p(x, y, z) { return this.swap ? prj(this.ox + y, this.oy + x, this.oz + (z || 0)) : prj(this.ox + x, this.oy + y, this.oz + (z || 0)); }
  P(pts) { const o = new Array(pts.length); for (let i = 0; i < pts.length; i++) o[i] = this.p(pts[i][0], pts[i][1], pts[i][2]); return o; }
  /* draw with a shifted origin; swap=true mirrors the drawing across the X=Y diagonal (turns a +X-facing thing to face +Y) */
  at(x, y, z, fn, swap) {
    this.stack.push([this.ox, this.oy, this.oz, this.swap]);
    if (this.swap) { this.ox += y; this.oy += x; } else { this.ox += x; this.oy += y; }
    this.oz += (z || 0); if (swap) this.swap = !this.swap;
    fn(this);
    const s = this.stack.pop(); this.ox = s[0]; this.oy = s[1]; this.oz = s[2]; this.swap = s[3];
  }
  _bb(a) { const b = this.bb; for (let i = 0; i < a.length; i += 2) { if (a[i] < b[0]) b[0] = a[i]; if (a[i] > b[2]) b[2] = a[i]; if (a[i + 1] < b[1]) b[1] = a[i + 1]; if (a[i + 1] > b[3]) b[3] = a[i + 1]; } }
  _seed() { return (this.seed + Math.imul(++this.cnt, 2654435761)) | 0; }

  /* ----- wide-px (2-D) primitives ----- */
  fill2(pts, col, exact) {
    if (!col || pts.length < 3) return;
    let a = flat(pts);
    // a hair of hand-registration: vertices move by a position-keyed amount, so shared edges stay shared
    // (exact: off, for parts smaller than the wobble itself, such as a face)
    if (!exact) for (let i = 0; i < a.length; i += 2) { const k = Math.round(a[i] * 8) * 4099 + Math.round(a[i + 1] * 8); a[i] += (h2(k, 71) - 0.5) * 0.3; a[i + 1] += (h2(k, 72) - 0.5) * 0.3; }
    if (polyArea(a) < 0) { const r = new Float32Array(a.length); for (let i = 0, n = a.length / 2; i < n; i++) { r[2 * i] = a[2 * (n - 1 - i)]; r[2 * i + 1] = a[2 * (n - 1 - i) + 1]; } a = r; }
    this._bb(a); this.cmds.push({ k: K_FILL, p: a, c: col });
  }
  line2(pts, o) {
    o = o || {};
    if (pts.length < 2) return;
    const seed = this._seed(), wt = o.w == null ? 1 : o.w;
    const boil = o.co ? false : (o.boil == null ? (wt >= 0.7 && h2(seed, 91) < this.boilP) : !!o.boil);
    const r = mkRibbon(pts, seed, { close: o.close, boil, wob: o.wob, ext: o.ext, taper: o.taper, flick: o.flick, step: o.step });
    if (!r) return;
    r.col = o.c || this.ink; r.wt = wt; r.cons = o.cons !== false; if (o.co) r.co = true;
    this._bb(r.c); this.cmds.push(r);
  }
  fine2(pts, o) {
    o = o || {};
    if (pts.length < 2) return;
    const a = flat(o.close ? pts.concat([pts[0]]) : pts);
    this._bb(a); this.cmds.push({ k: K_STROKE, p: a, col: o.c || this.ink, wt: o.w == null ? 0.5 : o.w, cons: o.cons !== false });
  }
  /* outline of a polygon: each straight run is its own stroke, so corners are joined by hand */
  outline2(pts, o) {
    o = o || {};
    const n = pts.length; if (n < 2) return;
    const closed = o.open ? false : true;
    const corner = (i) => {
      const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
      const ux = b[0] - a[0], uy = b[1] - a[1], vx = c[0] - b[0], vy = c[1] - b[1];
      const d = (ux * vx + uy * vy) / ((Math.hypot(ux, uy) || 1) * (Math.hypot(vx, vy) || 1));
      return d < 0.82;
    };
    let starts = [];
    for (let i = 0; i < n; i++) if ((closed || (i > 0 && i < n - 1)) && corner(i)) starts.push(i);
    if (!closed) {
      let run = [pts[0]];
      for (let i = 1; i < n; i++) { run.push(pts[i]); if (starts.indexOf(i) >= 0) { this.line2(run, o); run = [pts[i]]; } }
      if (run.length > 1) this.line2(run, o);
      return;
    }
    if (starts.length === 0) { this.line2(pts, Object.assign({}, o, { close: true })); return; }
    for (let k = 0; k < starts.length; k++) {
      const a = starts[k], b = starts[(k + 1) % starts.length], run = [];
      let i = a; run.push(pts[i]);
      do { i = (i + 1) % n; run.push(pts[i]); } while (i !== b);
      if (o.skip && o.skip(k, run)) continue;
      this.line2(run, o);
    }
  }
  poly2(pts, col, o) { this.fill2(pts, col); if (o !== false) this.outline2(pts, o); }

  ring2(pt, r, o) { o = o || {}; this._bb([pt[0] - r, pt[1] - r, pt[0] + r, pt[1] + r]); this.cmds.push({ k: K_RING, x: pt[0], y: pt[1], r, col: o.c || this.ink, wt: o.w == null ? 0.6 : o.w, cons: true }); }
  /* batches of tiny marks */
  segs2(arr, col, wt, cons) { if (!arr.length) return; for (let i = 0; i < arr.length; i += 2400) { const a = Float32Array.from(arr.slice(i, i + 2400)); this._bb(a); this.cmds.push({ k: K_SEGS, p: a, col, wt: wt == null ? 0.5 : wt, cons: !!cons }); } }
  tris2(arr, col, cons) { if (!arr.length) return; for (let i = 0; i < arr.length; i += 2400) { const a = Float32Array.from(arr.slice(i, i + 2400)); this._bb(a); this.cmds.push({ k: K_TRIS, p: a, c: col, cons: !!cons }); } }

  /* ----- world (3-D) versions ----- */
  fill(pts, col) { this.fill2(this.P(pts), col); }
  line(pts, o) { this.line2(this.P(pts), o); }
  fine(pts, o) { this.fine2(this.P(pts), o); }
  outline(pts, o) { this.outline2(this.P(pts), o); }
  poly(pts, col, o) { this.poly2(this.P(pts), col, o); }

  /* ----- marks inside paint (all take a wide-px polygon) ----- */
  _scatter(poly, n, seed, fn) {
    const a = flat(poly); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < a.length; i += 2) { x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]); y0 = Math.min(y0, a[i + 1]); y1 = Math.max(y1, a[i + 1]); }
    const area = Math.abs(polyArea(a));
    const cnt = typeof n === 'function' ? n(area) : n;
    const r = RNG(seed);
    let made = 0, tries = 0;
    while (made < cnt && tries < cnt * 12) {
      tries++;
      const x = x0 + (x1 - x0) * r(), y = y0 + (y1 - y0) * r();
      if (!pointInPoly(x, y, a)) continue;
      fn(x, y, r, a); made++;
    }
  }
  /* pale dry-brush scuffs: short strokes along dir (radians, screen) */
  scuff2(poly, o) {
    o = o || {};
    const dir = o.dir == null ? -0.5 : o.dir, len = o.len || 5, segs = [];
    const dens = o.dens == null ? 1 : o.dens;
    this._scatter(poly, o.n || ((A) => A / 55 * dens), this._seed(), (x, y, r, a) => {
      const l = len * (0.4 + r()), d = dir + (r() - 0.5) * (o.spread == null ? 0.25 : o.spread);
      const ex = x + Math.cos(d) * l, ey = y + Math.sin(d) * l;
      if (!pointInPoly(ex, ey, a)) return;
      segs.push(x, y, ex, ey);
    });
    this.segs2(segs, o.c || C.paveScuff, o.w == null ? 0.55 : o.w);
  }
  /* grass: dark tapered blades in groups of two or three, plus a few lighter ticks */
  grass2(poly, o) {
    o = o || {};
    const dens = o.dens == null ? 1 : o.dens, dark = [], light = [];
    this._scatter(poly, (A) => A / 70 * dens, this._seed(), (x, y, r) => {

/* a door with a stone surround and a fanlight */
LX.door = function (g, face, p, a0, a1, z0, h, col) {

  const q = K.on(face, p + 0.06, a0, a1, z0, z0 + h); g.fill(q, col || '#6B4A33');

/* washing on a line strung along a face at height z, d out from the wall: shirts, towels, sheets */

  const cols = ['#F7F5EF', '#E2483D', '#3F8FD2', '#F2C230', '#E77FB3', '#7FB7D9', '#F7F5EF', '#5DB26A', '#E9DCC0'];
  const fl = face === 'L' ? 1 : -1;

/* ---------------- roofs ---------------- */
/* a terracotta hip roof with tile channels running down the two slopes we see */
LX.roof = function (g, x0, y0, x1, y1, z, h, o) {
  o = o || {}; const col = o.col || LC.roof, ov = o.over == null ? 0.5 : o.over;

  K.hip(g, x0, y0, x1, y1, z, h, col, { ridge: rl, c: o.c || LC.roofD, w: 0.8 });
  const xm = (x0 + x1) / 2, ym = (y0 + y1) / 2, alongX = x1 - x0 >= y1 - y0;
  const ax = alongX ? xm - rl / 2 : xm, bx = alongX ? xm + rl / 2 : xm, ay = alongX ? ym : ym - rl / 2, by = alongX ? ym : ym + rl / 2;
  const segs = [], sp = 0.8;
  for (let x = x0 + sp * 0.6; x < x1 - sp * 0.3; x += sp) {          // the lit slope facing +y
    const t = Math.min(1, (x - x0) / Math.max(0.01, ax - x0), (x1 - x) / Math.max(0.01, x1 - bx)) * 0.96;
    const a = g.p(x, y1, z), b = g.p(x, lerp(y1, alongX ? ym : by, t), z + h * t); segs.push(a[0], a[1], b[0], b[1]);
  }
  for (let y = y0 + sp * 0.6; y < y1 - sp * 0.3; y += sp) {          // the slope facing +x
    const t = Math.min(1, (y - y0) / Math.max(0.01, ay - y0), (y1 - y) / Math.max(0.01, y1 - by)) * 0.96;
    const a = g.p(x1, y, z), b = g.p(lerp(x1, alongX ? bx : xm, t), y, z + h * t); segs.push(a[0], a[1], b[0], b[1]);

};
/* a white chimney with a little hood */
LX.chimney = function (g, x, y, z) {
  K.box(g, x - 0.5, y - 0.5, x + 0.5, y + 0.5, z, z + 2.0, { t: '#E9E4D8', l: '#F4F0E6', r: '#DCD5C5' }, { w: 0.45, boil: false });
  K.box(g, x - 0.75, y - 0.75, x + 0.75, y + 0.75, z + 2.0, z + 2.35, { t: '#D9D2C2', l: '#E9E4D8', r: '#D3CBBA' }, { w: 0.4, boil: false });
};

/* ---------------- houses ---------------- */
/* d: {x0,y0,x1,y1, z base, n storeys, col, az (azulejo look on the upper floors), roof 'hip'|'flat'|'none', shop word,
   sc shop colour, seed, wash: true, bal: 0..1 balconies, faces 'LR' (which faces get openings), door 'L'|'R'} */
LX.STOREY = 4.0; LX.GF = 4.6;

  const R = RNG((d.seed || 1) * 97 + 13), z = d.z || 0, n = d.n || 3, H = LX.GF + (n - 1) * LX.STOREY + 1.0, zt = z + H;
  const col = d.col || R.pick(LX.FACADE), faces = d.faces || 'LR';
  const tones = d.az ? { t: '#E8E2D4', l: LX.AZ[d.az][0], r: shade(LX.AZ[d.az][0], 0.1) } : { t: shade(col, -0.18), l: col, r: shade(col, 0.11) };
  g.boilP = 0.3;
  K.box(g, d.x0, d.y0, d.x1, d.y1, z, zt, tones, { w: 0.85 });
  const shut = R() < 0.35 ? R.pick(['#4F7A5E', '#5E7E9A', '#7A5A3C', '#3F6A7A']) : null;
  for (const face of ['L', 'R']) {
    if (faces.indexOf(face) < 0) continue;
    const p = face === 'L' ? d.y1 : d.x1, a0 = face === 'L' ? d.x0 : d.y0, a1 = face === 'L' ? d.x1 : d.y1, len = a1 - a0;
    if (d.az) { LX.azulejo(g, face, p, a0, a1, z + LX.GF - 0.2, zt - 1.0, d.az, d.seed || 1); g.fill(K.on(face, p + 0.04, a0, a1, z, z + 0.9), '#DAD3C4'); }
    // the cornice and the stone band over the ground floor
    g.fill(K.on(face, p + 0.05, a0, a1, zt - 1.0, zt - 0.6), '#F6F2E8');
    g.fill(K.on(face, p + 0.05, a0, a1, z + LX.GF - 0.35, z + LX.GF - 0.1), '#EEE8DA');
    const nb = Math.max(1, Math.round(len / 3.1)), bw = Math.min(1.35, len / nb * 0.42);
    const doorBay = d.door === face ? (R.int(0, nb - 1)) : -1;
    // ground floor: the door, a shopfront or small windows
    const shopHere = d.shop && face === (d.shopFace || (len > 5 ? face : 'L'));
    for (let b = 0; b < nb; b++) {
      const m = a0 + len * (b + 0.5) / nb;
      if (b === doorBay) LX.door(g, face, p, m - 0.8, m + 0.8, z, 3.3, R.pick(['#6B4A33', '#3F5F4F', '#7A2E2A', '#2F4A6A']));
      else if (shopHere) { const q = K.on(face, p + 0.06, m - bw * 0.95, m + bw * 0.95, z + 0.5, z + 3.2); g.fill(q, '#8FA6B0'); g.fill(K.on(face, p + 0.07, m - bw * 0.95, m + bw * 0.95, z + 0.5, z + 1.1), d.sc || '#5A4A3C'); g.outline(q, { w: 0.35, c: '#3A3128', boil: false, ext: 0 }); }
      else LX.win(g, face, p, m - bw * 0.6, m + bw * 0.6, z + 1.4, z + 3.3, { glass: '#6A7F8C' });
    }
    if (shopHere) K.sign(g, face, p, a0 + 0.5, a1 - 0.5, z + 3.45, z + 4.25, d.sc || '#2F4A3A', d.shop, { ink: '#F7F1DC' });
    // upper floors: tall French windows, the first floor with balconies

/* ---------------- terraces, parapets, stairs ---------------- */
/* raised ground: a block of stone retaining walls with coursing, its top paved (o.top) */
LX.terrace = function (g, x0, y0, x1, y1, z0, z1, o) {
  o = o || {}; const top = o.top || LC.calc;
  g.boilP = 0.2;

  const segs = [];

    const k = Math.round(z / 0.9);
    for (let x = x0 + (k % 2 ? 0.8 : 1.8); x < x1 - 0.5; x += 2.0) { const p = g.p(x, y1, z), q = g.p(x, y1, Math.min(z1, z + 0.9)); segs.push(p[0], p[1], q[0], q[1]); }
    for (let y = y0 + (k % 2 ? 0.8 : 1.8); y < y1 - 0.5; y += 2.0) { const p = g.p(x1, y, z), q = g.p(x1, y, Math.min(z1, z + 0.9)); segs.push(p[0], p[1], q[0], q[1]); }
  }

  if (o.scuff !== false) g.scuff(K.rect(x0, y0, x1, y1, z1), { dir: Math.atan2(AY, AX), len: 2.2, c: LC.calcS, dens: 0.35, w: 0.45, spread: 0.6 });
};
/* a low parapet wall with a white coping along a terrace edge at height z: face 'L' (along x at y = p) or 'R' (along y) */
LX.parapet = function (g, face, p, a0, a1, z, o) {
  o = o || {}; const t = 0.6, h = o.h || 1.2, col = o.col || LC.wallT;
  if (face === 'L') K.box(g, a0, p - t, a1, p, z, z + h, { t: '#F7F4EC', l: col, r: shade(col, 0.1) }, { w: 0.6, boil: false });
  else K.box(g, p - t, a0, p, a1, z, z + h, { t: '#F7F4EC', l: col, r: shade(col, 0.1) }, { w: 0.6, boil: false });

/* a flight of steps climbing from z0 to z1. axis 'y': it climbs towards -y over [y0, y1] (risers face +y, lit);
   axis 'x': it climbs towards -x (risers face +x). Side walls on the visible side. */
LX.steps = function (g, x0, y0, x1, y1, z0, z1, axis, o) {
  o = o || {}; const n = Math.max(2, Math.round((z1 - z0) / 0.45)), tread = o.tread || '#EEE9DD', riser = o.riser || '#CFC6B2';
  if (axis === 'y') {
    const L = y1 - y0;
    for (let i = n - 1; i >= 0; i--) {          // from the top step down to the bottom one
      const ya = y0 + L * i / n, yb = y0 + L * (i + 1) / n, zt = z1 - (z1 - z0) * i / n, zr = z1 - (z1 - z0) * (i + 1) / n;
      g.fill(K.rect(x0, ya, x1, yb, zt), tread); g.fill([[x0, yb, zr], [x1, yb, zr], [x1, yb, zt], [x0, yb, zt]], riser);

  } else {
    const L = x1 - x0;

      const xa = x0 + L * i / n, xb = x0 + L * (i + 1) / n, zt = z1 - (z1 - z0) * i / n, zr = z1 - (z1 - z0) * (i + 1) / n;
      g.fill(K.rect(xa, y0, xb, y1, zt), tread); g.fill([[xb, y0, zr], [xb, y1, zr], [xb, y1, zt], [xb, y0, zt]], shade(riser, 0.06));

/* ---------------- pavements ---------------- */
/* calçada portuguesa: white limestone with black basalt wave bands (Rossio's "mar largo"). axis: the waves run along x or y */
LX.waves = function (g, x0, y0, x1, y1, o) {
  o = o || {}; const axis = o.axis || 'x', amp = o.amp || 2.2, wl = o.wl || 9, band = o.band || 2.1, gap = o.gap || 4.4, z = o.z || 0.02;
  g.fill(K.rect(x0, y0, x1, y1, z - 0.01), LC.calc);
  const A0 = axis === 'x' ? x0 : y0, A1 = axis === 'x' ? x1 : y1, B0 = axis === 'x' ? y0 : x0, B1 = axis === 'x' ? y1 : x1;
  const W = (a, b) => (axis === 'x' ? [a, b, z] : [b, a, z]);
  for (let b = B0 - amp; b < B1 + amp; b += gap) {
    const top = [], bot = [];
    const n = Math.max(24, Math.ceil((A1 - A0) / wl * 12));
    for (let i = 0; i <= n; i++) {
      const a = lerp(A0, A1, i / n), off = Math.sin((a - A0) / wl * TAU) * amp;
      top.push(W(a, clamp(b + off, B0, B1))); bot.push(W(a, clamp(b + off + band, B0, B1)));
    }
    g.fill(top.concat(bot.reverse()), LC.basalt);
  }
  g.scuff(K.rect(x0, y0, x1, y1, z), { dir: Math.atan2(AY, AX), len: 1.4, c: '#FBFAF5', dens: 0.25, w: 0.4, spread: 1 });
};
/* a plain calçada pavement: white with a black border line (o.edge: which edges get it) */
LX.pave = function (g, x0, y0, x1, y1, o) {
  o = o || {}; const z = o.z || 0;
  g.fill(K.rect(x0, y0, x1, y1, z), o.col || LC.calc);
  g.scuff(K.rect(x0, y0, x1, y1, z), { dir: Math.atan2(AY, AX), len: 1.8, c: LC.calcS, dens: 0.3, w: 0.4, spread: 0.8 });
  const e = o.edge || '', inset = 0.8, bw = 0.34;
  if (e.indexOf('n') >= 0) g.fill(K.rect(x0, y0 + inset, x1, y0 + inset + bw, z + 0.01), LC.basalt);
  if (e.indexOf('s') >= 0) g.fill(K.rect(x0, y1 - inset - bw, x1, y1 - inset, z + 0.01), LC.basalt);
  if (e.indexOf('w') >= 0) g.fill(K.rect(x0 + inset, y0, x0 + inset + bw, y1, z + 0.01), LC.basalt);
  if (e.indexOf('e') >= 0) g.fill(K.rect(x1 - inset - bw, y0, x1 - inset, y1, z + 0.01), LC.basalt);
};

/* ---------------- plants ---------------- */
/* a jacaranda in June bloom: a dark crooked trunk, a wide lacy cloud of violet with paler flecks */
LX.jacaranda = function (g, x, y, o) {
  o = o || {}; const r = (o.r || 4.6) * 3.3, h = o.h == null ? 5.0 : o.h, f = g.p(x, y, o.z || 0), top = [f[0] + 0.6, f[1] - h * VZ], R = RNG(o.seed || Math.round(x * 37 + y * 11 + 5));

  g.fill2([[f[0] - 0.9, f[1]], [f[0] + 0.9, f[1]], [top[0] + 0.55, top[1]], [top[0] - 0.55, top[1]]], '#4E3E36');
  g.line2([[top[0], top[1] + 1.4], [top[0] - r * 0.4, top[1] - r * 0.3]], { w: 0.8, c: '#4E3E36', boil: false }); g.line2([[top[0], top[1] + 1], [top[0] + r * 0.42, top[1] - r * 0.4]], { w: 0.75, c: '#4E3E36', boil: false });
  const cy = top[1] - r * 0.5, lobes = [[-r * 0.48, r * 0.06, r * 0.56], [r * 0.46, 0, r * 0.55], [0, -r * 0.3, r * 0.62], [r * 0.02, r * 0.18, r * 0.5]];
  lobes.map(([dx, dy, rr]) => { const pts = []; const a0 = R() * TAU; for (let k = 0; k < 10; k++) { const a = a0 + TAU * k / 10, q = rr * (0.84 + R() * 0.26); pts.push([top[0] + dx + Math.cos(a) * q, cy + dy + Math.sin(a) * q * 0.78]); } return pts; })
    .map((b) => ({ b, cy: b.reduce((s, p) => s + p[1], 0) / b.length })).sort((p, q) => p.cy - q.cy).forEach(({ b }) => {
      const cxx = b.reduce((s, p) => s + p[0], 0) / b.length, cyy = b.reduce((s, p) => s + p[1], 0) / b.length;
      g.fill2(b, col);
      const sh = b.filter((p) => (p[0] - cxx) * 0.5 + (p[1] - cyy) > 0); if (sh.length > 2) g.fill2(sortAround(sh.concat([[cxx, cyy + 1]])), dk);
      g.outline2(b, { c: ink, w: 0.55, ext: 0.2 });
    });
  const fl = []; for (let i = 0; i < 22; i++) { const a = R() * TAU, d = R() * r * 0.8, px = top[0] + Math.cos(a) * d, py = cy + Math.sin(a) * d * 0.72; fl.push(px - 0.35, py, px + 0.35, py); }
  g.segs2(fl, '#D9CCF2', 0.7);
  const tw = []; for (let i = 0; i < 10; i++) { const a = R() * TAU, d = R() * r * 0.7, px = top[0] + Math.cos(a) * d, py = cy + Math.sin(a) * d * 0.7; tw.push(px, py, px + 0.9, py - 0.5); }
  g.segs2(tw, ink, 0.4);
  if (o.fallen) { const pts = []; for (let i = 0; i < 26; i++) { const a = R() * TAU, d = Math.sqrt(R()) * (o.r || 4.6) * 1.1, q = g.p(x + Math.cos(a) * d, y + Math.sin(a) * d, o.z || 0); pts.push(q[0] - 0.3, q[1], q[0] + 0.3, q[1]); } g.segs2(pts, col, 0.6); }
};

};
/* a static actor (a flag, a garland over a square): layer top, present with the place */
LX.still = function (T, x, y, z, fn, o) {
  return T.actor(Object.assign({ sample: 5, grow: false, at() { return { x, y, z, key: 0 }; }, draw: fn }, o || {}));
};

   single track beside it, then turns into the lane. Phased so the meeting happens in the Alfama shot.

/* ---- src/tiles/streets.js ---- */
/* Lisbon's streets, the riverside and the Tagus (one map-wide tile).
   Four streets between the places, each grey basalt setts between white calçada pavements with a black border line;
   tram 28's double track runs along the ones it uses (the trams' poles reach for a wire left undrawn out here: posts
   along the streets became sprites that dragged half the map into the sprite layer). Zebra crossings at the junctions.
   Along the south edge the riverside promenade (Ribeira das Naus): pale limestone, lamps, benches, people strolling,
   fishermen at the edge; then the stone quay wall and the river at z -3, cut like a diorama along the map's near edges.
   On the water: two orange cacilheiros shuttle to their pier, a fragata with an ochre sail and a white yacht run
   along the river (under the bridge, which is its own tile). Traffic: LXT (src/37_traffic.js). */
const LS = { in: 37, out: 63, end: 152, quay: 137, edge: 146, wz: -3, riv: 222, rx: 176, rd: 10 };

SF.tile('streets', 0, 0, { order: -99 }, function (T) {
  const S = LS, ASPH = LC.setts;
  const DX = Math.atan2(AY, AX), DY = Math.atan2(AY, -AX);
  T.ground(function (g) {
    g.boilP = 0.12;
    /* the river: water, its crests, the quay wall above it, the cut sections at the map's near edges */
    const W = [[-S.rx, S.edge, S.wz], [S.rx, S.edge, S.wz], [S.rx, S.riv, S.wz], [-S.rx, S.riv, S.wz]];
    g.fill(W, LC.water);
    for (let k = 0; k < 6; k++) { const y0 = S.edge + 4 + k * 12; g.water([[-S.rx, y0, S.wz], [S.rx, y0, S.wz], [S.rx, y0 + 10, S.wz], [-S.rx, y0 + 10, S.wz]], { dens: 0.5 }); }
    g.fill([[-S.rx, S.riv, S.wz], [S.rx, S.riv, S.wz], [S.rx, S.riv, S.wz - 2.2], [-S.rx, S.riv, S.wz - 2.2]], '#5E8F98');
    g.fill([[S.rx, S.edge, S.wz], [S.rx, S.riv, S.wz], [S.rx, S.riv, S.wz - 2.2], [S.rx, S.edge, S.wz - 2.2]], '#4E7F88');
    g.fill([[S.rx, S.edge, 0], [S.rx, S.edge, S.wz - 2.2], [S.rx, S.edge - 0.01, S.wz - 2.2]], '#4E7F88');

   Depth: the deck is cut into pieces of ~15 u (one object each, under: 11) so a boat half under it is right at both
   faces; each tower is two objects, the far leg behind the deck, the near leg (with the beams) in front of it. */
SF.tile('ponte', -50, 185, { rim: 70, castAt: 150, shared: true, half: 12 }, function (T) {
  const RED = '#B8452F', REDT = { t: '#C9583F', l: '#B8452F', r: '#9A3726' }, DZ = 13, TZ = 34, Y0 = -48, Y1 = 52, TY = [-23, 23], HW = 4.4;

    if (y <= TY[0]) return lerp(DZ + 0.5, TZ, (y - (Y0 + 4)) / (TY[0] - (Y0 + 4)));
    if (y >= TY[1]) return lerp(TZ, DZ + 0.5, (y - TY[1]) / (Y1 - TY[1]));
    const u = (y - TY[0]) / (TY[1] - TY[0]); return DZ + 1.0 + (TZ - DZ - 1.0) * Math.pow(2 * u - 1, 2);
  };
  /* the anchorage block on the promenade */
  T.obj([-6.5, -50, 6.5, -42], function (g) {
    K.box(g, -6.5, -50, 6.5, -42, 0, DZ + 0.8, { t: '#D9D3C6', l: '#E4DED2', r: '#CFC8B9' }, { w: 0.85 });
    const s = []; for (let z = 2.5; z < DZ; z += 2.6) { const a = g.p(-6.5, -42, z), b = g.p(6.5, -42, z), c = g.p(6.5, -50, z); s.push(a[0], a[1], b[0], b[1], b[0], b[1], c[0], c[1]); } g.segs2(s, '#B9B2A2', 0.3);
  }, { name: 'anchorage' });

      cable(-HW);

   striped canopy; long trestle tables and benches; two sardine braziers; stalls selling beer, bifanas and basil pots;
   an altar to the saint with flowers and candles; a tall mast with flags; garlands criss-crossing the square.
   Who: a marcha of dancers in matching costume, in pairs carrying flowered arches round the square; couples dancing
   on the open floor, turning; people at the tables eating sardines on bread; the grillers fanning the coals; queues at
   the stalls; children with paper balloons; the old ladies watching from balconies.

        let near = 0; for (const ts of tramsInLane(t)) near = Math.max(near, 1 - Math.abs(ts - s) / 11);
        const press = smooth(clamp(near * 1.6, 0, 1));
        const p = LXT.at(LP, s), x = p.x - 100, y = p.y - 100 + lerp(v0, -(LW - 0.85), press);   // north = smaller y
        const walkDir = (dirS > 0) !== back ? 2 : 0;                            // along the lane: +s runs west (screen up-left)
        if (press > 0.2) return { x, y, key: 'p', dir: 1, pose: 'stand' };
        const ph = Math.floor(((t * speed) / 2.4 % 1) * 8);
        return { x, y, key: walkDir + '.' + ph, dir: walkDir, pose: 'walk', ph: ph / 8 };
      },
      draw(g, st) {
        LX.person(g, 0, 0, 0, Object.assign({}, who, { dir: st.dir, pose: st.pose, ph: st.ph || 0, hands: st.pose === 'stand' ? [[-1.2, -8.6], [1.4, -8.8]] : undefined }));
        // an invisible tail below the feet: it makes this person's box reach the planter wall in front of the lane, as the
        // trams' boxes do, so both are drawn in that slot and ordered by depth between themselves
        const o = g.p(0, 0, 0); g.fill2([[o[0] - 0.2, o[1] + 52], [o[0] + 0.2, o[1] + 52], [o[0], o[1] + 51.6]], 'rgba(0,0,0,0)', true);
      } });
  });
});

  return { mode: APP.mode, z: cam.z, cx: cam.cx, cy: cam.cy, pz, w: cv.clientWidth, h: cv.clientHeight, paused: !!APP.paused, gliding: !!APP.glide };
};
SF.toScreen = function (wx, wy, v) { v = v || SF.view(); return [(wx - v.cx) * v.pz + v.w / 2, (wy - v.cy) * v.pz + v.h / 2]; };
/* the map's extent in wide px (every tile, satellites included) */
SF.boxes = () => SF.live.map((t) => t.bb.slice());              // every tile's and satellite's wide-px box
SF.extent = function () { let a = [1e9, 1e9, -1e9, -1e9]; for (const t of SF.live) { a[0] = Math.min(a[0], t.bb[0]); a[1] = Math.min(a[1], t.bb[1]); a[2] = Math.max(a[2], t.bb[2]); a[3] = Math.max(a[3], t.bb[3]); } return a; };
/* glide the explore camera to a camera {z, cx, cy}, a shot's name, or WIDE; it pulls back on long trips */
SF.glideTo = function (to, ms) {
  if (typeof to === 'string') to = shotByName(to) || WIDE;
  if (APP.mode !== 'explore') toExplore(false);
  const b = { z: to.z, cx: to.cx, cy: to.cy }; clampCam(b);
  const a = { z: APP.cam.z, cx: APP.cam.cx, cy: APP.cam.cy }, d = Math.hypot(b.cx - a.cx, b.cy - a.cy);
  const fit = 1920 * 0.7 / Math.max(1, d), lo = Math.min(a.z, b.z), dip = Math.max(0, Math.log(lo / Math.max(fit, WIDE.z)));
  APP.glide = { a, b, dip, t0: performance.now(), ms: ms || clamp(700 + d * 0.5 + dip * 260, 700, 1600) };
  APP.lastInput = performance.now();
};
function stepGlide() {
  const g = APP.glide, t = clamp((performance.now() - g.t0) / g.ms, 0, 1), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lz = Math.log(g.a.z) + (Math.log(g.b.z) - Math.log(g.a.z)) * e - g.dip * Math.sin(Math.PI * e);
  APP.cam = { z: Math.exp(lz), cx: g.a.cx + (g.b.cx - g.a.cx) * e, cy: g.a.cy + (g.b.cy - g.a.cy) * e };
  APP.dirtyZoom = performance.now(); APP.lastInput = performance.now();
  if (t >= 1) { APP.cam = Object.assign({}, g.b); APP.glide = null; APP.phase = (APP.phase + 1) % 6; emit('arrive', Object.assign({}, g.b)); }
}
SF.pause = () => { if (!APP.paused) togglePause(); };
SF.resume = () => { if (APP.paused) togglePause(); };
SF.togglePause = () => togglePause();
SF.replay = () => replay_();

</script>
