name: canal-town
expected_outcome: |
  One self-contained index.html of a hand-inked isometric canal town: a single canal crossing the places with stone
  bridges and boats moving along it, a café square, a church with a bell tower, narrow lanes. It builds itself, tours
  with hard cuts including a close-up, fades, then explores. All film checks pass and explore works.
